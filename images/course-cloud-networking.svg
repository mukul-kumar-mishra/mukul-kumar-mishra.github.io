<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Cloud networking: trace the packet, measure the wait</title>
  <desc id="desc">An illustrated packet journey from browser to resolver, edge, transit network, load balancer, and service, with DNS, TCP, TLS, and request latency components plotted on a timing ruler.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1"><stop stop-color="#101e2e"/><stop offset="1" stop-color="#222c43"/></linearGradient>
    <radialGradient id="earth"><stop stop-color="#56c6b4" stop-opacity=".46"/><stop offset="1" stop-color="#477ca2" stop-opacity=".08"/></radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d6e8ff" opacity=".18"/></pattern>
  </defs>
  <rect width="1200" height="680" rx="34" fill="url(#night)"/><rect width="1200" height="680" rx="34" fill="url(#dots)"/>
  <circle cx="890" cy="316" r="228" fill="url(#earth)" stroke="#7fa6be" stroke-opacity=".45" stroke-width="2"/>
  <ellipse cx="890" cy="316" rx="228" ry="88" fill="none" stroke="#7fa6be" stroke-opacity=".24"/><ellipse cx="890" cy="316" rx="100" ry="228" fill="none" stroke="#7fa6be" stroke-opacity=".22"/>
  <path d="M674 289c58-47 91-73 148-72 67 1 87 63 143 55 46-7 69-38 118-27M701 382c58 7 95-28 145-17 59 13 82 64 145 48 41-10 59-40 105-47" fill="none" stroke="#74d4c4" stroke-width="3" opacity=".66"/>
  <path d="M190 354C366 180 513 477 680 299S1000 185 1085 364" fill="none" stroke="#d4ec74" stroke-width="3" stroke-dasharray="7 12"/>
  <text x="73" y="80" fill="#d4ec74" font-family="ui-monospace,monospace" font-size="16" letter-spacing="4">PACKET JOURNAL / CLOUD NETWORKING</text>
  <text x="72" y="148" fill="#f4f5ee" font-family="Georgia,serif" font-size="56">Every millisecond has a route.</text>
  <text x="76" y="189" fill="#b7c5d1" font-family="ui-monospace,monospace" font-size="18">follow one request; name every wait; measure the tail</text>
  <g font-family="ui-monospace,monospace" text-anchor="middle">
    <g><circle cx="190" cy="354" r="27" fill="#152c3b" stroke="#d4ec74" stroke-width="3"/><text x="190" y="360" fill="#f4f5ee" font-size="12">BROWSER</text><circle cx="462" cy="336" r="27" fill="#152c3b" stroke="#6ad0c1" stroke-width="3"/><text x="462" y="342" fill="#f4f5ee" font-size="12">DNS</text><circle cx="680" cy="299" r="27" fill="#152c3b" stroke="#6ad0c1" stroke-width="3"/><text x="680" y="305" fill="#f4f5ee" font-size="12">EDGE</text><circle cx="884" cy="250" r="27" fill="#152c3b" stroke="#6ad0c1" stroke-width="3"/><text x="884" y="256" fill="#f4f5ee" font-size="12">TRANSIT</text><circle cx="1085" cy="364" r="27" fill="#152c3b" stroke="#d4ec74" stroke-width="3"/><text x="1085" y="370" fill="#f4f5ee" font-size="11">SERVICE</text></g>
    <text x="326" y="286" fill="#bac8d6" font-size="13">cache? TTL</text><text x="570" y="399" fill="#bac8d6" font-size="13">route + RTT</text><text x="779" y="202" fill="#bac8d6" font-size="13">AS path</text><text x="982" y="443" fill="#bac8d6" font-size="13">TLS + app</text>
  </g>
  <rect x="71" y="500" width="1058" height="126" rx="18" fill="#111c2a" fill-opacity=".92" stroke="#6f8799" stroke-opacity=".6"/>
  <text x="99" y="532" fill="#d4ec74" font-family="ui-monospace,monospace" font-size="14">ONE REQUEST · ILLUSTRATIVE CRITICAL PATH (NOT TO SCALE)</text>
  <g transform="translate(100 552)" font-family="ui-monospace,monospace" font-size="12"><rect width="155" height="38" rx="7" fill="#415d70"/><rect x="161" width="226" height="38" rx="7" fill="#296f78"/><rect x="393" width="215" height="38" rx="7" fill="#5f597e"/><rect x="614" width="162" height="38" rx="7" fill="#947144"/><rect x="782" width="212" height="38" rx="7" fill="#416952"/><text x="77" y="24" fill="#fff" text-anchor="middle">DNS lookup</text><text x="274" y="24" fill="#fff" text-anchor="middle">TCP connect + RTT</text><text x="500" y="24" fill="#fff" text-anchor="middle">TLS handshake</text><text x="695" y="24" fill="#fff" text-anchor="middle">request</text><text x="888" y="24" fill="#fff" text-anchor="middle">response + render</text></g>
</svg>
