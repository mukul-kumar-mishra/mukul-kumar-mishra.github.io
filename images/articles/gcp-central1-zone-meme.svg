<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Google's detailed customer-impact window and status-header window differ by three minutes</title>
  <desc id="desc">For the September 1, 2026 us-central1 network incident, Google's final report gives customer impact from 07:41 to 11:52 US/Pacific, or four hours and eleven minutes. The status-page header gives 07:44 to 11:52, or four hours and eight minutes. Google says technicians disconnected fiber paths within thirteen minutes.</desc>
  <style>
    text{font-family:Inter,Arial,sans-serif}.desktop{display:block}.mobile{display:none}
    @media(max-width:700px){.desktop{display:none}.mobile{display:block}}
  </style>
  <rect width="1200" height="680" fill="#101a2c"/><rect width="1200" height="78" fill="#0b1423"/>
  <text x="54" y="48" font-size="16" font-weight="700" letter-spacing="2" fill="#67d5cb">GCP US-CENTRAL1 / SEPTEMBER 1 INCIDENT</text>
  <g class="desktop">
    <text x="54" y="139" font-size="34" font-weight="750" fill="#f2f6fb">The report and status header start three minutes apart.</text>
    <text x="56" y="178" font-size="18" fill="#b6c5d8">Both end at 11:52 US/Pacific. Google's final report uses 07:41 for customer impact.</text>
    <rect x="54" y="230" width="526" height="208" rx="16" fill="#192741" stroke="#405776" stroke-width="2"/>
    <rect x="54" y="230" width="7" height="208" rx="3" fill="#67d5cb"/>
    <text x="82" y="270" font-size="14" font-weight="700" letter-spacing="1.5" fill="#67d5cb">DETAILED CUSTOMER-IMPACT WINDOW</text>
    <text x="82" y="327" font-size="40" font-weight="750" fill="#f2f6fb">07:41–11:52 PT</text>
    <text x="82" y="378" font-size="24" font-weight="700" fill="#f2f6fb">4h 11m</text>
    <text x="190" y="378" font-size="17" fill="#b6c5d8">Final report, September 10</text>
    <rect x="620" y="230" width="526" height="208" rx="16" fill="#192741" stroke="#405776" stroke-width="2"/>
    <rect x="620" y="230" width="7" height="208" rx="3" fill="#ffb36b"/>
    <text x="648" y="270" font-size="14" font-weight="700" letter-spacing="1.5" fill="#ffb36b">STATUS-PAGE HEADER WINDOW</text>
    <text x="648" y="327" font-size="40" font-weight="750" fill="#f2f6fb">07:44–11:52 PT</text>
    <text x="648" y="378" font-size="24" font-weight="700" fill="#f2f6fb">4h 08m</text>
    <text x="756" y="378" font-size="17" fill="#b6c5d8">Incident record</text>
    <rect x="54" y="466" width="1092" height="102" rx="14" fill="#283751" stroke="#405776" stroke-width="2"/>
    <text x="80" y="504" font-size="14" font-weight="700" letter-spacing="1.5" fill="#67d5cb">PHYSICAL DISCONNECTION</text>
    <text x="80" y="542" font-size="22" font-weight="700" fill="#f2f6fb">Fiber paths across affected devices were disconnected within 13 minutes.</text>
    <text x="56" y="633" font-size="13" fill="#b6c5d8">Source: Google Cloud Status, incident J5ia5t9p3g9Q5Wi7r8Ev; final report (Sep 10) and addendum (Sep 29).</text>
  </g>
  <g class="mobile">
    <text x="44" y="133" font-size="38" font-weight="750" fill="#f2f6fb">Two reported time windows</text>
    <text x="46" y="168" font-size="26" fill="#b6c5d8">Both end at 11:52 PT · Sep 1, 2026</text>
    <rect x="42" y="198" width="1116" height="132" rx="14" fill="#192741" stroke="#405776" stroke-width="2"/>
    <text x="68" y="235" font-size="23" font-weight="700" fill="#67d5cb">FINAL REPORT · CUSTOMER IMPACT</text>
    <text x="68" y="282" font-size="39" font-weight="750" fill="#f2f6fb">07:41–11:52 PT · 4h 11m</text>
    <rect x="42" y="347" width="1116" height="132" rx="14" fill="#192741" stroke="#405776" stroke-width="2"/>
    <text x="68" y="384" font-size="23" font-weight="700" fill="#ffb36b">STATUS-PAGE HEADER</text>
    <text x="68" y="431" font-size="39" font-weight="750" fill="#f2f6fb">07:44–11:52 PT · 4h 08m</text>
    <rect x="42" y="496" width="1116" height="100" rx="14" fill="#283751" stroke="#405776" stroke-width="2"/>
    <text x="68" y="536" font-size="25" font-weight="700" fill="#67d5cb">FIBER PATHS DISCONNECTED WITHIN 13 MINUTES</text>
    <text x="46" y="643" font-size="17" fill="#b6c5d8">Source: Google Cloud Status · final report Sep 10; addendum Sep 29.</text>
  </g>
</svg>
