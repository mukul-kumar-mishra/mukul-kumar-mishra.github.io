<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">GPT-6 Astra evaluation results under different safeguards</title>
  <desc id="desc">A mobile-friendly comparison of OpenAI's 100 percent aggregate ExploitBench score and 39 percent internal-port arbitrary-code-execution rate with UK AISI's approximately 29 percent simulated supply-chain attack stage. The evaluations used different safeguards; AISI simulated all tool calls and could not reach live systems.</desc>
  <style>text{font-family:Arial,Inter,sans-serif}.mono{font-family:Consolas,"Liberation Mono",monospace}</style>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <rect width="1200" height="66" fill="#0f172a"/>
  <text x="38" y="44" class="mono" font-size="30" font-weight="700" fill="#f8fafc">GPT-6 ASTRA · THREE TESTS</text>
  <text x="55" y="118" font-size="48" font-weight="700" fill="#0f172a">Different tests. Different safeguards.</text>
  <rect x="50" y="145" width="1100" height="120" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="78" y="182" class="mono" font-size="32" font-weight="700" fill="#0f172a">OPENAI · EXPLOITBENCH</text>
  <text x="78" y="239" class="mono" font-size="52" font-weight="700" fill="#e11d48">100%</text>
  <text x="300" y="222" class="mono" font-size="34" fill="#334155">aggregate score · known V8 N-days</text>
  <text x="300" y="254" class="mono" font-size="34" fill="#334155">tested without production safeguards</text>
  <rect x="50" y="278" width="1100" height="120" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="78" y="315" class="mono" font-size="32" font-weight="700" fill="#0f172a">OPENAI · INTERNAL PORT</text>
  <text x="78" y="372" class="mono" font-size="50" font-weight="700" fill="#0369a1">39.0%</text>
  <text x="300" y="355" class="mono" font-size="32" fill="#334155">20 high-severity V8 cases · Daybreak Blue</text>
  <text x="300" y="387" class="mono" font-size="32" fill="#334155">two previously unknown zero-days</text>
  <rect x="50" y="411" width="1100" height="122" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="78" y="448" class="mono" font-size="32" font-weight="700" fill="#0f172a">UK AISI · SIMULATED</text>
  <text x="78" y="506" class="mono" font-size="50" font-weight="700" fill="#16a34a">~29%</text>
  <text x="300" y="488" class="mono" font-size="32" fill="#334155">most severe simulated attack stage</text>
  <text x="300" y="521" class="mono" font-size="32" fill="#334155">classifiers off · tool calls simulated</text>
  <rect x="50" y="547" width="1100" height="96" rx="12" fill="#0f172a"/>
  <text x="78" y="582" class="mono" font-size="31" font-weight="700" fill="#f8fafc">AISI comparison: GPT-5.6 Sol ~6% · GPT-5.5 0%*</text>
  <text x="78" y="615" class="mono" font-size="27" fill="#dbeafe">*Smaller seed set. No live systems or real-world harm.</text>
  <text x="78" y="636" class="mono" font-size="22" fill="#94a3b8">Sources: OpenAI system card · UK AISI arXiv:2609.38415v1</text>
</svg>
