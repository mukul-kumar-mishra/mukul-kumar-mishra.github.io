<svg xmlns="http://www.w3.org/2000/svg" width="390" height="700" viewBox="0 0 390 700" role="img">
  <title>GPT-6 Astra benchmark conditions vs UK AISI simulation</title>
  <desc>Comparison of OpenAI reported cyber benchmarks against UK AISI simulated evaluation under distinct safeguards.</desc>
<rect width="390" height="700" fill="#080F1C"/>
  <rect x="10" y="10" width="370" height="680" rx="12" fill="#141F33" stroke="#24344F" stroke-width="1.4"/>
  <text x="24.0" y="42.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#7DD3C7" letter-spacing="1.5">GPT-6 ASTRA / CYBER</text>
  <text x="24.0" y="72.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#EAF1FA">Test Condition Splits</text>
  <line x1="24" y1="88" x2="366" y2="88" stroke="#2F4A6E" stroke-width="1"/>
  <rect x="24.0" y="110.0" width="342.0" height="130.0" rx="8" fill="#101C2F" stroke="#7DD3C7" stroke-width="1.4"/>
  <text x="36.0" y="136.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#7DD3C7">OpenAI Benchmarks</text>
  <text x="36.0" y="160.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">- 100% on ExploitBench tasks</text>
  <text x="36.0" y="180.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">- 39% on internal cyber benchmarks</text>
  <text x="36.0" y="200.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">- Designated 'Critical' capability</text>
  <text x="36.0" y="220.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">- Standard safety classifiers enabled</text>
  <rect x="24.0" y="260.0" width="342.0" height="130.0" rx="8" fill="#101C2F" stroke="#F2B263" stroke-width="1.4"/>
  <text x="36.0" y="286.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#F2B263">UK AISI Simulation</text>
  <text x="36.0" y="310.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">- Approx 29% simulated attack success</text>
  <text x="36.0" y="330.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">- Cyber classifiers disabled for eval</text>
  <text x="36.0" y="350.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">- All external tool calls simulated</text>
  <text x="36.0" y="370.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">- Not a production attack rate</text>
  <rect x="24.0" y="410.0" width="342.0" height="90.0" rx="8" fill="#101C2F" stroke="#2F4A6E" stroke-width="1.2"/>
  <text x="36.0" y="438.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#EAF1FA">Key Distinction</text>
  <text x="36.0" y="460.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">Different conditions and safeguards:</text>
  <text x="36.0" y="478.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">neither score equals real-world attack risk.</text>
  <text x="24.0" y="660.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="10" font-weight="400" fill="#64748B">OpenAI Preparedness report; UK AISI evaluation</text>
</svg>
