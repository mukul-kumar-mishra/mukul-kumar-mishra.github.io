<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">The LiteLLM credential chain from May 27 to October 21, 2026</title>
  <desc id="desc">A master key committed to a public repository on May 27 was not revoked. On October 10 the Agent Platform API returned an organization owner's GitHub CLI token; two throwaway CI workflows then posted a second and third maintainer's tokens to an attacker endpoint. On October 21 the owner token overrode branch protection, a maintainer token approved the release, and a third token deleted the run records.</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f2d2d"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#fbf7ef"/>
  <text x="50" y="62" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#171412">The credential chain</text>
  <text x="50" y="94" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6b5b4e">May 27 → October 10 → October 21, 2026 · all times UTC</text>

  <rect x="40" y="135" width="208" height="310" rx="16" fill="#f5ecdf" stroke="#d8c9b3"/>
  <text x="58" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8f2d2d">MAY 27</text>
  <text x="58" y="194" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#171412">18:53:14</text>
  <line x1="58" y1="210" x2="230" y2="210" stroke="#d8c9b3"/>
  <text x="58" y="240" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#171412">Public config</text>
  <text x="58" y="264" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171412">commit</text>
  <text x="58" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b5b4e">Agent Platform</text>
  <text x="58" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b5b4e">master key</text>
  <text x="58" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8f2d2d">Force-pushed over.</text>
  <text x="58" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8f2d2d">Not revoked.</text>

  <line x1="252" y1="290" x2="268" y2="290" stroke="#8f2d2d" stroke-width="3" marker-end="url(#arrow2)"/>

  <rect x="272" y="135" width="208" height="310" rx="16" fill="#f5ecdf" stroke="#d8c9b3"/>
  <text x="290" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#b07a10">OCT 10</text>
  <text x="290" y="194" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#171412">21:27:10</text>
  <line x1="290" y1="210" x2="462" y2="210" stroke="#d8c9b3"/>
  <text x="290" y="240" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#171412">Agent Platform</text>
  <text x="290" y="264" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171412">API call</text>
  <text x="290" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b5b4e">Returns the owner's</text>
  <text x="290" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b5b4e">GitHub CLI token</text>
  <text x="290" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b5b4e">From 69.48.229.143</text>

  <line x1="484" y1="290" x2="500" y2="290" stroke="#8f2d2d" stroke-width="3" marker-end="url(#arrow2)"/>

  <rect x="504" y="135" width="208" height="310" rx="16" fill="#f5ecdf" stroke="#d8c9b3"/>
  <text x="522" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8f2d2d">OCT 10</text>
  <text x="522" y="194" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#171412">22:11:45</text>
  <text x="522" y="212" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#171412">22:12:09</text>
  <line x1="522" y1="226" x2="694" y2="226" stroke="#d8c9b3"/>
  <text x="522" y="254" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#171412">Two CI</text>
  <text x="522" y="278" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#171412">workflows</text>
  <text x="522" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b5b4e">Post GH_TOKEN and</text>
  <text x="522" y="328" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b5b4e">RELEASE_PLEASE_TOKEN</text>
  <text x="522" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b5b4e">to an attacker webhook</text>

  <line x1="716" y1="290" x2="732" y2="290" stroke="#8f2d2d" stroke-width="3" marker-end="url(#arrow2)"/>

  <rect x="736" y="135" width="208" height="310" rx="16" fill="#f5ecdf" stroke="#d8c9b3"/>
  <text x="754" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8f2d2d">OCT 21</text>
  <text x="754" y="194" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#171412">10:08:34</text>
  <line x1="754" y1="210" x2="926" y2="210" stroke="#d8c9b3"/>
  <text x="754" y="240" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#171412">Owner token</text>
  <text x="754" y="264" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171412">overrides</text>
  <text x="754" y="286" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171412">branch protection</text>
  <text x="754" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b5b4e">Source set to</text>
  <text x="754" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b5b4e">Berri-AI/litellm</text>
  <text x="754" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b5b4e">Staging 10:46:39</text>

  <line x1="948" y1="290" x2="964" y2="290" stroke="#8f2d2d" stroke-width="3" marker-end="url(#arrow2)"/>

  <rect x="968" y="135" width="192" height="310" rx="16" fill="#f5ecdf" stroke="#d8c9b3"/>
  <text x="986" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#b07a10">OCT 21</text>
  <text x="986" y="194" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#171412">11:11:18</text>
  <text x="986" y="212" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#171412">11:53:49</text>
  <line x1="986" y1="226" x2="1142" y2="226" stroke="#d8c9b3"/>
  <text x="986" y="254" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#171412">Two</text>
  <text x="986" y="278" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#171412">maintainer</text>
  <text x="986" y="302" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#171412">tokens</text>
  <text x="986" y="332" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b5b4e">Approve the gate,</text>
  <text x="986" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b5b4e">then delete the</text>
  <text x="986" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b5b4e">run records.</text>

  <line x1="144" y1="480" x2="1064" y2="480" stroke="#8f2d2d" stroke-width="2"/>
  <circle cx="144" cy="480" r="6" fill="#8f2d2d"/>
  <circle cx="376" cy="480" r="6" fill="#8f2d2d"/>
  <circle cx="608" cy="480" r="6" fill="#8f2d2d"/>
  <circle cx="840" cy="480" r="6" fill="#8f2d2d"/>
  <circle cx="1064" cy="480" r="6" fill="#8f2d2d"/>

  <rect x="40" y="518" width="1120" height="80" rx="14" fill="#f4e6d2" stroke="#d8a83e"/>
  <text x="62" y="548" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#8f2d2d">A force-push removed the key from view. It did not revoke it.</text>
  <text x="62" y="578" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#171412">The final report says the first token came from the Agent Platform, not from internal LiteLLM logs.</text>
  <text x="40" y="650" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b5b4e">Source: LiteLLM final attack-chain report, Oct 23 2026. Times UTC. IPs, branches and token hashes are published in that report.</text>
</svg>
