<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Themed flow diagram of one answer engine query from retrieval through rerank prefill and decode with relative cost labels">
  <rect x="0" y="0" width="1200" height="600" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="600" fill="none" stroke="#0f172a" stroke-width="6"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a"/>
  <text x="36" y="41" font-family="monospace" font-size="22" font-weight="bold" letter-spacing="3" fill="#16a34a">FIELD DIAGRAM</text>
  <text x="948" y="41" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">Mukul<tspan dx="10" fill="#16a34a">Mishra</tspan></text>
  <text x="60" y="122" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">ONE QUESTION, FIVE BILLS</text>
  <text x="60" y="156" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="21" font-style="italic" fill="#475569">eleven words in. a factory shift out.</text>
  <g font-family="Sora, 'Segoe UI', Verdana, sans-serif">
    <rect x="60" y="200" width="180" height="150" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
    <text x="80" y="238" font-size="19" font-weight="bold" fill="#0f172a">RETRIEVAL</text>
    <text x="80" y="268" font-size="16" fill="#475569">thousands of</text>
    <text x="80" y="292" font-size="16" fill="#475569">candidates</text>
    <text x="80" y="326" font-size="18" font-weight="bold" fill="#0369a1">cheap</text>
    <text x="258" y="285" font-size="34" font-weight="bold" fill="#0f172a">--&gt;</text>
    <rect x="300" y="200" width="180" height="150" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
    <text x="320" y="238" font-size="19" font-weight="bold" fill="#0f172a">RERANK</text>
    <text x="320" y="268" font-size="16" fill="#475569">a handful</text>
    <text x="320" y="292" font-size="16" fill="#475569">survive</text>
    <text x="320" y="326" font-size="18" font-weight="bold" fill="#b45309">picky</text>
    <text x="498" y="285" font-size="34" font-weight="bold" fill="#0f172a">--&gt;</text>
    <rect x="540" y="200" width="240" height="150" fill="#e11d48" stroke="#0f172a" stroke-width="4"/>
    <text x="560" y="238" font-size="19" font-weight="bold" fill="#ffffff">PREFILL</text>
    <text x="560" y="268" font-size="16" fill="#ffffff">12,000 tokens</text>
    <text x="560" y="292" font-size="16" fill="#ffffff">at once</text>
    <text x="560" y="326" font-size="20" font-weight="bold" fill="#ffffff">$$$$</text>
    <text x="798" y="285" font-size="34" font-weight="bold" fill="#0f172a">--&gt;</text>
    <rect x="840" y="200" width="300" height="150" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
    <text x="860" y="238" font-size="19" font-weight="bold" fill="#0f172a">DECODE</text>
    <text x="860" y="268" font-size="16" fill="#475569">400 tokens,</text>
    <text x="860" y="292" font-size="16" fill="#475569">one by one</text>
    <text x="860" y="326" font-size="20" font-weight="bold" fill="#16a34a">$</text>
  </g>
  <text x="60" y="386" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="19" fill="#475569">prefill grows with grounding quality. better answers mean heavier prefills.</text>
  <text x="60" y="412" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="19" fill="#475569">the footnote has a GPU bill attached.</text>
  <rect x="60" y="430" width="1080" height="110" fill="#0f172a"/>
  <text x="90" y="475" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="25" font-weight="bold" fill="#f8fafc">the answer is the cheapest part</text>
  <text x="90" y="515" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="25" font-weight="bold" fill="#16a34a">of the answer.</text>
</svg>
