<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">ShareChat reported a tenfold feature-system cost reduction</title>
  <desc id="desc">Illustrative normalized index from 100 to 10 for ShareChat's reported tenfold feature-system cost reduction. The index has no dollar amounts and does not allocate savings to individual optimizations.</desc>
  <style>text{font-family:Arial,Inter,sans-serif}.mono{font-family:Consolas,"Liberation Mono",monospace}</style>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <rect width="1200" height="66" fill="#0f172a"/>
  <text x="38" y="44" class="mono" font-size="30" font-weight="700" fill="#f8fafc">SHARECHAT · FEATURE-SYSTEM COST</text>
  <text x="55" y="123" font-size="50" font-weight="700" fill="#0f172a">Reported cost reduction: 10×</text>
  <text x="58" y="158" font-size="34" fill="#475569">Normalized index · not dollar amounts or invoice totals</text>
  <rect x="55" y="190" width="1090" height="132" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="82" y="243" class="mono" font-size="32" font-weight="700" fill="#475569">REPORTED BASELINE</text>
  <text x="82" y="300" class="mono" font-size="52" font-weight="700" fill="#0f172a">100</text>
  <rect x="330" y="222" width="780" height="70" rx="8" fill="#475569"/>
  <rect x="348" y="239" width="744" height="36" rx="4" fill="#64748b"/>
  <rect x="55" y="340" width="1090" height="132" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="82" y="393" class="mono" font-size="32" font-weight="700" fill="#15803d">REPORTED INDEX</text>
  <text x="82" y="450" class="mono" font-size="52" font-weight="700" fill="#15803d">10</text>
  <rect x="330" y="372" width="780" height="70" rx="8" fill="#e2e8f0"/>
  <rect x="348" y="389" width="74" height="36" rx="4" fill="#84cc16"/>
  <path d="M890 330v-15m0 0-15 15m15-15 15 15" fill="none" stroke="#e11d48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="55" y="490" width="1090" height="150" rx="12" fill="#0f172a"/>
  <text x="82" y="529" class="mono" font-size="32" font-weight="700" fill="#f8fafc">ShareChat reports 10× lower feature-system costs</text>
  <text x="82" y="565" class="mono" font-size="30" fill="#dbeafe">over the preceding year; no dollar baseline is published.</text>
  <text x="82" y="599" class="mono" font-size="28" fill="#dbeafe">The report does not allocate savings by optimization.</text>
  <text x="82" y="627" class="mono" font-size="22" fill="#94a3b8">Source: ShareChat Engineering, March 6, 2025</text>
</svg>
