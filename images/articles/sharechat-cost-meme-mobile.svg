<svg xmlns="http://www.w3.org/2000/svg" width="390" height="700" viewBox="0 0 390 700" role="img">
  <title>ShareChat feature store 10x reduction</title>
  <desc>Normalized index illustrating ShareChat reported 10x reduction across its feature store systems.</desc>
<rect width="390" height="700" fill="#080F1C"/>
  <rect x="10" y="10" width="370" height="680" rx="12" fill="#141F33" stroke="#24344F" stroke-width="1.4"/>
  <text x="24.0" y="42.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#7DD3C7" letter-spacing="1.5">SHARECHAT / FEATURE STORE</text>
  <text x="24.0" y="72.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#EAF1FA">10x Load Reduction</text>
  <line x1="24" y1="88" x2="366" y2="88" stroke="#2F4A6E" stroke-width="1"/>
  <rect x="24.0" y="110.0" width="342.0" height="100.0" rx="8" fill="#101C2F" stroke="#7DD3C7" stroke-width="1.4"/>
  <text x="40.0" y="146.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="36" font-weight="700" fill="#7DD3C7">10x</text>
  <text x="40.0" y="172.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#EAF1FA">reduction across feature systems</text>
  <text x="40.0" y="192.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">supported by printed row-read endpoints</text>
  <rect x="24.0" y="230.0" width="342.0" height="120.0" rx="8" fill="#101C2F" stroke="#2F4A6E" stroke-width="1.2"/>
  <text x="36.0" y="258.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#7FC4E8">Optimization Stages</text>
  <text x="36.0" y="280.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">- Row reshaping: packed sparse columns</text>
  <text x="36.0" y="300.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">- Tile selection: pruned unused dimensions</text>
  <text x="36.0" y="320.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">- Cache locality: hot features in Redis</text>
  <text x="36.0" y="340.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">- Deduplication: merged candidate fetches</text>
  <rect x="24.0" y="370.0" width="342.0" height="80.0" rx="8" fill="#101C2F" stroke="#F2B263" stroke-width="1.2"/>
  <text x="36.0" y="398.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#F2B263">Claim Discipline</text>
  <text x="36.0" y="420.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">2024 account 100x label conflicts with</text>
  <text x="36.0" y="438.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">printed 10x row-read endpoints.</text>
  <text x="24.0" y="660.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="10" font-weight="400" fill="#64748B">ShareChat engineering posts; feature store teardown</text>
</svg>
