<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Two browser clients submit concurrent edits to one Figma document process, which orders the accepted edit and sends canonical state back over WebSockets.">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9db3cf"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#67d5bf"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .eyebrow{font-size:14px;font-weight:700;letter-spacing:2px;fill:#74d7c5}
      .title{font-size:31px;font-weight:700;fill:#f2f6fc}
      .subtitle{font-size:17px;fill:#b9c7da}
      .client{fill:#1a2940;stroke:#476382;stroke-width:2}
      .owner{fill:#253149;stroke:#f2a45f;stroke-width:2.5}
      .state{fill:#183a42;stroke:#67d5bf;stroke-width:2.5}
      .label{font-size:14px;font-weight:700;letter-spacing:1px;fill:#73d6c4}
      .heading{font-size:20px;font-weight:700;fill:#f2f6fc}
      .body{font-size:15px;fill:#c4d0df}
      .small{font-size:13px;fill:#9fb0c5}
    </style>
  </defs>
  <rect width="1200" height="630" rx="30" fill="#0d1728"/>
  <rect x="24" y="24" width="1152" height="582" rx="22" fill="#142137" stroke="#263a55" stroke-width="2"/>
  <text x="60" y="61" class="eyebrow">FIGMA MULTIPLAYER / CONFLICT RESOLUTION</text>
  <image x="1010" y="34" width="132" height="48" preserveAspectRatio="xMaxYMid meet" href="../logo.png"/>
  <text x="60" y="111" class="title">One owner orders every document edit.</text>
  <text x="60" y="142" class="subtitle">Clients edit optimistically; one process validates changes and broadcasts canonical state.</text>

  <rect x="60" y="205" width="270" height="112" rx="13" class="client"/>
  <text x="84" y="235" class="label">CLIENT A</text>
  <text x="84" y="269" class="heading">Move the block</text>
  <text x="84" y="294" class="body">sets position to x = 40</text>

  <rect x="60" y="355" width="270" height="112" rx="13" class="client"/>
  <text x="84" y="385" class="label">CLIENT B</text>
  <text x="84" y="419" class="heading">Move the same block</text>
  <text x="84" y="444" class="body">sets position to x = 80</text>

  <path d="M330 261H370V282H405" fill="none" stroke="#9db3cf" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M330 411H370V368H405" fill="none" stroke="#9db3cf" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="415" y="223" width="340" height="204" rx="15" class="owner"/>
  <text x="442" y="257" class="label" fill="#ffbd83">DOCUMENT OWNER</text>
  <text x="442" y="294" class="heading">Serialize + validate</text>
  <line x1="442" y1="311" x2="728" y2="311" stroke="#405775" stroke-width="1.5"/>
  <text x="442" y="343" class="body">Same property: later accepted edit wins</text>
  <text x="442" y="371" class="body">Unrelated edits can both survive</text>
  <text x="442" y="402" class="small">Invalid tree moves are rejected</text>

  <path d="M755 325H820" fill="none" stroke="#67d5bf" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <rect x="830" y="250" width="290" height="150" rx="14" class="state"/>
  <text x="854" y="283" class="label">CANONICAL DOCUMENT</text>
  <text x="854" y="326" class="heading">x = 80</text>
  <text x="854" y="354" class="body">latest accepted position</text>
  <text x="854" y="381" class="small">ordered update fans back over WebSockets</text>

  <rect x="60" y="515" width="1060" height="57" rx="12" fill="#0d1728" stroke="#263a55" stroke-width="1.5"/>
  <text x="84" y="550" class="heading">One document. One owner. One ordered history.</text>
  <text x="60" y="594" class="small">Illustrative same-property conflict; see the article for protocol details and modeled costs.</text>
</svg>
