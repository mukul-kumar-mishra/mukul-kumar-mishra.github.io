<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc">
  <title id="title">Google's reported us-west1 capacity-failure sequence</title>
  <desc id="desc">Scheduled fiber maintenance reduced inter-datacenter capacity. Automated rerouting did not properly redistribute traffic to alternate capacity. Traffic exceeded the available bandwidth, causing congestion, packet loss, request throttling, latency and service errors. This is a Buildopsy illustration, not Google's network topology.</desc>
  <style>text{font-family:Inter,Arial,sans-serif}</style>
  <rect width="390" height="660" fill="#f8fafc"/><rect width="390" height="58" fill="#0f172a"/>
  <text x="18" y="24" font-size="10" font-weight="700" letter-spacing="1.1" fill="#f8fafc">GCP US-WEST1 · AUG 20, 2026</text>
  <text x="18" y="83" font-size="20" font-weight="750" fill="#0f172a">Reported failure sequence</text>
  <text x="18" y="105" font-size="12" fill="#475569">Google Cloud's final incident report</text>
  <rect x="18" y="126" width="354" height="78" rx="9" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="31" y="151" font-size="11" font-weight="700" fill="#475569">1 · SCHEDULED FIBER WORK</text>
  <text x="31" y="180" font-size="12" fill="#0f172a">Inter-datacenter capacity fell</text>
  <path d="M195 206v8m-5-4 5 5 5-5" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="18" y="217" width="354" height="78" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="31" y="242" font-size="11" font-weight="700" fill="#92400e">2 · AVAILABLE CAPACITY FELL</text>
  <text x="31" y="271" font-size="12" fill="#0f172a">Less bandwidth between data centers</text>
  <path d="M195 297v8m-5-4 5 5 5-5" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="18" y="308" width="354" height="78" rx="9" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="31" y="333" font-size="11" font-weight="700" fill="#9f1239">3 · REROUTING SHORTFALL</text>
  <text x="31" y="362" font-size="12" fill="#0f172a">Not properly redistributed to alternate capacity</text>
  <path d="M195 388v8m-5-4 5 5 5-5" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="18" y="399" width="354" height="78" rx="9" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="31" y="424" font-size="11" font-weight="700" fill="#9f1239">4 · CONGESTION</text>
  <text x="31" y="453" font-size="12" fill="#0f172a">Traffic exceeded available bandwidth</text>
  <rect x="18" y="500" width="354" height="79" rx="9" fill="#0f172a"/>
  <text x="31" y="525" font-size="11" font-weight="700" fill="#fda4af">REPORTED EFFECTS</text>
  <text x="31" y="552" font-size="12" font-weight="700" fill="#f8fafc">Packet loss · throttling · latency · errors</text>
  <text x="18" y="610" font-size="10" fill="#475569">Buildopsy illustration, not network topology. No capacity values disclosed.</text>
  <text x="18" y="638" font-size="10" fill="#475569">Source: Google Cloud Status · final report, Aug 27, 2026.</text>
</svg>
