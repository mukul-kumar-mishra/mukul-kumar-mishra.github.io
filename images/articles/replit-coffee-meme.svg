<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Pen sketched meme of an exhausted man pressing retry forever beside a coffee cup">
  <defs>
    <filter id="roughen" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1200" height="680" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="680" fill="none" stroke="#0f172a" stroke-width="6"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a"/>
  <text x="36" y="41" font-family="monospace" font-size="22" font-weight="bold" letter-spacing="3" fill="#16a34a">FIELD MEME</text>
  <text x="948" y="41" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">Mukul<tspan dx="10" fill="#16a34a">Mishra</tspan></text>
  <text x="60" y="122" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">ONE MORE RETRY. FOREVER.</text>
  <text x="60" y="156" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="21" font-style="italic" fill="#475569">attempt 48. the package has not changed.</text>
  <g transform="translate(250,400)" filter="url(#roughen)" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="0" cy="-80" r="30" fill="#ffffff"/>
    <path d="M-16,-86 l18,0 M4,-86 l18,0"/>
    <path d="M-14,-76 l14,0 M6,-76 l14,0"/>
    <path d="M-8,-56 l16,0"/>
    <rect x="-26" y="-48" width="52" height="98" fill="#ffffff"/>
    <path d="M26,-30 L120,-10"/>
  </g>
  <g filter="url(#roughen)" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none">
    <rect x="620" y="230" width="120" height="130" fill="#ffffff"/>
    <text x="640" y="275" font-family="monospace" font-size="19" fill="#0f172a" stroke="none">RETRY</text>
    <path d="M330,350 L610,300" stroke="#e11d48"/>
    <rect x="400" y="400" width="70" height="90" fill="#ffffff"/>
    <path d="M410,380 q4,-14 0,-24 M430,380 q4,-14 0,-24" stroke="#475569"/>
    <text x="408" y="445" font-family="monospace" font-size="16" fill="#0f172a" stroke="none">coffee</text>
  </g>
  <rect x="60" y="540" width="1080" height="80" fill="#0f172a"/>
  <text x="90" y="590" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="25" font-weight="bold" fill="#f8fafc">the definition of insanity,</text>
  <text x="640" y="590" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="25" font-weight="bold" fill="#16a34a">billed per event.</text>
</svg>
