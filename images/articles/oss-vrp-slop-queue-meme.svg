<text x="452.0" y="326.0" font-size="20" font-weight="700" fill="#f2f6fb" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="452.0" dy="0">Triage burns reviewer</tspan><tspan x="452.0" dy="24.0">hours</tspan></text>
