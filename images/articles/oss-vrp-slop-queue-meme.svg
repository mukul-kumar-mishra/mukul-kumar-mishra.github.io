<text x="78.0" y="558.0" font-size="16" font-weight="600" fill="#f2f6fb" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="78.0" dy="0">Report counts and per-report AI attribution are not public. This audit assigns no individual filing to AI.</tspan></text>
