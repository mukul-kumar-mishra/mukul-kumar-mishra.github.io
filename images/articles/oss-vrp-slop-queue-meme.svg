<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="img-title img-desc">
<title id="img-title">The queue filled with almost-vulnerabilities.</title>
<desc id="img-desc">Google paused OSS VRP product intake Oct 1 over invalid AI-driven reports. The supply-chain lane stayed open. 1 / FLOOD, Plausible filings arrive, Hallucinated bugs · Non-security coding errors. 2 / JAM, Triage burns reviewer hours, Each false claim needs proof · Real bugs queue behind fiction. 3 / PAUSE, Product lane closes Oct 1, Supply chain stays open · Restart update due Q1 2027</desc>
