  <text x="31" y="360" font-size="13" font-weight="700" fill="#eff8ff">5h 41m</text>
  <text x="18" y="432" font-size="17" font-weight="750" fill="#eff8ff">12h30 + 5h41 = 18h11 active</text>
  <text x="18" y="458" font-size="12" fill="#b5d0df">29h46 elapsed · 11h35 between windows</text>
