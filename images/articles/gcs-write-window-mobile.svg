<svg xmlns="http://www.w3.org/2000/svg" width="390" height="570" viewBox="0 0 390 570" role="img" aria-labelledby="title desc">
  <title id="title">Two separate GCS write-impact windows total 18 hours and 11 minutes</title>
  <desc id="desc">Google's final report lists an October 8 us-central1 write-impact window of 12 hours and 30 minutes and an October 9 us-central1-b recurrence of 5 hours and 41 minutes. Their active durations total 18 hours and 11 minutes. The elapsed start-to-final-end span is 29 hours and 46 minutes, with 11 hours and 35 minutes between the listed windows.</desc>
