  <rect width="390" height="570" fill="#0b2032"/><rect width="390" height="58" fill="#071727"/>
  <text x="18" y="24" font-size="10" font-weight="700" letter-spacing="1.1" fill="#6ddbd0">INCIDENT WINDOWS / GOOGLE CLOUD STORAGE</text>
  <text x="18" y="82" font-size="21" font-weight="750" fill="#eff8ff">Two write-impact windows</text>
  <text x="18" y="104" font-size="12" fill="#b5d0df">All times US/Pacific · October 8–9, 2026</text>
  <rect x="18" y="124" width="354" height="126" rx="10" fill="#102b41" stroke="#37617a" stroke-width="1.5"/>
  <text x="31" y="151" font-size="12" font-weight="700" fill="#ffc078">FIRST · OCT 8 · US-CENTRAL1</text>
  <text x="31" y="184" font-size="19" font-weight="750" fill="#eff8ff">04:00–16:30 PT</text>
  <text x="31" y="218" font-size="13" font-weight="700" fill="#eff8ff">12h 30m</text>
  <rect x="18" y="266" width="354" height="126" rx="10" fill="#15364d" stroke="#37617a" stroke-width="1.5"/>
  <text x="31" y="293" font-size="12" font-weight="700" fill="#6ddbd0">RECURRENCE · OCT 9 · US-CENTRAL1-B</text>
