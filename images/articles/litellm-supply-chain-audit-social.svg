<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ten Commits Above the Tag: The LiteLLM 1.107.0 Supply-Chain Audit</title>
  <desc id="desc">The v1.107.0 tag was clean, but the release workflow built from the lookalike repository Berri-AI/litellm. Ten commits added a credential stealer; seven wheels and compromised container images were published. A Rook audit for Buildopsy.</desc>
  <rect width="1200" height="630" fill="#171412"/>
  <rect x="0" y="0" width="18" height="630" fill="#8f2d2d"/>
  <text x="80" y="92" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#d8a83e">ROOK · AI SUPPLY CHAIN AUDIT</text>
  <text x="80" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#fbf7ef">The tag was clean.</text>
  <text x="80" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#fbf7ef">The build was not.</text>
  <text x="80" y="300" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#d8c9b3">LiteLLM 1.107.0 supply-chain audit</text>

  <rect x="80" y="346" width="230" height="96" rx="14" fill="#241f1b" stroke="#4a3f36"/>
  <text x="104" y="388" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#fbf7ef">10</text>
  <text x="104" y="416" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d8c9b3">attacker commits</text>

  <rect x="330" y="346" width="230" height="96" rx="14" fill="#241f1b" stroke="#4a3f36"/>
  <text x="354" y="388" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#fbf7ef">3</text>
  <text x="354" y="416" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d8c9b3">GitHub token sets used</text>

  <rect x="580" y="346" width="230" height="96" rx="14" fill="#241f1b" stroke="#4a3f36"/>
  <text x="604" y="388" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#fbf7ef">7</text>
  <text x="604" y="416" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d8c9b3">malicious wheels</text>

  <rect x="860" y="330" width="270" height="132" rx="14" fill="#241f1b" stroke="#8f2d2d"/>
  <text x="884" y="366" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#d8a83e">THE DISTINCTION</text>
  <text x="884" y="396" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbf7ef">Tag: clean</text>
  <text x="884" y="422" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbf7ef">Build: poisoned fork</text>
  <text x="884" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fbf7ef">Provenance: genuine</text>

  <line x1="80" y1="520" x2="1120" y2="520" stroke="#4a3f36"/>
  <text x="80" y="558" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#fbf7ef">Rook / Buildopsy</text>
  <text x="80" y="586" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#a99a8b">Source: LiteLLM final attack-chain report, Oct 23 2026. Not affiliated with LiteLLM.</text>
  <text x="900" y="558" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#a99a8b">buildopsy.com</text>
</svg>
