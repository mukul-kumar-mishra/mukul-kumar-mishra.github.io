<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="el-title el-desc">
  <title id="el-title">PHP2Shell exposure ladder: five different denominators, from website prevalence to confirmed compromise</title>
  <desc id="el-desc">A ladder of figures that are often conflated. About 70 percent of websites use PHP in a W3Techs crawl. VirusTotal fingerprints about 5.1 million PHP IP addresses, about 3.8 million with an open port, and about 1.1 million that disclose a version. Of those, about 272 thousand run a supported branch, about 758 thousand run end-of-life PHP 5.4 through 8.1, and about 88 thousand run PHP 5.2 or 5.3. A separate panel shows Qualys data from 12,000 customers: 154 million instances, 110 million on end-of-life branches and 44 million on supported branches without the fix, with 199 thousand patched within 12 hours. The final rung is zero publicly confirmed compromises, not proof that none occurred.</desc>
  <defs>
    <linearGradient id="el-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a101c"/>
      <stop offset="1" stop-color="#111a2b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#el-bg)"/>

  <text x="60" y="58" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Five numbers called “exposure”</text>
  <text x="60" y="84" fill="#93a4bd" font-family="Segoe UI, Arial, sans-serif" font-size="12">Different denominators, different methods. None of them is a compromise count.</text>

  <!-- Row 1 -->
  <text x="60" y="132" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">~70% of websites</text>
  <text x="60" y="150" fill="#93a4bd" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">W3Techs crawl share; share, not hosts</text>
  <rect x="300" y="120" width="436" height="30" rx="5" fill="#b6f36a" opacity="0.72"/>
  <text x="318" y="140" fill="#0a101c" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">prevalence, not vulnerability</text>

  <!-- Row 2 -->
  <text x="60" y="207" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">~5.1M PHP IPs</text>
  <text x="60" y="225" fill="#93a4bd" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">VirusTotal fingerprint, Oct 21</text>
  <rect x="300" y="195" width="420" height="30" rx="5" fill="#6fe3ff" opacity="0.75"/>
  <text x="318" y="215" fill="#0a101c" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">fingerprinted PHP IPs</text>

  <!-- Row 3 -->
  <text x="60" y="277" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">~3.8M with an open port</text>
  <text x="60" y="295" fill="#93a4bd" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">Of the 5.1M fingerprinted</text>
  <rect x="300" y="265" width="330" height="30" rx="5" fill="#b79cff" opacity="0.75"/>
  <text x="318" y="285" fill="#0a101c" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">reachable right now</text>

  <!-- Row 4 -->
  <text x="60" y="347" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">~1.1M disclose a version</text>
  <text x="60" y="365" fill="#93a4bd" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">About four in five hide the banner</text>
  <rect x="300" y="335" width="180" height="30" rx="5" fill="#ffc857" opacity="0.8"/>
  <text x="318" y="355" fill="#0a101c" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">the visible subset</text>

  <!-- Row 5 -->
  <circle cx="312" cy="410" r="6" fill="#ff7a7a"/>
  <text x="60" y="405" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">0 publicly confirmed compromises</text>
  <text x="60" y="423" fill="#93a4bd" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">As of 00:50 UTC, Oct 24, 2026 — not proof of zero</text>
  <text x="330" y="417" fill="#ff9a9a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">the only rung measured in confirmed victims</text>

  <!-- Zoom panel -->
  <rect x="60" y="435" width="700" height="140" rx="10" fill="#162034" stroke="#2a3a55"/>
  <text x="80" y="457" fill="#b6f36c" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">ZOOM: THE ~1.1M THAT DISCLOSE A VERSION</text>
  <rect x="80" y="470" width="161" height="26" fill="#b6f36c"/>
  <rect x="241" y="470" width="448" height="26" fill="#ffc857"/>
  <rect x="689" y="470" width="51" height="26" fill="#6f8098"/>
  <text x="160" y="466" text-anchor="middle" fill="#b6f36c" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">272K supported</text>
  <text x="465" y="466" text-anchor="middle" fill="#ffc857" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">758K EOL 5.4–8.1</text>
  <text x="715" y="466" text-anchor="end" fill="#9fb0c7" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">88K pre-5.4</text>
  <text x="80" y="515" fill="#c9d5e6" font-family="Segoe UI, Arial, sans-serif" font-size="11">272K + 758K + 88K = 1.118M disclosing hosts; 758K ÷ 1.118M ≈ 67.8% are EOL 5.4–8.1.</text>
  <text x="80" y="535" fill="#93a4bd" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">A host is not an installation, and a disclosed version is not a confirmed vulnerable build.</text>
  <text x="80" y="555" fill="#93a4bd" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">~85K run the exact releases from Sept 24 — current, until the fix.</text>

  <!-- Right panel -->
  <rect x="800" y="120" width="340" height="480" rx="10" fill="#162034" stroke="#2a3a55"/>
  <text x="820" y="150" fill="#6fe3ff" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">A DIFFERENT POPULATION</text>
  <text x="820" y="172" fill="#93a4bd" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">Qualys, anonymized data from 12,000 customers</text>
  <text x="820" y="218" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">154M</text>
  <text x="820" y="240" fill="#c9d5e6" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">instances on branches that had no vendor</text>
  <text x="820" y="255" fill="#c9d5e6" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">fix or no applied fix</text>
  <rect x="820" y="272" width="199" height="22" fill="#ffc857"/>
  <rect x="1019" y="272" width="81" height="22" fill="#6fe3ff"/>
  <text x="820" y="312" fill="#ffc857" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700">110M EOL (71%)</text>
  <text x="1019" y="312" fill="#6fe3ff" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700">44M supported</text>
  <text x="1019" y="327" fill="#6fe3ff" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700">unpatched</text>
  <text x="820" y="365" fill="#b6f36c" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">199K patched in 12 hours</text>
  <text x="820" y="386" fill="#93a4bd" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">Instances, not internet hosts.</text>
  <text x="820" y="401" fill="#93a4bd" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">Not a compromise count.</text>
  <text x="820" y="428" fill="#c9d5e6" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">110M + 44M = 154M;</text>
  <text x="820" y="443" fill="#c9d5e6" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">110M ÷ 154M ≈ 71.4%, matching</text>
  <text x="820" y="458" fill="#c9d5e6" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">Qualys’ 71% EOL share.</text>
  <line x1="820" y1="478" x2="1120" y2="478" stroke="#2a3a55"/>
  <text x="820" y="500" fill="#ffc857" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">Zero is the only rung measured in</text>
  <text x="820" y="515" fill="#ffc857" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">confirmed victims. Zero public</text>
  <text x="820" y="530" fill="#ffc857" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="600">confirmation is not proof of zero.</text>
  <text x="820" y="558" fill="#93a4bd" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">Different population. Do not divide</text>
  <text x="820" y="573" fill="#93a4bd" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">199K by 154M as a patch rate.</text>

  <text x="60" y="604" fill="#e8eef8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">70% ≠ 5.1M ≠ 3.8M ≠ 1.1M ≠ 272K/758K/88K ≠ compromised hosts</text>
  <text x="60" y="620" fill="#6f8098" font-family="Segoe UI, Arial, sans-serif" font-size="9">Sources: W3Techs via Cloudflare (Oct 21); VirusTotal (Oct 21); Qualys via SecurityWeek (Oct 23); PHP.net advisories. Counts are fingerprints or instances, not confirmed vulnerable installations.</text>
</svg>
