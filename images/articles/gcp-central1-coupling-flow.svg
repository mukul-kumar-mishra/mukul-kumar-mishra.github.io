<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Maintenance sequencing failure led to fiber isolation in Google's us-central1 incident</title>
  <desc id="desc">Google's final report says a scheduled router capacity upgrade used incompatible optical transceivers. The manually issued work list omitted one-router-at-a-time instructions and expected human and software verification. Technicians unplugged all fiber paths across the affected devices within thirteen minutes, isolating compute capacity from the network.</desc>
  <style>
    text{font-family:Inter,Arial,sans-serif}.desktop{display:block}.mobile{display:none}
    @media(max-width:700px){.desktop{display:none}.mobile{display:block}}
  </style>
  <rect width="1200" height="680" fill="#101a2c"/><rect width="1200" height="78" fill="#0b1423"/>
  <text x="54" y="48" font-size="16" font-weight="700" letter-spacing="2" fill="#67d5cb">MAINTENANCE SEQUENCE / GOOGLE'S FINAL REPORT</text>
  <g class="desktop">
    <text x="54" y="139" font-size="34" font-weight="750" fill="#f2f6fb">Fiber isolation followed missing work controls.</text>
    <text x="56" y="178" font-size="18" fill="#b6c5d8">A scheduled capacity upgrade became a multi-path disconnection.</text>
    <rect x="54" y="237" width="244" height="230" rx="15" fill="#192741" stroke="#405776" stroke-width="2"/>
    <text x="76" y="274" font-size="14" font-weight="700" letter-spacing="1.4" fill="#67d5cb">1 / PLANNED WORK</text>
    <text x="76" y="321" font-size="22" font-weight="700" fill="#f2f6fb"><tspan x="76">Router capacity</tspan><tspan x="76" dy="27">upgrade</tspan></text>
    <text x="76" y="391" font-size="17" fill="#b6c5d8"><tspan x="76">Routine maintenance on</tspan><tspan x="76" dy="23">data-center routers</tspan></text>
    <path d="M302 352h20" stroke="#b6c5d8" stroke-width="3"/><path d="m316 343 9 9-9 9" fill="none" stroke="#b6c5d8" stroke-width="3"/>
    <rect x="330" y="237" width="244" height="230" rx="15" fill="#202e46" stroke="#405776" stroke-width="2"/>
    <text x="352" y="274" font-size="14" font-weight="700" letter-spacing="1.4" fill="#ffb36b">2 / HARDWARE</text>
    <text x="352" y="321" font-size="22" font-weight="700" fill="#f2f6fb"><tspan x="352">Incompatible</tspan><tspan x="352" dy="27">transceivers</tspan></text>
    <text x="352" y="391" font-size="17" fill="#b6c5d8"><tspan x="352">New optics did not match</tspan><tspan x="352" dy="23">the remaining fabric</tspan></text>
    <path d="M578 352h20" stroke="#b6c5d8" stroke-width="3"/><path d="m592 343 9 9-9 9" fill="none" stroke="#b6c5d8" stroke-width="3"/>
    <rect x="606" y="237" width="244" height="230" rx="15" fill="#192741" stroke="#405776" stroke-width="2"/>
    <text x="628" y="274" font-size="14" font-weight="700" letter-spacing="1.4" fill="#ffb36b">3 / WORKFLOW</text>
    <text x="628" y="321" font-size="22" font-weight="700" fill="#f2f6fb"><tspan x="628">Sequence and</tspan><tspan x="628" dy="27">checks missing</tspan></text>
    <text x="628" y="391" font-size="17" fill="#b6c5d8"><tspan x="628">Work list omitted one-router-</tspan><tspan x="628" dy="23">at-a-time safeguards</tspan></text>
    <path d="M854 352h20" stroke="#b6c5d8" stroke-width="3"/><path d="m868 343 9 9-9 9" fill="none" stroke="#b6c5d8" stroke-width="3"/>
    <rect x="882" y="237" width="264" height="230" rx="15" fill="#202e46" stroke="#ff846e" stroke-width="2"/>
    <text x="904" y="274" font-size="14" font-weight="700" letter-spacing="1.4" fill="#ff846e">4 / CUSTOMER IMPACT</text>
    <text x="904" y="321" font-size="22" font-weight="700" fill="#f2f6fb"><tspan x="904">Fiber paths</tspan><tspan x="904" dy="27">disconnected</tspan></text>
    <text x="904" y="391" font-size="17" fill="#b6c5d8"><tspan x="904">All paths lost within</tspan><tspan x="904" dy="23">13 minutes</tspan></text>
    <rect x="54" y="497" width="1092" height="82" rx="14" fill="#283751" stroke="#405776" stroke-width="2"/>
    <text x="80" y="548" font-size="21" font-weight="700" fill="#f2f6fb">Reported result: compute capacity in the affected clusters was isolated from the network.</text>
    <text x="56" y="633" font-size="13" fill="#b6c5d8">Source: Google Cloud Status, incident J5ia5t9p3g9Q5Wi7r8Ev; Root Cause and Remediation sections, Sep 10.</text>
  </g>
  <g class="mobile">
    <text x="44" y="133" font-size="38" font-weight="750" fill="#f2f6fb">Maintenance failure sequence</text>
    <text x="46" y="168" font-size="25" fill="#b6c5d8">Google's final report · Sep 1, 2026</text>
    <rect x="42" y="191" width="1116" height="81" rx="12" fill="#192741" stroke="#405776" stroke-width="2"/>
    <text x="66" y="224" font-size="25" font-weight="700" fill="#67d5cb">1 · ROUTER CAPACITY UPGRADE</text>
    <text x="66" y="254" font-size="22" fill="#f2f6fb">Scheduled maintenance on data-center routers</text>
    <path d="M600 276v13" stroke="#b6c5d8" stroke-width="3"/><path d="m591 284 9 9 9-9" fill="none" stroke="#b6c5d8" stroke-width="3"/>
    <rect x="42" y="296" width="1116" height="81" rx="12" fill="#202e46" stroke="#405776" stroke-width="2"/>
    <text x="66" y="329" font-size="25" font-weight="700" fill="#ffb36b">2 · INCOMPATIBLE TRANSCEIVERS</text>
    <text x="66" y="359" font-size="22" fill="#f2f6fb">Replacement optics did not match remaining fabric</text>
    <path d="M600 381v13" stroke="#b6c5d8" stroke-width="3"/><path d="m591 389 9 9 9-9" fill="none" stroke="#b6c5d8" stroke-width="3"/>
    <rect x="42" y="401" width="1116" height="81" rx="12" fill="#192741" stroke="#405776" stroke-width="2"/>
    <text x="66" y="434" font-size="25" font-weight="700" fill="#ffb36b">3 · SEQUENCE AND CHECKS MISSING</text>
    <text x="66" y="464" font-size="22" fill="#f2f6fb">Manual work list lacked one-router-at-a-time controls</text>
    <path d="M600 486v13" stroke="#b6c5d8" stroke-width="3"/><path d="m591 494 9 9 9-9" fill="none" stroke="#b6c5d8" stroke-width="3"/>
    <rect x="42" y="506" width="1116" height="81" rx="12" fill="#202e46" stroke="#ff846e" stroke-width="2"/>
    <text x="66" y="539" font-size="25" font-weight="700" fill="#ff846e">4 · FIBER PATHS DISCONNECTED</text>
    <text x="66" y="569" font-size="22" fill="#f2f6fb">Affected compute capacity isolated within 13 minutes</text>
    <text x="46" y="643" font-size="17" fill="#b6c5d8">Source: Google Cloud Status · final report, Sep 10, 2026.</text>
  </g>
</svg>
