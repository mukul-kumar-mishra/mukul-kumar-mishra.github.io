<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">The pacing rule as geometry: a relative GC target crosses the absolute container ceiling exactly once</title>
  <desc id="desc">A diagonal twice-live-heap line rises against live heap size. A horizontal container ceiling and a lower soft-limit line cross it. Right of the crossing is the OOM trap; far left is the GC burn region.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a2c"/><stop offset="1" stop-color="#182944"/></linearGradient>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#eaf1fa}.muted{fill:#a8bad0}.kicker{font-size:16px;font-weight:700;letter-spacing:2px;fill:#7dd3c7}.head{font-size:30px;font-weight:700}.label{font-size:19px;font-weight:700}.sub{font-size:15px}.mono{font-family:monospace}.axis{stroke:#8faac5;stroke-width:2}.diag{stroke:#ed9b55;stroke-width:4}.ceil{stroke:#df5e60;stroke-width:3;stroke-dasharray:10 7}.soft{stroke:#7dd3c7;stroke-width:3;stroke-dasharray:4 6}.zonehot{fill:#df5e60;opacity:.13}.zonewarm{fill:#ed9b55;opacity:.12}.zonesafe{fill:#7dd3c7;opacity:.10}
    </style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="58" y="60" class="kicker">THE PACING RULE / GEOMETRY</text>
  <text x="58" y="105" class="head">A relative target crosses an absolute ceiling exactly once.</text>
  <text x="58" y="139" class="muted" font-size="18">x: live heap. y: where the next collection fires. nextGC = min(2x live, limit).</text>

  <polygon points="640,180 1142,180 1142,560 640,560" class="zonesafe"/>
  <polygon points="120,180 640,180 640,560 120,560" class="zonewarm"/>

  <line x1="120" y1="560" x2="1142" y2="560" class="axis"/>
  <line x1="120" y1="560" x2="120" y2="180" class="axis"/>
  <text x="1050" y="600" class="sub muted">live heap -></text>
  <text x="40" y="200" class="sub muted">GC</text>
  <text x="28" y="224" class="sub muted">target</text>

  <line x1="250" y1="560" x2="950" y2="259" class="diag"/>
  <text x="330" y="500" class="label" fill="#ed9b55" transform="rotate(-23 330 500)">2x live heap (GOGC=100)</text>

  <line x1="120" y1="330" x2="1142" y2="330" class="ceil"/>
  <text x="880" y="312" class="label" fill="#df5e60">container ceiling (hard)</text>

  <line x1="120" y1="392" x2="1142" y2="392" class="soft"/>
  <text x="880" y="424" class="label" fill="#7dd3c7">soft limit (~0.9 x ceiling)</text>

  <circle cx="785" cy="330" r="9" fill="#eaf1fa"/>
  <text x="801" y="300" class="label">crossing</text>
  <text x="801" y="354" class="sub muted">2x live = ceiling</text>

  <text x="750" y="212" class="label" fill="#df5e60">OOM TRAP - no limit</text>
  <text x="750" y="238" class="sub muted">target clears the ceiling:</text>
  <text x="750" y="260" class="sub muted">GC sleeps, killer wakes</text>

  <text x="140" y="212" class="label" fill="#ed9b55">GC BURN</text>
  <text x="140" y="238" class="sub muted">target far below ceiling:</text>
  <text x="140" y="260" class="sub muted">collecting over headroom</text>

  <text x="700" y="470" class="label" fill="#7dd3c7">PACED</text>
  <text x="700" y="496" class="sub muted">limit binds first:</text>
  <text x="700" y="518" class="sub muted">cycles track the ceiling</text>

  <text x="58" y="622" class="label" font-size="20">Growth-paced when memory is plentiful. Ceiling-paced when it is not. The limit decides which.</text>
  <text x="58" y="656" class="muted" font-size="14">Simplified geometry of Go GC pacing at default GOGC. Soft-limit behavior follows the Go team's GC guide.</text>
<image x="996" y="620" width="145" height="53" preserveAspectRatio="xMaxYMid meet" href="../logo.png"/>
</svg>
