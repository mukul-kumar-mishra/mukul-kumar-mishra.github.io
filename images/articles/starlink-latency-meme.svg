<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Starlink latency whitepaper: reported changes, driver categories and disclosure limits</title>
  <desc id="desc">SpaceX reports that US peak-hour median latency changed from 48.5 to 33 milliseconds and p99 from over 150 to under 65 milliseconds. The whitepaper names propagation, ground layout, fronthaul scheduling and software or buffer delays as drivers, but does not give a measured contribution for each fix. A stable 20 millisecond median is a stated goal.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: ui-monospace, Consolas, monospace; }
      .title { font-size: 29px; font-weight: 750; fill: #eff8ff; }
      .subtitle { font-size: 16px; fill: #b5d0df; }
      .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 1.3px; }
      .metric { font-size: 27px; font-weight: 750; fill: #eff8ff; }
      .label { font-size: 15px; font-weight: 700; fill: #eff8ff; }
      .body { font-size: 14px; fill: #c2d4df; }
      .small { font-size: 12px; fill: #b5d0df; }
    </style>
  </defs>
  <rect width="1200" height="680" fill="#0b2032"/>
  <rect width="1200" height="78" fill="#071727"/>
  <text x="40" y="48" font-size="18" font-weight="800" fill="#eff8ff">STARLINK LATENCY · WHITEPAPER SUMMARY</text>
  <text x="1155" y="48" text-anchor="end" font-size="21" font-weight="800" fill="#eff8ff">Build<tspan fill="#6ddbd0">opsy</tspan></text>
  <text class="title" x="54" y="130">SpaceX reports improvement, not a per-fix split.</text>
  <text class="subtitle" x="56" y="166">US peak-hour figures; the 20ms stable median is a stated goal.</text>
  <path d="M54 190H1146" stroke="#37617a" stroke-width="1" opacity="0.8"/>

  <rect x="54" y="220" width="344" height="270" rx="16" fill="#102b41" stroke="#37617a" stroke-width="2"/>
  <rect x="54" y="220" width="6" height="270" rx="3" fill="#91e2c5"/>
  <text class="eyebrow" x="78" y="256" fill="#91e2c5">REPORTED RESULT</text>
  <text class="metric" x="78" y="308">48.5 → 33ms</text>
  <text class="label" x="78" y="338">US peak-hour median</text>
  <text class="body" x="78" y="380">SpaceX reports a reduction</text>
  <text class="body" x="78" y="402">over 30%.</text>
  <path d="M78 424H374" stroke="#37617a" stroke-width="1"/>
  <text class="label" x="78" y="454">p99: &gt;150 → &lt;65ms</text>
  <text class="small" x="78" y="475">over 60%, as reported</text>

  <rect x="428" y="220" width="344" height="270" rx="16" fill="#15364d" stroke="#37617a" stroke-width="2"/>
  <rect x="428" y="220" width="6" height="270" rx="3" fill="#ffc078"/>
  <text class="eyebrow" x="452" y="256" fill="#ffc078">DRIVER CATEGORIES NAMED</text>
  <text class="label" x="452" y="302">Propagation</text>
  <text class="body" x="452" y="324">SpaceX estimates 1.8–3.6ms per leg.</text>
  <text class="label" x="452" y="360">Ground layout</text>
  <text class="label" x="452" y="392">Fronthaul scheduling</text>
  <text class="label" x="452" y="424">Processing, buffers, queues, WiFi</text>
  <text class="small" x="452" y="462">Listed by SpaceX; contribution per fix undisclosed.</text>

  <rect x="802" y="220" width="344" height="270" rx="16" fill="#102b41" stroke="#37617a" stroke-width="2"/>
  <rect x="802" y="220" width="6" height="270" rx="3" fill="#6ddbd0"/>
  <text class="eyebrow" x="826" y="256" fill="#6ddbd0">WHAT REMAINS OPEN</text>
  <text class="metric" x="826" y="308">No per-fix</text>
  <text class="metric" x="826" y="340">measurement</text>
  <text class="body" x="826" y="386">The 48.5ms-to-33ms change is</text>
  <text class="body" x="826" y="408">an aggregate result, not a set of</text>
  <text class="body" x="826" y="430">measured component reductions.</text>
  <text class="label" x="826" y="466">20ms = stated median goal</text>

  <rect x="54" y="520" width="1092" height="72" rx="14" fill="#15364d" stroke="#37617a" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="eyebrow" x="78" y="550" fill="#6ddbd0">MEASUREMENT SCOPE</text>
  <text class="body" x="78" y="575">Millions of anonymized router measurements · 15-second averages · US peak hours 6–9 PM local</text>
  <text class="mono small" x="56" y="636">SOURCE: SpaceX, “Improving Starlink's Latency” · Archive date: March 7, 2024 · PDF itself undated</text>
</svg>
