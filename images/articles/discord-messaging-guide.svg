<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Discord message storage architecture diagram">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#0369a1" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="680" fill="#f8fafc"/>
  <text x="60" y="64" font-family="sans-serif" font-size="30" font-weight="bold" fill="#0f172a">DISCORD: THOUSANDS OF READERS IN, ONE QUERY OUT</text>
  <text x="60" y="100" font-family="sans-serif" font-size="20" fill="#475569">Coalescing sits between the crowd and the cluster. The engine swap finished the job.</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="60" y="150" width="320" height="150" rx="14" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
    <text x="220" y="205" font-size="26" font-weight="bold" fill="#0f172a">CHANNEL CROWD</text>
    <text x="220" y="240" font-size="20" fill="#475569">thousands of readers</text>
    <text x="220" y="268" font-size="20" fill="#475569">one hot partition</text>
    <rect x="440" y="150" width="320" height="150" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
    <text x="600" y="205" font-size="26" font-weight="bold" fill="#0f172a">RUST MERGER</text>
    <text x="600" y="240" font-size="20" fill="#475569">hash by channel</text>
    <text x="600" y="268" font-size="20" fill="#475569">ask once</text>
    <rect x="820" y="150" width="320" height="150" rx="14" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
    <text x="980" y="205" font-size="26" font-weight="bold" fill="#0f172a">SCYLLADB: 72</text>
    <text x="980" y="240" font-size="20" fill="#475569">same protocol</text>
    <text x="980" y="268" font-size="20" fill="#475569">no pause tax</text>
    <rect x="60" y="370" width="320" height="150" rx="14" fill="#ffffff" stroke="#e11d48" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="220" y="425" font-size="26" font-weight="bold" fill="#0f172a">OLD: 177 NODES</text>
    <text x="220" y="460" font-size="20" fill="#475569">hot set saturated</text>
    <text x="220" y="488" font-size="20" fill="#475569">p99 near 125ms</text>
    <rect x="440" y="370" width="320" height="150" rx="14" fill="#ffffff" stroke="#83663e" stroke-width="3"/>
    <text x="600" y="425" font-size="26" font-weight="bold" fill="#0f172a">QUORUM READS</text>
    <text x="600" y="460" font-size="20" fill="#475569">majority replicas</text>
    <text x="600" y="488" font-size="20" fill="#475569">hotspot multiplies</text>
    <rect x="820" y="370" width="320" height="150" rx="14" fill="#ffffff" stroke="#83663e" stroke-width="3"/>
    <text x="980" y="425" font-size="26" font-weight="bold" fill="#0f172a">DENSE DISKS</text>
    <text x="980" y="460" font-size="20" fill="#475569">persistent plus NVMe</text>
    <text x="980" y="488" font-size="20" fill="#475569">p99 at 15ms</text>
  </g>
  <g stroke="#0369a1" stroke-width="2.5">
    <line x1="380" y1="225" x2="432" y2="225" marker-end="url(#arr3)"/>
    <line x1="760" y1="225" x2="812" y2="225" marker-end="url(#arr3)"/>
    <line x1="600" y1="300" x2="600" y2="362" marker-end="url(#arr3)"/>
  </g>
  <text x="60" y="590" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0f172a">The crowd was the capacity all along. 177 nodes down to 72.</text>
  <text x="1140" y="640" font-family="sans-serif" font-size="20" fill="#475569" text-anchor="end">buildopsy.com</text>
</svg>
