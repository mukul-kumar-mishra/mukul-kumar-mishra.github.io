<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Two separate GCS write-impact windows total 18 hours and 11 minutes</title>
  <desc id="desc">Google's final report lists an October 8 us-central1 write-impact window from 04:00 to 16:30 US/Pacific, lasting 12 hours and 30 minutes, followed by an October 9 recurrence in us-central1-b from 04:05 to 09:46, lasting 5 hours and 41 minutes. Their reported active durations sum to 18 hours and 11 minutes. Buildopsy calculates 29 hours and 46 minutes from the first start to final end, with 11 hours and 35 minutes between the reported windows.</desc>
  <style>
    text{font-family:Inter,Arial,sans-serif}.desktop{display:block}.mobile{display:none}
    @media(max-width:700px){.desktop{display:none}.mobile{display:block}}
  </style>
