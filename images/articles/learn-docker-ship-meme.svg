<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="docker-title docker-desc">
  <title id="docker-title">Docker in production: build once, ship the runtime</title>
  <desc id="docker-desc">A dark technical course banner traces a container release from ordered Dockerfile steps through reusable image layers, a pinned registry artifact, and consistent deployment nodes.</desc>
  <defs>
    <linearGradient id="docker-bg" x2="1" y2="1"><stop stop-color="#101e2e"/><stop offset="1" stop-color="#222c43"/></linearGradient>
    <pattern id="docker-dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d6e8ff" opacity=".16"/></pattern>
    <marker id="docker-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8da9bd"/></marker>
  </defs>
  <rect width="1200" height="680" rx="32" fill="url(#docker-bg)"/>
  <rect width="1200" height="680" rx="32" fill="url(#docker-dots)"/>
  <text x="70" y="73" fill="#d4ec74" font-family="ui-monospace,monospace" font-size="15" letter-spacing="3">CONTAINER FIELD GUIDE / DOCKER IN PRODUCTION</text>
  <text x="68" y="145" fill="#f4f5ee" font-family="Georgia,serif" font-size="51">Build once. Ship the runtime.</text>
  <text x="72" y="184" fill="#b9c8d5" font-family="ui-monospace,monospace" font-size="17">Layer order controls cache reuse, image size, and scan cost.</text>

  <g font-family="ui-monospace,monospace">
    <rect x="58" y="235" width="250" height="232" rx="16" fill="#142a3a" stroke="#74d4c4" stroke-width="2"/>
    <text x="80" y="270" fill="#74d4c4" font-size="13" letter-spacing="2">01 / BUILD</text>
    <text x="80" y="308" fill="#f4f5ee" font-size="23" font-weight="700">Dockerfile</text>
    <path d="M80 327H286" stroke="#496176"/>
    <text x="82" y="354" fill="#d4ec74" font-size="14">FROM builder</text>
    <text x="82" y="382" fill="#b9c8d5" font-size="13">COPY manifests</text>
    <text x="82" y="410" fill="#b9c8d5" font-size="13">RUN compile</text>
    <text x="82" y="438" fill="#b9c8d5" font-size="13">COPY source last</text>

    <rect x="350" y="235" width="250" height="232" rx="16" fill="#142a3a" stroke="#74d4c4" stroke-width="2"/>
    <text x="372" y="270" fill="#74d4c4" font-size="13" letter-spacing="2">02 / CACHE</text>
    <text x="372" y="308" fill="#f4f5ee" font-size="23" font-weight="700">Layer ledger</text>
    <rect x="373" y="331" width="202" height="25" rx="5" fill="#30465a"/><text x="385" y="349" fill="#d7e4ee" font-size="12">base image · reused</text>
    <rect x="373" y="361" width="202" height="25" rx="5" fill="#246a70"/><text x="385" y="379" fill="#f4f5ee" font-size="12">dependencies · cached</text>
    <rect x="373" y="391" width="202" height="25" rx="5" fill="#655e89"/><text x="385" y="409" fill="#f4f5ee" font-size="12">application source</text>
    <text x="373" y="445" fill="#d4ec74" font-size="12">change late · reuse early</text>

    <rect x="642" y="235" width="250" height="232" rx="16" fill="#142a3a" stroke="#aaa2dc" stroke-width="2"/>
    <text x="664" y="270" fill="#c0b8ed" font-size="13" letter-spacing="2">03 / REGISTRY</text>
    <text x="664" y="308" fill="#f4f5ee" font-size="22" font-weight="700">Pinned artifact</text>
    <path d="M664 327H870" stroke="#496176"/>
    <rect x="664" y="344" width="206" height="44" rx="8" fill="#202f45" stroke="#596781"/>
    <text x="678" y="371" fill="#d4ec74" font-size="14">sha256: digest</text>
    <circle cx="676" cy="418" r="5" fill="#74d4c4"/>
    <text x="690" y="423" fill="#b9c8d5" font-size="12">scan this exact digest</text>
    <text x="664" y="448" fill="#b9c8d5" font-size="12">tag · verify · retain</text>

    <rect x="934" y="235" width="208" height="232" rx="16" fill="#142a3a" stroke="#d4ec74" stroke-width="2"/>
    <text x="956" y="270" fill="#d4ec74" font-size="13" letter-spacing="2">04 / DEPLOY</text>
    <text x="956" y="308" fill="#f4f5ee" font-size="22" font-weight="700">Same image</text>
    <rect x="956" y="337" width="70" height="48" rx="8" fill="#202f45" stroke="#74d4c4"/>
    <rect x="1044" y="337" width="76" height="48" rx="8" fill="#202f45" stroke="#74d4c4"/>
    <text x="991" y="367" fill="#f4f5ee" font-size="12" text-anchor="middle">node A</text>
    <text x="1082" y="367" fill="#f4f5ee" font-size="12" text-anchor="middle">node B</text>
    <path d="M991 385V405M1082 385V405M991 405H1082" stroke="#74d4c4" stroke-width="2" fill="none"/>
    <text x="956" y="436" fill="#b9c8d5" font-size="12">reproducible rollout</text>
  </g>

  <path d="M310 351H339M602 351H631M894 351H923" fill="none" stroke="#d4ec74" stroke-width="3" stroke-dasharray="6 7" marker-end="url(#docker-arrow)"/>
  <rect x="58" y="502" width="1084" height="112" rx="16" fill="#111c2a" fill-opacity=".95" stroke="#637c91" stroke-opacity=".65"/>
  <text x="84" y="535" fill="#d4ec74" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">THE RELEASE CONTRACT</text>
  <text x="84" y="579" fill="#f4f5ee" font-family="ui-monospace,monospace" font-size="17">stable steps → reusable layers → pinned digest → measured deployment</text>
</svg>
