<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Notion system design diagram">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#0369a1" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="680" fill="#f8fafc"/>
  <text x="60" y="64" font-family="sans-serif" font-size="30" font-weight="bold" fill="#0f172a">NOTION: ONE BLOCK IN, SIX WORKLOADS OUT</text>
  <text x="60" y="100" font-family="sans-serif" font-size="20" fill="#475569">Online traffic on shards. Offline history in the lake. Retrieval in search plus vectors.</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="60" y="150" width="320" height="150" rx="14" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
    <text x="220" y="205" font-size="26" font-weight="bold" fill="#0f172a">BROWSERS</text>
    <text x="220" y="240" font-size="20" fill="#475569">optimistic edits</text>
    <text x="220" y="268" font-size="20" fill="#475569">HTTPS plus sockets</text>
    <rect x="440" y="150" width="320" height="150" rx="14" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
    <text x="600" y="205" font-size="26" font-weight="bold" fill="#0f172a">API PLUS AUTH</text>
    <text x="600" y="240" font-size="20" fill="#475569">permissions first</text>
    <text x="600" y="268" font-size="20" fill="#475569">then data</text>
    <rect x="820" y="150" width="320" height="150" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
    <text x="980" y="205" font-size="26" font-weight="bold" fill="#0f172a">480 SHARDS</text>
    <text x="980" y="240" font-size="20" fill="#475569">Postgres, 96 hosts</text>
    <text x="980" y="268" font-size="20" fill="#475569">canonical blocks</text>
    <rect x="60" y="370" width="320" height="150" rx="14" fill="#ffffff" stroke="#83663e" stroke-width="3"/>
    <text x="220" y="425" font-size="26" font-weight="bold" fill="#0f172a">KAFKA CDC</text>
    <text x="220" y="460" font-size="20" fill="#475569">Debezium stream</text>
    <text x="220" y="488" font-size="20" fill="#475569">fan-out begins</text>
    <rect x="440" y="370" width="320" height="150" rx="14" fill="#ffffff" stroke="#83663e" stroke-width="3"/>
    <text x="600" y="425" font-size="26" font-weight="bold" fill="#0f172a">HUDI LAKE ON S3</text>
    <text x="600" y="460" font-size="20" fill="#475569">raw plus cleaned</text>
    <text x="600" y="488" font-size="20" fill="#475569">cheap replay</text>
    <rect x="820" y="370" width="320" height="150" rx="14" fill="#ffffff" stroke="#e11d48" stroke-width="3"/>
    <text x="980" y="425" font-size="26" font-weight="bold" fill="#0f172a">SEARCH PLUS AI</text>
    <text x="980" y="460" font-size="20" fill="#475569">text plus vectors</text>
    <text x="980" y="488" font-size="20" fill="#475569">tiered by heat</text>
  </g>
  <g stroke="#0369a1" stroke-width="2.5">
    <line x1="380" y1="225" x2="432" y2="225" marker-end="url(#arr2)"/>
    <line x1="760" y1="225" x2="812" y2="225" marker-end="url(#arr2)"/>
    <line x1="980" y1="300" x2="980" y2="362" marker-end="url(#arr2)"/>
    <line x1="220" y1="300" x2="220" y2="362" marker-end="url(#arr2)"/>
    <line x1="600" y1="300" x2="600" y2="362" marker-end="url(#arr2)"/>
  </g>
  <text x="60" y="590" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Different questions want different homes. The lake is not a failure of Postgres.</text>
  <text x="1140" y="640" font-family="sans-serif" font-size="20" fill="#475569" text-anchor="end">buildopsy.com</text>
</svg>
