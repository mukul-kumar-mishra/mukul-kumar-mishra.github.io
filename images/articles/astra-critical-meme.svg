<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">GPT-6 Astra: separate evaluations, separate safeguards</title>
  <desc id="figure-desc">Three panels compare OpenAI-reported ExploitBench and internal benchmark results with a UK AI Security Institute simulated evaluation. The OpenAI tests report 100 percent and 39 percent under different benchmark conditions; AISI reports about 29 percent at the most severe stage of a simulated supply-chain attack evaluation with cyber classifiers disabled. The footer states that AISI used no live networks, systems, or repositories.</desc>
  <style>
    text { font-family: Arial, Inter, sans-serif; }
    .mono { font-family: Consolas, "Liberation Mono", monospace; }
  </style>
  <rect x="0" y="0" width="1200" height="680" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="680" fill="none" stroke="#0f172a" stroke-width="6"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a"/>
  <text x="36" y="41" font-size="21" font-weight="700" fill="#f8fafc">GPT-6 Astra: Separate Evaluations, Separate Conditions</text>
  <text x="1040" y="41" font-size="20" font-weight="700" fill="#f8fafc">Build<tspan fill="#16a34a">opsy</tspan></text>
  <text x="60" y="119" font-size="31" font-weight="700" fill="#0f172a">A score is not a deployment result.</text>
  <text x="60" y="153" font-size="19" fill="#475569">OpenAI capability tests and UK AISI's simulated evaluation answer different questions.</text>

  <g>
    <rect x="50" y="190" width="350" height="270" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <path d="M62 190h326a12 12 0 0 1 12 12v35H50v-35a12 12 0 0 1 12-12z" fill="#0f172a"/>
    <text x="70" y="220" class="mono" font-size="15" font-weight="700" fill="#f8fafc">OPENAI · REPORTED TEST</text>
    <text x="72" y="303" class="mono" font-size="54" font-weight="700" fill="#e11d48">100%</text>
    <text x="72" y="346" class="mono" font-size="18" font-weight="700" fill="#0f172a">ExploitBench</text>
    <text x="72" y="379" class="mono" font-size="16" fill="#475569">Known vulnerabilities</text>
    <text x="72" y="401" class="mono" font-size="15" fill="#475569">Tested without</text>
    <text x="72" y="423" class="mono" font-size="15" fill="#475569">production safeguards</text>
    <text x="72" y="448" class="mono" font-size="14" fill="#64748b">Company-reported score</text>
  </g>

  <g>
    <rect x="425" y="190" width="350" height="270" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <path d="M437 190h326a12 12 0 0 1 12 12v35H425v-35a12 12 0 0 1 12-12z" fill="#0f172a"/>
    <text x="445" y="220" class="mono" font-size="15" font-weight="700" fill="#f8fafc">OPENAI · INTERNAL PORT</text>
    <text x="447" y="303" class="mono" font-size="54" font-weight="700" fill="#0369a1">39.0%</text>
    <text x="447" y="346" class="mono" font-size="17" font-weight="700" fill="#0f172a">June–August 2026</text>
    <text x="447" y="379" class="mono" font-size="15" fill="#475569">20 high-severity V8 vulnerabilities</text>
    <text x="447" y="414" class="mono" font-size="15" fill="#475569">Two previously unknown zero-days</text>
    <text x="447" y="440" class="mono" font-size="14" fill="#64748b">Astra result: Daybreak Blue</text>
  </g>

  <g>
    <rect x="800" y="190" width="350" height="270" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <path d="M812 190h326a12 12 0 0 1 12 12v35H800v-35a12 12 0 0 1 12-12z" fill="#0f172a"/>
    <text x="820" y="220" class="mono" font-size="15" font-weight="700" fill="#f8fafc">UK AISI · SIMULATED TEST</text>
    <text x="822" y="303" class="mono" font-size="54" font-weight="700" fill="#16a34a">~29%</text>
    <text x="822" y="346" class="mono" font-size="16" font-weight="700" fill="#0f172a">Reached most severe attack stage</text>
    <text x="822" y="379" class="mono" font-size="15" fill="#475569">Cyber classifiers disabled</text>
    <text x="822" y="414" class="mono" font-size="15" fill="#475569">All tool calls simulated</text>
    <text x="822" y="440" class="mono" font-size="14" fill="#64748b">Not a production attack rate</text>
  </g>

  <rect x="50" y="490" width="1100" height="142" rx="8" fill="#0f172a"/>
  <text x="78" y="526" class="mono" font-size="16" font-weight="700" fill="#f8fafc">AISI comparison: Astra ~29% · GPT-5.6 Sol ~6% · GPT-5.5 0%*</text>
  <text x="78" y="557" class="mono" font-size="15" fill="#dbeafe">*GPT-5.5 used a smaller scenario set. AISI could not reach live networks, systems, or repositories.</text>
  <text x="78" y="588" class="mono" font-size="15" fill="#dbeafe">All AISI actions were simulated; no real-world actions or harm occurred.</text>
  <text x="78" y="615" class="mono" font-size="13" fill="#94a3b8">Sources: OpenAI GPT-6 Astra launch and system card · UK AISI, arXiv:2609.38415v1</text>
</svg>
