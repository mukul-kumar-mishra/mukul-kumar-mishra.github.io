<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Pen sketched meme of a furious man staring at a model toggle flipped to Grok">
  <defs>
    <filter id="roughen" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1200" height="680" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="680" fill="none" stroke="#0f172a" stroke-width="6"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a"/>
  <text x="36" y="41" font-family="monospace" font-size="22" font-weight="bold" letter-spacing="3" fill="#16a34a">FIELD MEME</text>
  <text x="948" y="41" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">Mukul<tspan dx="10" fill="#16a34a">Mishra</tspan></text>
  <text x="60" y="122" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">JUST A NUDGE, THEY SAID</text>
  <text x="60" y="156" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="21" font-style="italic" fill="#475569">your toggle has opinions now.</text>
  <g transform="translate(250,400)" filter="url(#roughen)" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="0" cy="-80" r="30" fill="#ffffff"/>
    <path d="M-20,-102 L0,-96 M4,-102 L22,-108"/>
    <path d="M-12,-86 L4,-84 M8,-86 L20,-88"/>
    <path d="M-2,-58 q12,-2 14,-12"/>
    <rect x="-26" y="-48" width="52" height="98" fill="#ffffff"/>
    <path d="M26,-30 L120,-55"/>
    <path d="M-64,-60 l-18,-8 M-66,-30 l-18,0 M-64,0 l-18,8"/>
  </g>
  <g filter="url(#roughen)">
    <rect x="620" y="230" width="460" height="230" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
    <rect x="620" y="230" width="460" height="46" fill="#0f172a"/>
    <text x="640" y="261" font-family="monospace" font-size="19" font-weight="bold" fill="#f8fafc">SETTINGS &gt; MODELS</text>
    <text x="640" y="320" font-family="monospace" font-size="20" fill="#475569">[ ] Grok  (you: OFF)</text>
    <text x="640" y="360" font-family="monospace" font-size="20" fill="#1e293b">active model: GROK</text>
    <text x="640" y="400" font-family="monospace" font-size="20" fill="#e11d48">toggled itself. again.</text>
    <text x="640" y="440" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="17" font-style="italic" fill="#475569">have you tried Last Used?</text>
  </g>
  <rect x="60" y="540" width="1080" height="80" fill="#0f172a"/>
  <text x="90" y="590" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="25" font-weight="bold" fill="#f8fafc">opt-out is the new opt-in.</text>
</svg>
