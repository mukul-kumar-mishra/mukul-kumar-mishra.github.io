<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="img-title img-desc">
<title id="img-title">Every 15 seconds. Everywhere at once.</title>
<desc id="img-desc">Starlink global scheduler teardown: satellites reallocated to terminals every 15 seconds at fixed boundaries, synchronized worldwide, with shifts observed even where only one satellite is visible.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8faac5"/></marker></defs>
<rect width="1200" height="680" fill="#0b2032"/>
<rect width="1200" height="78" fill="#071727"/>
<image x="40" y="9" width="174" height="60" preserveAspectRatio="xMinYMid meet" href="../logo.png"/>
<text x="244.0" y="48.0" font-size="15" font-weight="700" fill="#6ddbd0" font-family="Inter, Arial, sans-serif" text-anchor="start" letter-spacing="2"><tspan x="244.0" dy="0">SATELLITE NETWORK / GLOBAL SCHEDULER TEARDOWN</tspan></text>
<text x="54.0" y="137.0" font-size="31" font-weight="750" fill="#eff8ff" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="54.0" dy="0">Every 15 seconds. Everywhere at once.</tspan></text>
<text x="56.0" y="177.0" font-size="17" font-weight="400" fill="#b5d0df" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="56.0" dy="0">Starlink reallocates satellites to terminals in 15-second slots on a globally synchronized rhythm.</tspan></text>
<path d="M54 202H1146" stroke="#37617a" stroke-width="1" opacity="0.7"/>
<path d="M0 118H1200M0 458H1200M150 78V680M1050 78V680" stroke="#43728a" stroke-width="1" opacity="0.12"/>
<rect x="54.0" y="250" width="344.0" height="218" rx="16" fill="#102b41" stroke="#37617a" stroke-width="2"/>
<rect x="54.0" y="250" width="6" height="218" rx="3" fill="#91e2c5"/>
<text x="78.0" y="284.0" font-size="13" font-weight="700" fill="#91e2c5" font-family="Inter, Arial, sans-serif" text-anchor="start" letter-spacing="1.3"><tspan x="78.0" dy="0">1 / SLOT</tspan></text>
<text x="78.0" y="340.0" font-size="36" font-weight="750" fill="#eff8ff" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="78.0" dy="0">15 sec</tspan></text>
<text x="78.0" y="375.0" font-size="16" font-weight="700" fill="#eff8ff" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="78.0" dy="0">Reallocation interval</tspan></text>
<text x="78.0" y="414.0" font-size="14" font-weight="400" fill="#b5d0df" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="78.0" dy="0">Satellites to terminals · Load,</tspan><tspan x="78.0" dy="20.0">geography, charge weighted</tspan></text>
<path d="M401.0 359h18" fill="none" stroke="#b6c5d8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="428.0" y="250" width="344.0" height="218" rx="16" fill="#15364d" stroke="#37617a" stroke-width="2"/>
<rect x="428.0" y="250" width="6" height="218" rx="3" fill="#ffc078"/>
<text x="452.0" y="284.0" font-size="13" font-weight="700" fill="#ffc078" font-family="Inter, Arial, sans-serif" text-anchor="start" letter-spacing="1.3"><tspan x="452.0" dy="0">2 / SYNC</tspan></text>
<text x="452.0" y="340.0" font-size="36" font-weight="750" fill="#eff8ff" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="452.0" dy="0">:12/:27/:42/:57</tspan></text>
<text x="452.0" y="375.0" font-size="16" font-weight="700" fill="#eff8ff" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="452.0" dy="0">Boundaries, every minute</tspan></text>
<text x="452.0" y="414.0" font-size="14" font-weight="400" fill="#b5d0df" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="452.0" dy="0">Seen at all sites at once ·</tspan><tspan x="452.0" dy="20.0">US plus Europe together</tspan></text>
<path d="M775.0 359h18" fill="none" stroke="#b6c5d8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="802.0" y="250" width="344.0" height="218" rx="16" fill="#102b41" stroke="#37617a" stroke-width="2"/>
<rect x="802.0" y="250" width="6" height="218" rx="3" fill="#91e2c5"/>
<text x="826.0" y="284.0" font-size="13" font-weight="700" fill="#91e2c5" font-family="Inter, Arial, sans-serif" text-anchor="start" letter-spacing="1.3"><tspan x="826.0" dy="0">3 / PROOF</tspan></text>
<text x="826.0" y="340.0" font-size="36" font-weight="750" fill="#eff8ff" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="826.0" dy="0">1 sat</tspan></text>
<text x="826.0" y="375.0" font-size="16" font-weight="700" fill="#eff8ff" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="826.0" dy="0">Still shifts at boundaries</tspan></text>
<text x="826.0" y="414.0" font-size="14" font-weight="400" fill="#b5d0df" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="826.0" dy="0">Shielded dish, single candidate ·</tspan><tspan x="826.0" dy="20.0">Not a handover</tspan></text>
<rect x="54" y="496" width="1092" height="90" rx="14" fill="#15364d" stroke="#37617a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="78.0" y="527.0" font-size="13" font-weight="700" fill="#6ddbd0" font-family="Inter, Arial, sans-serif" text-anchor="start" letter-spacing="1.4"><tspan x="78.0" dy="0">PUBLIC RECORD LIMIT</tspan></text>
<text x="78.0" y="558.0" font-size="16" font-weight="600" fill="#eff8ff" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="78.0" dy="0">Independent measurements; scheduling algorithm itself was never published by SpaceX.</tspan></text>
<text x="56.0" y="632.0" font-size="12" font-weight="400" fill="#b5d0df" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="56.0" dy="0">Sources: arXiv 2307.00402 and 2310.09242; IETF 123 measurement deck; SpaceX FCC filing via papers.</tspan></text>
</svg>
