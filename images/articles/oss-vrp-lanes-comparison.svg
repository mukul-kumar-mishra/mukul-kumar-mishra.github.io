<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="img-title img-desc">
<title id="img-title">A triage intervention, not a withdrawal.</title>
<desc id="img-desc">The lane that protects the build stayed open; the lane that can reroute elsewhere closed for redesign.. PAUSED, Product bug intake, Closed to new reports Oct 1 · Pre-Oct 1 filings still processed. OPEN, Supply-chain disclosures, Pipelines + packages still taken · Reroute product bugs vendor-direct</desc>
