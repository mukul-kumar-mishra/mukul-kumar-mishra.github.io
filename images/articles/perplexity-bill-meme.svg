<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Pen sketched meme of a shocked man holding a giant inference bill">
  <defs>
    <filter id="roughen" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="55" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1200" height="680" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="680" fill="none" stroke="#0f172a" stroke-width="6"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a"/>
  <text x="36" y="41" font-family="monospace" font-size="22" font-weight="bold" letter-spacing="3" fill="#16a34a">FIELD MEME</text>
  <text x="948" y="41" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">Mukul<tspan dx="10" fill="#16a34a">Mishra</tspan></text>
  <text x="60" y="122" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">ELEVEN WORDS. ONE INVOICE.</text>
  <text x="60" y="156" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="21" font-style="italic" fill="#475569">the footnotes arrive with a GPU bill.</text>
  <g transform="translate(250,400)" filter="url(#roughen)" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="0" cy="-80" r="30" fill="#ffffff"/>
    <circle cx="-8" cy="-86" r="7"/>
    <circle cx="12" cy="-86" r="7"/>
    <ellipse cx="2" cy="-54" rx="8" ry="10" fill="#0f172a"/>
    <rect x="-26" y="-48" width="52" height="98" fill="#ffffff"/>
    <path d="M26,-30 L120,-60"/>
  </g>
  <g filter="url(#roughen)">
    <rect x="620" y="200" width="420" height="290" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
    <rect x="620" y="200" width="420" height="46" fill="#0f172a"/>
    <text x="640" y="231" font-family="monospace" font-size="19" font-weight="bold" fill="#f8fafc">INVOICE: 1 question</text>
    <text x="640" y="285" font-family="monospace" font-size="19" fill="#1e293b">retrieval ......... $0.01</text>
    <text x="640" y="320" font-family="monospace" font-size="19" fill="#1e293b">rerank ............ $0.09</text>
    <text x="640" y="355" font-family="monospace" font-size="19" fill="#e11d48">prefill 12k ...... $4.20</text>
    <text x="640" y="390" font-family="monospace" font-size="19" fill="#16a34a">decode 400 ........ $0.02</text>
    <line x1="640" y1="410" x2="1020" y2="410" stroke="#0f172a" stroke-width="3"/>
    <text x="640" y="450" font-family="monospace" font-size="20" font-weight="bold" fill="#0f172a">answer: priceless-ish</text>
  </g>
  <rect x="60" y="540" width="1080" height="80" fill="#0f172a"/>
  <text x="90" y="590" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="25" font-weight="bold" fill="#f8fafc">free answers.</text>
  <text x="360" y="590" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="25" font-weight="bold" fill="#16a34a">$426k per day.</text>
</svg>
