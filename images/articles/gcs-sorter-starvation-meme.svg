<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="img-title img-desc">
<title id="img-title">The sorter meant to relieve nodes starved them.</title>
<desc id="img-desc">Google's preliminary report: a relief optimization plus a metadata fault behind 12.5 hours of us-central1 write errors. 1 / TRIGGER, Sorting optimization ships, Meant to relieve local hotspots · Ran on us-central1 backend nodes. 2 / EXHAUSTION, Nodes run out of resources, Ingestion services time out · Writes routed there fail. 3 / OUTCOME, Regional 503s for 12.5 hours, WriteObject 503s + timeouts · Reads wobble; other regions green</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8faac5"/></marker></defs>
<rect width="1200" height="680" fill="#101a2c"/>
<rect width="1200" height="78" fill="#0b1423"/>
<image x="40" y="9" width="174" height="60" preserveAspectRatio="xMinYMid meet" href="../logo.png"/>
<text x="244.0" y="48.0" font-size="15" font-weight="700" fill="#67d5cb" font-family="Inter, Arial, sans-serif" text-anchor="start" letter-spacing="2"><tspan x="244.0" dy="0">CLOUD STORAGE / WRITE-PATH FAILURE</tspan></text>
<text x="54.0" y="137.0" font-size="31" font-weight="750" fill="#f2f6fb" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="54.0" dy="0">The sorter meant to relieve nodes starved them.</tspan></text>
<text x="56.0" y="177.0" font-size="17" font-weight="400" fill="#b6c5d8" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="56.0" dy="0">Google's preliminary report: a relief optimization plus a metadata fault behind 12.5 hours of us-central1 write errors.</tspan></text>
<path d="M54 202H1146" stroke="#405776" stroke-width="1" opacity="0.7"/>
<rect x="54.0" y="250" width="344.0" height="218" rx="16" fill="#192741" stroke="#405776" stroke-width="2"/>
<rect x="54.0" y="250" width="6" height="218" rx="3" fill="#67d5cb"/>
<text x="78.0" y="284.0" font-size="13" font-weight="700" fill="#67d5cb" font-family="Inter, Arial, sans-serif" text-anchor="start" letter-spacing="1.3"><tspan x="78.0" dy="0">1 / TRIGGER</tspan></text>
<text x="78.0" y="326.0" font-size="20" font-weight="700" fill="#f2f6fb" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="78.0" dy="0">Sorting optimization</tspan><tspan x="78.0" dy="24.0">ships</tspan></text>
<text x="78.0" y="389.0" font-size="14" font-weight="400" fill="#b6c5d8" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="78.0" dy="0">Meant to relieve local hotspots ·</tspan><tspan x="78.0" dy="20.0">Ran on us-central1 backend nodes</tspan></text>
<path d="M401.0 359h18" fill="none" stroke="#b6c5d8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="428.0" y="250" width="344.0" height="218" rx="16" fill="#202e46" stroke="#405776" stroke-width="2"/>
<rect x="428.0" y="250" width="6" height="218" rx="3" fill="#ffb36b"/>
<text x="452.0" y="284.0" font-size="13" font-weight="700" fill="#ffb36b" font-family="Inter, Arial, sans-serif" text-anchor="start" letter-spacing="1.3"><tspan x="452.0" dy="0">2 / EXHAUSTION</tspan></text>
<text x="452.0" y="326.0" font-size="20" font-weight="700" fill="#f2f6fb" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="452.0" dy="0">Nodes run out of</tspan><tspan x="452.0" dy="24.0">resources</tspan></text>
<text x="452.0" y="389.0" font-size="14" font-weight="400" fill="#b6c5d8" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="452.0" dy="0">Ingestion services time out · Writes</tspan><tspan x="452.0" dy="20.0">routed there fail</tspan></text>
<path d="M775.0 359h18" fill="none" stroke="#b6c5d8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="802.0" y="250" width="344.0" height="218" rx="16" fill="#192741" stroke="#405776" stroke-width="2"/>
<rect x="802.0" y="250" width="6" height="218" rx="3" fill="#ffb36b"/>
<text x="826.0" y="284.0" font-size="13" font-weight="700" fill="#ffb36b" font-family="Inter, Arial, sans-serif" text-anchor="start" letter-spacing="1.3"><tspan x="826.0" dy="0">3 / OUTCOME</tspan></text>
<text x="826.0" y="326.0" font-size="20" font-weight="700" fill="#f2f6fb" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="826.0" dy="0">Regional 503s for 12.5</tspan><tspan x="826.0" dy="24.0">hours</tspan></text>
<text x="826.0" y="389.0" font-size="14" font-weight="400" fill="#b6c5d8" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="826.0" dy="0">WriteObject 503s + timeouts · Reads</tspan><tspan x="826.0" dy="20.0">wobble; other regions green</tspan></text>
<rect x="54" y="496" width="1092" height="90" rx="14" fill="#283751" stroke="#405776" stroke-width="2" stroke-dasharray="7 5"/>
<text x="78.0" y="527.0" font-size="13" font-weight="700" fill="#67d5cb" font-family="Inter, Arial, sans-serif" text-anchor="start" letter-spacing="1.4"><tspan x="78.0" dy="0">PRELIMINARY REPORT LIMIT</tspan></text>
<text x="78.0" y="558.0" font-size="16" font-weight="600" fill="#f2f6fb" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="78.0" dy="0">Google labels this a preliminary report; the full root-cause analysis is still underway. Node counts and traffic volumes were not</tspan><tspan x="78.0" dy="20.5">disclosed.</tspan></text>
<text x="56.0" y="632.0" font-size="12" font-weight="400" fill="#b6c5d8" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="56.0" dy="0">Source: Google Cloud Status, incident mSFVt6PiP557bjRyYsut, Oct 8–9, 2026.</tspan></text>
