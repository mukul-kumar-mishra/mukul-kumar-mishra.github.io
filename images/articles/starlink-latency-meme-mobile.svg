<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">SpaceX-reported Starlink latency results and limits</title>
  <desc id="desc">Stacked panels show US peak-hour median latency falling from 48.5 to 33 milliseconds and p99 from over 150 to under 65 milliseconds. SpaceX reports a median reduction over 30 percent and p99 reduction over 60 percent; the printed p99 bounds alone imply a lower bound over 56.67 percent. The 20 millisecond median is a goal, not a reported result. No per-fix contribution is published.</desc>
  <style>text{font-family:Arial,Inter,sans-serif}.mono{font-family:Consolas,"Liberation Mono",monospace}</style>
  <rect width="1200" height="680" fill="#0b2032"/>
  <rect width="1200" height="66" fill="#071727"/>
  <text x="38" y="44" class="mono" font-size="30" font-weight="700" fill="#eff8ff">STARLINK LATENCY · WHITEPAPER SUMMARY</text>
  <text x="55" y="115" font-size="46" font-weight="700" fill="#eff8ff">SpaceX reports aggregate improvement.</text>
  <rect x="50" y="140" width="1100" height="118" rx="12" fill="#102b41" stroke="#91e2c5" stroke-width="3"/>
  <text x="78" y="176" class="mono" font-size="34" font-weight="700" fill="#91e2c5">US PEAK-HOUR MEDIAN</text>
  <text x="78" y="225" class="mono" font-size="52" font-weight="700" fill="#eff8ff">48.5 → 33ms</text>
  <text x="575" y="225" class="mono" font-size="28" fill="#c2d4df">SpaceX reports &gt;30% reduction.</text>
  <rect x="50" y="267" width="1100" height="118" rx="12" fill="#102b41" stroke="#ffc078" stroke-width="3"/>
  <text x="78" y="303" class="mono" font-size="34" font-weight="700" fill="#ffc078">US PEAK-HOUR P99</text>
  <text x="78" y="352" class="mono" font-size="50" font-weight="700" fill="#eff8ff">&gt;150 → &lt;65ms</text>
  <text x="575" y="350" class="mono" font-size="30" fill="#c2d4df">Reported &gt;60%; bounds &gt;56.67%.</text>
  <rect x="50" y="394" width="1100" height="143" rx="12" fill="#15364d" stroke="#6ddbd0" stroke-width="3"/>
  <text x="78" y="430" class="mono" font-size="34" font-weight="700" fill="#6ddbd0">DRIVER CATEGORIES · NO PER-FIX SPLIT</text>
  <text x="78" y="472" class="mono" font-size="31" fill="#eff8ff">Propagation 1.8–3.6ms/leg · ground layout</text>
  <text x="78" y="509" class="mono" font-size="31" fill="#eff8ff">Fronthaul · processing · buffers · queues · WiFi</text>
  <rect x="50" y="546" width="1100" height="99" rx="12" fill="#071727"/>
  <text x="78" y="579" class="mono" font-size="34" font-weight="700" fill="#f8fafc">20ms stable median is a stated goal.</text>
  <text x="78" y="610" class="mono" font-size="24" fill="#dbeafe">15-second averages · US peak 6–9pm local · archive Mar. 7, 2024</text>
  <text x="78" y="637" class="mono" font-size="22" fill="#94a3b8">PDF undated · SpaceX does not report individual fix contributions.</text>
</svg>
