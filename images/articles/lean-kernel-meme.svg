<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Lean checking, OpenAI's public manifest and paper-to-code correspondence</title>
  <desc id="desc">Three distinct checks. Lean's kernel checks proof terms against encoded propositions. OpenAI's manifest reports zero sorry uses for its main results, lists propext, Classical.choice and Quot.sound, pins Lean 4.34.0-rc2, and marks review self-assessed. An October 6 preprint reports two paper-to-Lean estimate mismatches but does not judge whether the natural-language proof is correct.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: ui-monospace, Consolas, monospace; }
      .title { font-size: 30px; font-weight: 750; fill: #0f172a; }
      .subtitle { font-size: 18px; fill: #475569; }
      .section { font-size: 15px; font-weight: 800; letter-spacing: 1.1px; }
      .head { font-size: 20px; font-weight: 750; fill: #0f172a; }
      .body { font-size: 16px; fill: #334155; }
      .small { font-size: 15px; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <rect width="1200" height="68" fill="#0f172a"/>
  <text x="38" y="43" font-size="19" font-weight="800" fill="#f8fafc">FORMAL VERIFICATION · PUBLIC RECORD</text>
  <text x="1118" y="43" text-anchor="end" font-size="21" font-weight="800" fill="#f8fafc">Build<tspan fill="#22c55e">opsy</tspan></text>
  <text class="title" x="60" y="120">A kernel check is not a paper-to-code comparison.</text>
  <text class="subtitle" x="60" y="151">OpenAI's repository makes several disclosures; the independent preprint asks a different question.</text>

  <rect x="60" y="184" width="330" height="302" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text class="section" x="84" y="216" fill="#15803d">1 · LEAN KERNEL</text>
  <rect x="84" y="239" width="282" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text class="head" x="225" y="269" text-anchor="middle">Proof term</text>
  <text class="small" x="225" y="291" text-anchor="middle">checked against an encoded proposition</text>
  <path class="arrow" d="M225 316 V345"/>
  <rect x="84" y="356" width="282" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text class="head" x="225" y="388" text-anchor="middle">Type-checks here</text>
  <text class="small" x="225" y="413" text-anchor="middle">does not compare the paper's prose</text>
  <text class="body" x="84" y="464">The trusted kernel checks the formal term.</text>

  <rect x="435" y="184" width="330" height="302" rx="14" fill="#fff" stroke="#e6a23c" stroke-width="2"/>
  <text class="section" x="459" y="216" fill="#a16207">2 · OPENAI MANIFEST</text>
  <text class="head" x="459" y="254">Project-reported status</text>
  <text class="mono body" x="459" y="285">sorry_count: 0</text>
  <text class="mono body" x="459" y="310">sorry_in_definitions: 0</text>
  <text class="body" x="459" y="348">Main-result axioms listed:</text>
  <text class="mono small" x="459" y="373">propext · Classical.choice</text>
  <text class="mono small" x="459" y="393">Quot.sound</text>
  <text class="body" x="459" y="429">Lean 4.34.0-rc2 · review self-assessed</text>
  <text class="small" x="459" y="462">Disclosure, not an independent review receipt.</text>

  <rect x="810" y="184" width="330" height="302" rx="14" fill="#fff" stroke="#7c6ab0" stroke-width="2"/>
  <text class="section" x="834" y="216" fill="#6952a3">3 · PAPER-TO-CODE</text>
  <text class="head" x="834" y="254">October 6 preprint</text>
  <text class="body" x="834" y="288">Reports two estimate mismatches</text>
  <text class="mono body" x="834" y="319">m+4 vs. m+5 derivatives</text>
  <text class="body" x="834" y="352">and a pressure-flux bound</text>
  <text class="body" x="834" y="375">that depends on another quantity.</text>
  <text class="small" x="834" y="418">Authors do not judge whether the</text>
  <text class="small" x="834" y="438">natural-language proof is correct.</text>
  <text class="small" x="834" y="462">The mismatch's effect remains open.</text>

  <rect x="60" y="512" width="1080" height="76" rx="12" fill="#0f172a"/>
  <text x="84" y="543" font-size="14" font-weight="800" fill="#86efac">REPRODUCTION PATH</text>
  <text x="282" y="543" font-size="14" fill="#f8fafc">The repository README lists Lake builds and Comparator challenges.</text>
  <text x="282" y="567" font-size="12" fill="#cbd5e1">Instructions make an independent check possible; they do not record that one has already happened.</text>
  <text class="mono small" x="60" y="634">SOURCES: OpenAI manifest and README at commit f9e8bc5 · Lean 4.34.0-rc2 · Bastounis et al., arXiv v1 §§3.1–3.2</text>
</svg>
