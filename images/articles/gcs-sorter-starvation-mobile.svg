<svg xmlns="http://www.w3.org/2000/svg" width="390" height="620" viewBox="0 0 390 620" role="img" aria-labelledby="title desc">
  <title id="title">Why GCS writes failed, in Google's final report</title>
  <desc id="desc">A traffic-sorting update bypassed capacity-aware routing, concentrated writes on backend nodes with low serving capacity, and caused ingestion timeouts. A separate database issue added metadata errors during part of the first window.</desc>
  <style>text{font-family:Inter,Arial,sans-serif}</style>
  <rect width="390" height="620" fill="#101a2c"/><rect width="390" height="58" fill="#0b1423"/>
  <text x="18" y="24" font-size="10" font-weight="700" letter-spacing="1.1" fill="#67d5cb">CLOUD STORAGE / WRITE-PATH FAILURE</text>
  <text x="18" y="83" font-size="21" font-weight="750" fill="#f2f6fb">Why GCS writes failed</text>
  <text x="18" y="105" font-size="12" fill="#b6c5d8">Google's final report · October 14, 2026</text>
  <rect x="18" y="126" width="354" height="72" rx="10" fill="#192741" stroke="#405776" stroke-width="1.5"/>
  <text x="31" y="150" font-size="12" font-weight="700" fill="#67d5cb">1 · TRAFFIC-SORTING UPDATE</text>
  <text x="31" y="175" font-size="12" fill="#f2f6fb">Intended to address localized capacity</text>
  <path d="M195 200v9m-5-5 5 5 5-5" fill="none" stroke="#b6c5d8" stroke-width="1.5"/>
  <rect x="18" y="213" width="354" height="72" rx="10" fill="#202e46" stroke="#405776" stroke-width="1.5"/>
  <text x="31" y="237" font-size="12" font-weight="700" fill="#ffb36b">2 · ROUTING CHECK BYPASSED</text>
  <text x="31" y="262" font-size="12" fill="#f2f6fb">Capacity-aware routing was not applied</text>
  <path d="M195 287v9m-5-5 5 5 5-5" fill="none" stroke="#b6c5d8" stroke-width="1.5"/>
  <rect x="18" y="300" width="354" height="72" rx="10" fill="#192741" stroke="#405776" stroke-width="1.5"/>
  <text x="31" y="324" font-size="12" font-weight="700" fill="#ffb36b">3 · WRITE TRAFFIC CONCENTRATED</text>
  <text x="31" y="349" font-size="12" fill="#f2f6fb">Small node fraction; low serving capacity</text>
  <path d="M195 374v9m-5-5 5 5 5-5" fill="none" stroke="#b6c5d8" stroke-width="1.5"/>
  <rect x="18" y="387" width="354" height="72" rx="10" fill="#202e46" stroke="#ff846e" stroke-width="1.5"/>
  <text x="31" y="411" font-size="12" font-weight="700" fill="#ff846e">4 · INGESTION TIMED OUT</text>
  <text x="31" y="436" font-size="12" fill="#f2f6fb">WriteObject 503s and client timeouts</text>
  <rect x="18" y="476" width="354" height="78" rx="10" fill="#283751" stroke="#405776" stroke-width="1.5"/>
  <text x="31" y="500" font-size="11" font-weight="700" fill="#67d5cb">SEPARATE DATABASE ISSUE</text>
  <text x="31" y="525" font-size="12" fill="#f2f6fb">Metadata errors during part of the first window</text>
  <text x="18" y="588" font-size="9" fill="#b6c5d8">Source: Google Cloud Status · final report, Oct 14, 2026.</text>
</svg>
