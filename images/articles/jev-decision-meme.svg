<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Three separate evaluations of TypeSafe Jev</title>
  <desc id="desc">TypeSafe's four company-built example workflows, Vals AI's claim-verification and public LegalBench tests, and NXTG.AI's calibration test are shown separately. Their tasks and labels differ. NXTG's public Part 2 file includes per-item outcomes; its S2 source text and gold fields remain private.</desc>
  <style>.mobile-view{display:none}@media(max-width:600px){.mobile-view{display:inline}}</style>
  <rect width="1200" height="680" fill="#f5f7fa"/>
  <rect width="1200" height="68" fill="#0f172a"/>
  <text x="38" y="44" fill="#f8fafc" font-family="Sora, Segoe UI, sans-serif" font-size="22" font-weight="700">JEV: THREE EVALUATIONS, THREE SCOPES</text>
  <text x="1160" y="44" text-anchor="end" fill="#f8fafc" font-family="Sora, Segoe UI, sans-serif" font-size="19" font-weight="700">BUILDOPSY</text>
  <text x="42" y="116" fill="#0f172a" font-family="Sora, Segoe UI, sans-serif" font-size="30" font-weight="700">Same model. Different evaluation designs.</text>
  <text x="42" y="148" fill="#475569" font-family="Montserrat, Segoe UI, sans-serif" font-size="20">Keep each result with its own task, labels and denominator.</text>

  <g font-family="Montserrat, Segoe UI, sans-serif">
    <rect x="38" y="178" width="358" height="342" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <path d="M54 178h326a16 16 0 0 1 16 16v44H38v-44a16 16 0 0 1 16-16z" fill="#0f172a"/>
    <text x="58" y="211" fill="#f8fafc" font-size="18" font-weight="700">TYPESAFE · EXAMPLE WORKFLOWS</text>
    <text x="58" y="270" fill="#334155" font-size="19">Four equally weighted tasks</text>
    <text x="58" y="326" fill="#16a34a" font-family="Sora, Segoe UI, sans-serif" font-size="43" font-weight="800">67.8%</text>
    <text x="60" y="355" fill="#334155" font-size="18">mean Jev accuracy</text>
    <line x1="58" y1="376" x2="376" y2="376" stroke="#cbd5e1" stroke-width="2"/>
    <text x="58" y="410" fill="#0f172a" font-size="19" font-weight="700">Mean cost: $0.0004 / case</text>
    <text x="58" y="442" fill="#0f172a" font-size="19" font-weight="700">Mean time: 0.4 s / case</text>
    <text x="58" y="479" fill="#475569" font-size="17">Reference: GPT-6 Astra and Claude</text>
    <text x="58" y="501" fill="#475569" font-size="17">Fable 5.1 model-response average.</text>

    <rect x="421" y="178" width="358" height="342" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <path d="M437 178h326a16 16 0 0 1 16 16v44H421v-44a16 16 0 0 1 16-16z" fill="#1d4ed8"/>
    <text x="441" y="211" fill="#f8fafc" font-size="18" font-weight="700">VALS AI · EXTERNAL TESTS</text>
    <text x="441" y="270" fill="#334155" font-size="18">Claim verification · 400 items</text>
    <text x="441" y="318" fill="#1d4ed8" font-family="Sora, Segoe UI, Verdana, sans-serif" font-size="40" font-weight="800">0.975</text>
    <text x="442" y="346" fill="#334155" font-size="17">Jev 1.13.0; ties three frontier models</text>
    <text x="442" y="375" fill="#475569" font-size="16">Claim labels fixed by rules; human-audited</text>
    <line x1="441" y1="393" x2="759" y2="393" stroke="#cbd5e1" stroke-width="2"/>
    <text x="441" y="422" fill="#0f172a" font-size="17" font-weight="700">LegalBench · 12 subtasks · 396 questions</text>
    <text x="441" y="452" fill="#1d4ed8" font-size="19" font-weight="700">0.730 class-balanced accuracy</text>
    <text x="441" y="480" fill="#475569" font-size="17">Last of 12 systems; small slice,</text>
    <text x="441" y="503" fill="#475569" font-size="17">not the full benchmark.</text>

    <rect x="804" y="178" width="358" height="342" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <path d="M820 178h326a16 16 0 0 1 16 16v44H804v-44a16 16 0 0 1 16-16z" fill="#7c3aed"/>
    <text x="824" y="211" fill="#f8fafc" font-size="18" font-weight="700">NXTG.AI · CALIBRATION TEST</text>
    <text x="824" y="270" fill="#334155" font-size="19">273 held-out decisions</text>
    <text x="824" y="323" fill="#7c3aed" font-family="Sora, Segoe UI, sans-serif" font-size="38" font-weight="800">66% / 53%</text>
    <text x="824" y="352" fill="#334155" font-size="18">mean confidence / accuracy</text>
    <line x1="824" y1="376" x2="1142" y2="376" stroke="#cbd5e1" stroke-width="2"/>
    <text x="824" y="410" fill="#0f172a" font-size="20" font-weight="700">ECE 0.156 · threshold 0.10</text>
    <text x="824" y="439" fill="#475569" font-size="16">Alternate bins: 0.150 mass, 0.145 width</text>
    <text x="824" y="474" fill="#475569" font-size="17">129 public S1, 144 private-text S2</text>
    <text x="824" y="501" fill="#475569" font-size="17">some S2 labels are agent-recorded.</text>
  </g>

  <rect x="38" y="542" width="1124" height="102" rx="12" fill="#0f172a"/>
  <text x="62" y="578" fill="#f8fafc" font-family="Sora, Segoe UI, sans-serif" font-size="20" font-weight="700">Different tasks, labels and denominators: these are not a pooled leaderboard.</text>
  <text x="62" y="612" fill="#cbd5e1" font-family="Montserrat, Segoe UI, sans-serif" font-size="17">Sources: TypeSafe evals; Vals AI; NXTG post (Oct 1) and results v1/v2 (Oct 2, 96ca208). S2 text/gold private.</text>

  <g class="mobile-view">
    <rect width="1200" height="680" fill="#f5f7fa"/>
    <rect width="1200" height="68" fill="#0f172a"/>
    <text x="38" y="44" fill="#f8fafc" font-family="Sora, Segoe UI, sans-serif" font-size="22" font-weight="700">JEV: THREE EVALUATIONS</text>
    <text x="42" y="124" fill="#0f172a" font-family="Sora, Segoe UI, sans-serif" font-size="42" font-weight="700">Different tasks. Different results.</text>
    <g font-family="Montserrat, Segoe UI, sans-serif">
      <rect x="38" y="172" width="358" height="342" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
      <text x="58" y="220" fill="#0f172a" font-size="54" font-weight="700">TypeSafe</text>
      <text x="58" y="304" fill="#16a34a" font-family="Sora, Segoe UI, sans-serif" font-size="80" font-weight="800">67.8%</text>
      <text x="58" y="350" fill="#334155" font-size="34">mean accuracy</text>
      <text x="58" y="403" fill="#0f172a" font-size="34" font-weight="700">4 workflows</text>
      <text x="58" y="453" fill="#475569" font-size="38">$0.0004 / case</text>
      <text x="58" y="496" fill="#475569" font-size="38">0.4 s / case</text>

      <rect x="421" y="172" width="358" height="342" rx="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="4"/>
      <text x="441" y="220" fill="#1d4ed8" font-size="54" font-weight="700">Vals AI</text>
      <text x="441" y="304" fill="#1d4ed8" font-family="Sora, Segoe UI, sans-serif" font-size="80" font-weight="800">0.975</text>
      <text x="441" y="350" fill="#334155" font-size="34">claim accuracy · 400</text>
      <text x="441" y="428" fill="#334155" font-size="38" font-weight="700">LegalBench</text>
      <text x="441" y="478" fill="#475569" font-size="32">separate public test</text>
      <text x="441" y="507" fill="#475569" font-size="30">last of 12 systems</text>

      <rect x="804" y="172" width="358" height="342" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/>
      <text x="824" y="220" fill="#7c3aed" font-size="54" font-weight="700">NXTG.AI</text>
      <text x="824" y="304" fill="#7c3aed" font-family="Sora, Segoe UI, sans-serif" font-size="64" font-weight="800">66% / 53%</text>
      <text x="824" y="350" fill="#334155" font-size="32">confidence / accuracy</text>
      <text x="824" y="428" fill="#0f172a" font-family="Sora, Segoe UI, sans-serif" font-size="72" font-weight="800">ECE 0.156</text>
      <text x="824" y="472" fill="#475569" font-size="34">273 holdout</text>
      <text x="824" y="504" fill="#475569" font-size="34">144 S2 source cases</text>
    </g>
    <rect x="38" y="542" width="1124" height="102" rx="12" fill="#0f172a"/>
    <text x="62" y="596" fill="#f8fafc" font-family="Sora, Segoe UI, sans-serif" font-size="42" font-weight="700">NO POOLED RANKING · S2 TEXT/GOLD PRIVATE</text>
  </g>
</svg>
