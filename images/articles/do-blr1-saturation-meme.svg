<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="img-title img-desc">
<title id="img-title">Redundant paths failed together. One link drowned.</title>
<desc id="img-desc">DigitalOcean BLR1: upstream losses incl. backup paths forced full regional load onto one under-sized link.. 1 / LOSS, Upstream paths go dark, Multiple provider paths down · Redundant paths included. 2 / SATURATION, Last link overflows, Traffic exceeds link capacity · Latency climbs, packets drop. 3 / BLAST, Seven product lines degrade, Apps, DBs, Spaces, LB + more · 11:59–13:02 UTC, 63 minutes</desc>
