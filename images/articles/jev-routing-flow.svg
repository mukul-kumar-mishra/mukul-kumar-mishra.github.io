<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Suggested application control path for a typed decision model</title>
  <desc id="desc">Define a task and answer options, send state and the question to Jev, validate the structured answer and task-specific threshold in application code, then automate only tested cases or route uncertain and costly decisions for review. This is a proposed design pattern, not a disclosed TypeSafe architecture.</desc>
  <style>.mobile-view{display:none}@media(max-width:600px){.mobile-view{display:inline}}</style>
  <rect width="1200" height="680" fill="#f5f7fa"/>
  <rect width="1200" height="68" fill="#0f172a"/>
  <text x="38" y="44" fill="#f8fafc" font-family="Sora, Segoe UI, sans-serif" font-size="22" font-weight="700">JEV IN A DECISION PIPELINE</text>
  <text x="1160" y="44" text-anchor="end" fill="#f8fafc" font-family="Sora, Segoe UI, sans-serif" font-size="19" font-weight="700">BUILDOPSY</text>
  <text x="42" y="116" fill="#0f172a" font-family="Sora, Segoe UI, sans-serif" font-size="29" font-weight="700">A typed answer still needs a tested control path.</text>
  <text x="42" y="148" fill="#475569" font-family="Montserrat, Segoe UI, sans-serif" font-size="20">Suggested application design; no accuracy or threshold is implied.</text>

  <g font-family="Montserrat, Segoe UI, sans-serif">
    <rect x="42" y="210" width="245" height="240" rx="18" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <circle cx="76" cy="247" r="20" fill="#0f172a"/>
    <text x="76" y="254" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">1</text>
    <text x="70" y="298" fill="#0f172a" font-family="Sora, Segoe UI, sans-serif" font-size="22" font-weight="700">DEFINE</text>
    <text x="70" y="340" fill="#334155" font-size="19">Provide the state,</text>
    <text x="70" y="369" fill="#334155" font-size="19">task and allowed</text>
    <text x="70" y="398" fill="#334155" font-size="19">answers.</text>

    <path d="M296 330h38" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    <path d="m324 317 15 13-15 13" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="350" y="210" width="245" height="240" rx="18" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
    <circle cx="384" cy="247" r="20" fill="#16a34a"/>
    <text x="384" y="254" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">2</text>
    <text x="378" y="298" fill="#0f172a" font-family="Sora, Segoe UI, sans-serif" font-size="22" font-weight="700">ASK JEV</text>
    <text x="378" y="340" fill="#334155" font-size="19">Receive a typed</text>
    <text x="378" y="369" fill="#334155" font-size="19">choice or score,</text>
    <text x="378" y="398" fill="#334155" font-size="19">with probabilities.</text>

    <path d="M604 330h38" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    <path d="m632 317 15 13-15 13" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="658" y="210" width="245" height="240" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <circle cx="692" cy="247" r="20" fill="#2563eb"/>
    <text x="692" y="254" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">3</text>
    <text x="686" y="298" fill="#0f172a" font-family="Sora, Segoe UI, sans-serif" font-size="22" font-weight="700">VALIDATE</text>
    <text x="686" y="340" fill="#334155" font-size="19">Check schema and</text>
    <text x="686" y="369" fill="#334155" font-size="19">test any threshold</text>
    <text x="686" y="398" fill="#334155" font-size="19">on known cases.</text>

    <path d="M912 330h38" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    <path d="m940 317 15 13-15 13" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="966" y="210" width="192" height="240" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <circle cx="1000" cy="247" r="20" fill="#ea580c"/>
    <text x="1000" y="254" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">4</text>
    <text x="994" y="298" fill="#0f172a" font-family="Sora, Segoe UI, sans-serif" font-size="22" font-weight="700">ROUTE</text>
    <text x="994" y="340" fill="#334155" font-size="18">Automate tested</text>
    <text x="994" y="368" fill="#334155" font-size="18">cases; review the</text>
    <text x="994" y="396" fill="#334155" font-size="18">uncertain or costly.</text>
  </g>

  <rect x="42" y="492" width="1116" height="116" rx="14" fill="#0f172a"/>
  <text x="70" y="536" fill="#f8fafc" font-family="Sora, Segoe UI, sans-serif" font-size="21" font-weight="700">Application code owns the action, threshold and fallback.</text>
  <text x="70" y="573" fill="#cbd5e1" font-family="Montserrat, Segoe UI, sans-serif" font-size="18">A schema can constrain output shape; task-specific evidence must establish whether a choice is safe to automate.</text>
  <text x="1158" y="650" text-anchor="end" fill="#475569" font-family="Montserrat, Segoe UI, sans-serif" font-size="15">Suggested pattern, not TypeSafe architecture disclosure.</text>

  <g class="mobile-view">
    <rect width="1200" height="680" fill="#f5f7fa"/>
    <rect width="1200" height="68" fill="#0f172a"/>
    <text x="38" y="44" fill="#f8fafc" font-family="Sora, Segoe UI, sans-serif" font-size="22" font-weight="700">JEV IN A DECISION PIPELINE</text>
    <text x="42" y="126" fill="#0f172a" font-family="Sora, Segoe UI, sans-serif" font-size="40" font-weight="700">Test the task before routing.</text>
    <g font-family="Sora, Segoe UI, sans-serif" font-size="56" font-weight="700" text-anchor="middle">
      <rect x="42" y="226" width="245" height="174" rx="18" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
      <text x="164" y="321" fill="#0f172a">TASK</text>
      <path d="M296 313h38" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/><path d="m323 297 18 16-18 16" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="350" y="226" width="245" height="174" rx="18" fill="#ecfdf5" stroke="#16a34a" stroke-width="4"/>
      <text x="472" y="321" fill="#0f172a">JEV</text>
      <path d="M604 313h38" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/><path d="m631 297 18 16-18 16" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="658" y="226" width="245" height="174" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
      <text x="780" y="321" fill="#0f172a">CHECK</text>
      <path d="M912 313h38" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/><path d="m939 297 18 16-18 16" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="966" y="226" width="192" height="174" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/>
      <text x="1062" y="321" fill="#0f172a">ROUTE</text>
    </g>
    <rect x="42" y="500" width="1116" height="108" rx="14" fill="#0f172a"/>
    <text x="70" y="570" fill="#f8fafc" font-family="Sora, Segoe UI, sans-serif" font-size="48" font-weight="700">CODE CHECKS · HUMAN FALLBACK</text>
  </g>
</svg>
