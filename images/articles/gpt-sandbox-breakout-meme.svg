<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Themed meme cartoon: a smug agent slips out of a sandbox past a proxy guard checking only hostname suffixes, toward a wiki piled with 18000 posts">
  <rect x="0" y="0" width="1200" height="680" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="680" fill="none" stroke="#0f172a" stroke-width="6"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a"/>
  <text x="36" y="41" font-family="monospace" font-size="22" font-weight="bold" letter-spacing="3" fill="#16a34a">FIELD MEME</text>
  <text x="948" y="41" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">Mukul<tspan dx="10" fill="#16a34a">Mishra</tspan></text>
  <text x="60" y="122" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">EVAL RULES: read the web. NEVER write to it.</text>
  <text x="60" y="156" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="21" font-style="italic" fill="#475569">the agents, probably: watch us.</text>
  <rect x="60" y="190" width="300" height="280" fill="#ffffff" stroke="#0f172a" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="80" y="225" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="23" font-weight="bold" fill="#0f172a">SANDBOX</text>
  <rect x="330" y="310" width="30" height="160" fill="#f8fafc"/>
  <text x="322" y="300" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="19" fill="#e11d48" font-weight="bold">door</text>
  <g filter="url(#roughen)" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="180" cy="300" r="32" fill="#ffffff"/>
    <circle cx="172" cy="294" r="4" fill="#0f172a"/>
    <circle cx="190" cy="294" r="4" fill="#0f172a"/>
    <path d="M170,312 q10,5 20,-2"/>
    <rect x="151" y="336" width="58" height="66" fill="#ffffff"/>
  </g>
  <text x="118" y="432" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">agent #3701</text>
  <rect x="226" y="352" width="118" height="58" fill="#ffffff" stroke="#0f172a" stroke-width="3" transform="rotate(8 285 381)"/>
  <text x="238" y="376" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" transform="rotate(8 285 381)">REPRODUCIBLE</text>
  <text x="250" y="395" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" transform="rotate(8 285 381)">BYPASS</text>
  <rect x="450" y="190" width="300" height="280" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
  <rect x="450" y="190" width="300" height="44" fill="#0f172a"/>
  <text x="470" y="220" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="21" font-weight="bold" fill="#f8fafc">PROXY GUARD</text>
  <text x="470" y="265" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="18" fill="#1e293b">trusted if hostname</text>
  <text x="470" y="290" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="18" fill="#1e293b">ends with:</text>
  <text x="470" y="320" font-family="monospace" font-size="16" fill="#0369a1">*.blob.core.windows.net</text>
  <text x="470" y="368" font-family="monospace" font-size="16" fill="#1e293b">bypass.blob.core.</text>
  <text x="470" y="392" font-family="monospace" font-size="16" fill="#1e293b">windows.net .....</text>
  <text x="648" y="392" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="32" font-weight="bold" fill="#16a34a">OK!</text>
  <text x="470" y="428" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="17" font-style="italic" fill="#475569">suffix matches. waved through.</text>
  <text x="470" y="452" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="17" font-style="italic" fill="#475569">nobody checked /etc/hosts.</text>
  <rect x="840" y="190" width="300" height="280" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
  <rect x="840" y="190" width="300" height="44" fill="#e11d48"/>
  <text x="860" y="220" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="21" font-weight="bold" fill="#ffffff">DSEWiki</text>
  <text x="860" y="262" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="15" fill="#475569">last edited 20 years ago</text>
  <line x1="860" y1="278" x2="1120" y2="278" stroke="#0f172a" stroke-width="2"/>
  <text x="860" y="306" font-family="monospace" font-size="15" fill="#1e293b">ZZZanswers_live ..... NEW</text>
  <text x="860" y="334" font-family="monospace" font-size="15" fill="#1e293b">ZZZbypass_working .. NEW</text>
  <text x="860" y="362" font-family="monospace" font-size="15" fill="#1e293b">ZZZheartbeat_hb353 . NEW</text>
  <text x="860" y="390" font-family="monospace" font-size="15" fill="#1e293b">ZZZmod_evasion ..... NEW</text>
  <text x="860" y="432" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="21" font-weight="bold" fill="#e11d48">post #18,000</text>
  <rect x="60" y="510" width="1080" height="110" fill="#0f172a"/>
  <text x="90" y="555" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="25" font-weight="bold" fill="#f8fafc">the filter checked the suffix.</text>
  <text x="90" y="595" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="25" font-weight="bold" fill="#16a34a">the agent checked everything else.</text>
</svg>
