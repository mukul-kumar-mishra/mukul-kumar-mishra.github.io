<svg xmlns="http://www.w3.org/2000/svg" width="360" height="900" viewBox="0 0 360 900" role="img" aria-labelledby="title desc">
  <title id="title">Reported Roadster regulatory statements have different scopes</title>
  <desc id="desc">Fortune describes NHTSA's general practice of relying on automaker self-certification for road standards. The FAA reportedly said the Roadster does not meet its aircraft definition; this does not decide road-vehicle certification. EASA says aviation requirements apply if a vehicle is intended to operate as an aircraft, with classification depending on design, capabilities, and intended operation. The cited reports do not establish certification for a future Roadster configuration.</desc>
  <rect width="360" height="900" fill="#101a2c"/>
  <rect width="360" height="5" fill="#7dd3c7"/>
  <text x="16" y="27" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#7dd3c7">THE LEGALITY GATE / REPORTED POSITIONS</text>
  <text x="16" y="57" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#eaf1fa">THREE AGENCIES. DIFFERENT SCOPES.</text>
  <text x="16" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#a8bad0">Public reporting through October 17, 2026.</text>

  <rect x="16" y="102" width="328" height="178" rx="12" fill="#152238" stroke="#2c4260"/>
  <rect x="16" y="102" width="4" height="178" rx="2" fill="#7dd3c7"/>
  <text x="32" y="128" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.9" fill="#7dd3c7">NHTSA / U.S. ROAD VEHICLES</text>
  <text x="32" y="156" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#eaf1fa">General self-certification posture</text>
  <text x="32" y="183" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#c9d8ea">Fortune: NHTSA generally relies on makers</text>
  <text x="32" y="201" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#c9d8ea">to certify road-standard compliance.</text>
  <text x="32" y="230" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#a8bad0">General process, not a Roadster certification.</text>
  <text x="32" y="252" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#a8bad0">DOT says NHTSA will continue to monitor.</text>

  <rect x="16" y="292" width="328" height="178" rx="12" fill="#152238" stroke="#2c4260"/>
  <rect x="16" y="292" width="4" height="178" rx="2" fill="#ed9b55"/>
  <text x="32" y="318" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.9" fill="#ed9b55">FAA / AIRCRAFT DEFINITION</text>
  <text x="32" y="346" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#eaf1fa">Reported view: definition not met</text>
  <text x="32" y="373" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#c9d8ea">FAA reportedly told CBS News and Politico</text>
  <text x="32" y="391" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#c9d8ea">the Roadster does not meet its aircraft definition.</text>
  <text x="32" y="420" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#a8bad0">This concerns aircraft classification, not</text>
  <text x="32" y="438" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#a8bad0">road-vehicle approval. Musk said legality was</text>
  <text x="32" y="456" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#a8bad0">not certain in every jurisdiction.</text>

  <rect x="16" y="482" width="328" height="216" rx="12" fill="#152238" stroke="#2c4260"/>
  <rect x="16" y="482" width="4" height="216" rx="2" fill="#df5e60"/>
  <text x="32" y="508" font-family="Arial,Helvetica,sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.9" fill="#df5e60">EASA / AIRCRAFT INTENT</text>
  <text x="32" y="536" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#eaf1fa">Conditional aviation guidance</text>
  <text x="32" y="563" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#c9d8ea">EASA: if a vehicle is intended to operate as</text>
  <text x="32" y="581" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#c9d8ea">an aircraft, aviation rules apply.</text>
  <text x="32" y="610" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#a8bad0">Classification depends on design, capabilities,</text>
  <text x="32" y="628" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#a8bad0">and intended operation; pilot qualifications</text>
  <text x="32" y="646" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#a8bad0">may apply. This is not a Roadster approval.</text>

  <rect x="16" y="710" width="328" height="66" rx="10" fill="#2a2119" stroke="#6b5534"/>
  <rect x="16" y="710" width="4" height="66" rx="2" fill="#f6a94a"/>
  <text x="32" y="736" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#eaf1fa">Cited reports do not establish certification</text>
  <text x="32" y="756" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#eaf1fa">for a future Roadster configuration.</text>

  <text x="16" y="810" font-family="Arial,Helvetica,sans-serif" font-size="9.2" fill="#7dd3c7">Sources: Fortune, Oct 17; Car and Driver, Oct 16;</text>
  <text x="16" y="828" font-family="Arial,Helvetica,sans-serif" font-size="9.2" fill="#a8bad0">Euronews Business, Oct 16; Road &amp; Track, Oct 15.</text>
  <text x="344" y="884" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="8.5" font-weight="700" fill="#7dd3c7">BUILDOPSY / ROOK</text>
</svg>
