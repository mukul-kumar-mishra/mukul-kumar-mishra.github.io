<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2400" height="1260" viewBox="0 0 2400 1260" role="img" aria-labelledby="title desc">
  <title id="title">Figma multiplayer: one document, one owner</title>
  <desc id="desc">A high-resolution system design banner showing browser clients sending optimistic edits over WebSockets to a document owner, which orders and validates changes, persists accepted revisions and broadcasts canonical state. Cursor presence uses a separate transient lane. Reported company scale and modeled RPS are distinguished.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1423"/><stop offset="1" stop-color="#101e33"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#97abc7" stroke-opacity=".04" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#a6bad2"/></marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#68d5c4"/></marker>
    <style>
      text{font-family:Inter,Arial,Helvetica,sans-serif}
      .eyebrow{font-size:22px;font-weight:700;letter-spacing:3px;fill:#70d4c4}
      .headline{font-size:82px;font-weight:750;letter-spacing:-2px;fill:#f3f6fb}
      .subtitle{font-size:29px;font-weight:400;fill:#b9c7da}
      .section{font-size:18px;font-weight:700;letter-spacing:1.8px;fill:#70d4c4}
      .label{font-size:18px;font-weight:700;letter-spacing:1.2px;fill:#73d6c4}
      .heading{font-size:29px;font-weight:700;fill:#f3f6fb}
      .body{font-size:22px;font-weight:400;fill:#c4d0df}
      .small{font-size:17px;font-weight:400;fill:#9fb1c7}
      .box{fill:#192841;stroke:#405a79;stroke-width:3}
    </style>
  </defs>

  <rect width="2400" height="1260" fill="url(#canvas)"/>
  <rect width="2400" height="1260" fill="url(#grid)"/>
  <rect x="42" y="38" width="2316" height="1184" rx="34" fill="#111d31" stroke="#2a3e5b" stroke-width="2"/>

  <image x="82" y="62" width="188" height="68" preserveAspectRatio="xMinYMid meet" href="../logo.png"/>
  <text x="300" y="105" class="eyebrow">SYSTEM DESIGN / REALTIME COLLABORATION</text>
  <rect x="1874" y="68" width="426" height="60" rx="30" fill="#1c2c43" stroke="#344d6d" stroke-width="2"/>
  <circle cx="1912" cy="98" r="8" fill="#68d5c4"/>
  <text x="1938" y="106" font-size="19" font-weight="700" letter-spacing="1.4" fill="#cbd7e6">FIGMA MULTIPLAYER</text>

  <text x="100" y="235" class="eyebrow">THE SHARED-CANVAS DESIGN</text>
  <text x="94" y="335" class="headline">One document. One owner.</text>
  <text x="100" y="395" class="subtitle">Server-ordered edits keep the shared canvas responsive.</text>

  <rect x="70" y="445" width="2260" height="390" rx="26" fill="#0d1829" stroke="#263a55" stroke-width="2"/>
  <text x="112" y="503" class="section">LIVE EDIT PATH</text>
  <text x="365" y="503" class="small">Two browser edits converge on one document process.</text>

  <rect x="110" y="550" width="500" height="238" rx="18" class="box"/>
  <text x="140" y="590" class="label">BROWSER CLIENTS</text>
  <rect x="138" y="615" width="444" height="62" rx="12" fill="#223550" stroke="#4a6585" stroke-width="2"/>
  <circle cx="169" cy="646" r="10" fill="#68d5c4"/>
  <text x="194" y="653" font-size="22" font-weight="700" fill="#f3f6fb">Client A</text>
  <text x="493" y="653" font-size="20" font-weight="600" fill="#c4d0df" text-anchor="end">edit</text>
  <rect x="138" y="693" width="444" height="62" rx="12" fill="#223550" stroke="#4a6585" stroke-width="2"/>
  <circle cx="169" cy="724" r="10" fill="#7cb8ff"/>
  <text x="194" y="731" font-size="22" font-weight="700" fill="#f3f6fb">Client B</text>
  <text x="493" y="731" font-size="20" font-weight="600" fill="#c4d0df" text-anchor="end">edit</text>

  <path d="M610 669H651" fill="none" stroke="#a6bad2" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="665" y="550" width="390" height="238" rx="18" class="box"/>
  <text x="697" y="590" class="label">TRANSPORT</text>
  <text x="697" y="643" class="heading">WebSocket edge</text>
  <line x1="697" y1="665" x2="1022" y2="665" stroke="#405776" stroke-width="2"/>
  <text x="697" y="704" class="body">Route by document</text>
  <text x="697" y="738" class="body">Keep connections open</text>

  <path d="M1055 669H1091" fill="none" stroke="#a6bad2" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1105" y="550" width="500" height="238" rx="18" fill="#202e46" stroke="#f2a45f" stroke-width="3"/>
  <rect x="1105" y="550" width="10" height="238" rx="5" fill="#f2a45f"/>
  <text x="1148" y="590" font-size="18" font-weight="700" letter-spacing="1.2" fill="#ffbd83">ORDERING</text>
  <text x="1148" y="643" class="heading">Document owner</text>
  <line x1="1148" y1="665" x2="1562" y2="665" stroke="#50627c" stroke-width="2"/>
  <text x="1148" y="704" class="body">Serialize + validate</text>
  <text x="1148" y="738" class="body">Resolve same-property edits</text>

  <path d="M1605 669H1641" fill="none" stroke="#68d5c4" stroke-width="4" marker-end="url(#arrow-teal)"/>
  <rect x="1655" y="550" width="625" height="238" rx="18" fill="#19363f" stroke="#68d5c4" stroke-width="3"/>
  <text x="1698" y="590" class="label">DURABLE STATE</text>
  <text x="1698" y="643" class="heading">Revision log</text>
  <line x1="1698" y1="665" x2="2237" y2="665" stroke="#436978" stroke-width="2"/>
  <text x="1698" y="704" class="body">Persist accepted changes</text>
  <text x="1698" y="738" class="body">Broadcast ordered updates</text>

  <text x="100" y="897" class="section">TWO DIFFERENT STATE PATHS</text>
  <rect x="100" y="928" width="1050" height="150" rx="18" fill="#172b3c" stroke="#68d5c4" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="136" y="971" class="label">PRESENCE / EPHEMERAL</text>
  <text x="136" y="1015" class="heading">Cursors + viewports</text>
  <text x="136" y="1048" class="body">Fast updates can be coalesced or dropped.</text>

  <rect x="1190" y="928" width="1110" height="150" rx="18" fill="#252c3c" stroke="#f2a45f" stroke-width="2.5"/>
  <text x="1226" y="971" font-size="18" font-weight="700" letter-spacing="1.2" fill="#ffbd83">DOCUMENT MUTATIONS / DURABLE</text>
  <text x="1226" y="1015" class="heading">Ordered, validated, replayable</text>
  <text x="1226" y="1048" class="body">The owner commits accepted edits to shared history.</text>

  <text x="102" y="1141" font-size="18" font-weight="600" fill="#d1dbea">13M+ reported users</text>
  <circle cx="328" cy="1135" r="4" fill="#68d5c4"/>
  <text x="350" y="1141" font-size="18" font-weight="600" fill="#d1dbea">Node.js network + Rust document engine</text>
  <circle cx="770" cy="1135" r="4" fill="#68d5c4"/>
  <text x="792" y="1141" font-size="18" font-weight="600" fill="#d1dbea">65k RPS is a modeled scenario</text>
  <text x="102" y="1183" class="small">Public Figma engineering references support the architecture; the article separates disclosure from modeled scale.</text>
</svg>
