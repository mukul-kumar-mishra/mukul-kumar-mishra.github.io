<title id="img-title">One owner orders edits; presence is separate</title>
<desc id="img-desc">An edit reaches the document owner, then the ordered change is fanned out to collaborators.. CLIENTS, Optimistic edits, Local response · Concurrent operations. TRANSPORT, WebSocket edge, Route to document owner · Keep live connections. ORDERING, Document owner, Serialize mutations · Resolve conflicting edits. DURABILITY, Revision log, Persist document changes · Fan out ordered updates</desc>
