<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">We News audit: fake personas repackage real Canadian reporting</title>
  <desc id="desc">Original stories from CBC, CTV, Global, CityNews, Gazette and Canadian Press are rewritten under fabricated bylines like Genevieve Tremblay, published as We News, then face Google policy scrutiny while the contact trail bounces.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a2c"/><stop offset="1" stop-color="#182944"/></linearGradient>
    <linearGradient id="hot" x2="1"><stop stop-color="#ed9b55"/><stop offset="1" stop-color="#df5e60"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8faac5"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#eaf1fa}.muted{fill:#a8bad0}.kicker{font-size:16px;font-weight:700;letter-spacing:2px;fill:#7dd3c7}.head{font-size:29px;font-weight:700}.node{fill:#1d304b;stroke:#49627e;stroke-width:2}.nodehot{fill:#392936;stroke:#ed9b55;stroke-width:2}.nodesafe{fill:#193b3b;stroke:#7dd3c7;stroke-width:2}.label{font-size:19px;font-weight:700}.sub{font-size:14px}.line{fill:none;stroke:#8faac5;stroke-width:3;marker-end:url(#arrow)}.bad{fill:none;stroke:#ef7970;stroke-width:4;stroke-dasharray:9 8}.timeline{stroke:#54708f;stroke-width:3}.tick{fill:#7dd3c7;stroke:#132139;stroke-width:4}
    </style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="58" y="60" class="kicker">AI SLOP WATCH / PROVENANCE AUDIT · OCT 3, 2026</text>
  <text x="58" y="105" class="head">Real reporting in. Fake bylines out.</text>
  <text x="58" y="139" class="muted" font-size="18">Reported loop: legitimate stories rewritten under personas, monetized, then policy-checked.</text>
  <rect x="58" y="200" width="240" height="112" rx="16" class="node"/>
  <text x="84" y="243" class="label">Real outlets</text>
  <text x="84" y="268" class="sub">CBC · CTV · Global · CityNews</text>
  <text x="84" y="290" class="sub muted">Gazette · Canadian Press</text>
  <path d="M300 256H360" class="line"/>
  <rect x="365" y="185" width="260" height="142" rx="16" class="nodehot"/>
  <text x="390" y="227" class="label">"Geneviève T." + co.</text>
  <text x="390" y="253" class="sub">200+ articles flagged AI-made</text>
  <text x="390" y="275" class="sub muted">vendor analysis, not proof alone</text>
  <text x="390" y="297" class="sub muted">editor "Gordon Halloway"</text>
  <path d="M627 256H687" class="line"/>
  <rect x="692" y="200" width="200" height="112" rx="16" class="nodehot"/>
  <text x="717" y="243" class="label">We News</text><text x="717" y="271" class="label">republish</text>
  <text x="717" y="295" class="sub muted">says based Hong Kong</text>
  <path d="M894 256H944" class="bad"/>
  <rect x="950" y="200" width="192" height="112" rx="16" class="node"/>
  <text x="974" y="243" class="label">Google</text><text x="974" y="271" class="label">scrutiny</text>
  <text x="974" y="295" class="sub muted">appeared delisted*</text>
  <rect x="58" y="380" width="540" height="76" rx="14" class="node"/>
  <text x="83" y="412" class="label">Contact email bounced · no human reached</text><text x="83" y="438" class="sub muted">accountability gap mirrors book-slop cases</text>
  <rect x="620" y="380" width="522" height="76" rx="14" class="nodesafe"/>
  <text x="645" y="412" class="label">"Daniel Robson" persona pulled late Sept</text><text x="645" y="438" class="sub muted">separate case: deception &gt; AI alone</text>
  <text x="58" y="510" class="kicker">EVIDENCE LEDGER</text>
  <line x1="92" y1="570" x2="1106" y2="570" class="timeline"/>
  <circle cx="180" cy="570" r="10" class="tick"/><text x="130" y="548" class="label" font-size="16">Late Sep</text><text x="130" y="604" class="sub muted">Robson pulled</text>
  <circle cx="600" cy="570" r="10" fill="#ed9b55" stroke="#132139" stroke-width="4"/><text x="570" y="548" class="label" font-size="16">Oct 3</text><text x="570" y="604" class="sub muted">We News reported</text>
  <circle cx="990" cy="570" r="10" class="tick"/><text x="940" y="548" class="label" font-size="16">Open</text><text x="940" y="604" class="sub muted">*Google unconfirmed</text>
  <text x="58" y="646" class="muted" font-size="14">*Report says the site appeared delisted; Google did not confirm action on this site.</text>
</svg>
