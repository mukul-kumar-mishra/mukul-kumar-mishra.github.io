<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">DPDP compliance data plane: consent receipts, retention ledger, erasure and breach notification</title>
  <desc id="desc">Consent receipts feed purpose binding, which feeds a retention ledger per dataset. The ledger drives erasure orchestration across replicas and backups, while a breach clock runs beside the pipeline toward Board and individual notification.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a2c"/><stop offset="1" stop-color="#182944"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8faac5"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#eaf1fa}.muted{fill:#a8bad0}.kicker{font-size:16px;font-weight:700;letter-spacing:2px;fill:#7dd3c7}.head{font-size:30px;font-weight:700}.node{fill:#1d304b;stroke:#49627e;stroke-width:2}.nodehot{fill:#392936;stroke:#ed9b55;stroke-width:2}.nodesafe{fill:#193b3b;stroke:#7dd3c7;stroke-width:2}.label{font-size:20px;font-weight:700}.sub{font-size:15px}.line{fill:none;stroke:#8faac5;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="58" y="60" class="kicker">PRIVACY ENGINEERING / DPDP ACT 2023</text>
  <text x="58" y="105" class="head">A policy never deleted a row.</text>
  <text x="58" y="139" class="muted" font-size="18">Consent receipts plus purpose binding plus retention ledger plus breach clock.</text>

  <rect x="58" y="190" width="205" height="142" rx="16" class="node"/>
  <text x="84" y="233" class="label">Receipts</text>
  <text x="84" y="261" class="sub">grant + withdraw</text>
  <text x="84" y="285" class="sub muted">notice versioned</text>
  <text x="84" y="309" class="sub muted">immutable history</text>

  <path d="M265 260H319" class="line"/>
  <rect x="324" y="190" width="205" height="142" rx="16" class="node"/>
  <text x="350" y="233" class="label">Binding</text>
  <text x="350" y="261" class="sub">row carries purpose</text>
  <text x="350" y="285" class="sub muted">jobs check live use</text>
  <text x="350" y="309" class="sub muted">deny by default</text>

  <path d="M531 260H585" class="line"/>
  <rect x="590" y="190" width="235" height="142" rx="16" class="node"/>
  <text x="616" y="233" class="label">Retention ledger</text>
  <text x="616" y="261" class="sub">dataset · TTL · basis</text>
  <text x="616" y="285" class="sub muted">legal-hold overrides</text>
  <text x="616" y="309" class="sub muted">one table, all laws</text>

  <path d="M827 260H881" class="line"/>
  <rect x="886" y="190" width="256" height="142" rx="16" class="nodesafe"/>
  <text x="912" y="233" class="label">Erasure</text>
  <text x="912" y="261" class="sub">tombstone, then sweep</text>
  <text x="912" y="285" class="sub muted">per-store certificates</text>
  <text x="912" y="309" class="sub muted">backups expire out</text>

  <rect x="58" y="380" width="700" height="76" rx="14" class="nodehot"/>
  <text x="84" y="412" class="label">Breach clock</text><text x="84" y="438" class="sub muted">detect, scope, notify Board + people — as a pipeline, not a meeting</text>
  <rect x="786" y="380" width="356" height="76" rx="14" class="node"/>
  <text x="812" y="412" class="label">Age gate</text><text x="812" y="438" class="sub muted">verify all, route under-18s</text>

  <text x="58" y="506" class="kicker">PENALTIES &#183; BOARD ADJUDICATION</text>
  <text x="58" y="548" class="label" font-size="24">Security failure up to &#8377;250 crore. Children's lane up to &#8377;200 crore.</text>
  <text x="58" y="582" class="sub muted">Per-contravention fines after Board inquiry. The invoice for the missing pipeline, priced in advance.</text>

  <text x="58" y="650" class="muted" font-size="14">Simplified from the Act via PRS analysis. Draft-Rules mechanics and phase dates arrive by notification.</text>
<image x="996" y="620" width="145" height="53" preserveAspectRatio="xMaxYMid meet" href="../logo.png"/>
</svg>
