<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Kafka consumer rebalance diagram">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#0369a1" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="680" fill="#f8fafc"/>
  <text x="60" y="64" font-family="sans-serif" font-size="30" font-weight="bold" fill="#0f172a">KAFKA REBALANCE: ONE RESTART IN, EVERY PARTITION REASSIGNED</text>
  <text x="60" y="100" font-family="sans-serif" font-size="20" fill="#475569">Eager stops the world. Cooperative moves only what must move.</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="60" y="150" width="320" height="150" rx="14" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
    <text x="220" y="205" font-size="26" font-weight="bold" fill="#0f172a">ROLLING DEPLOY</text>
    <text x="220" y="240" font-size="20" fill="#475569">120 restarts</text>
    <text x="220" y="268" font-size="20" fill="#475569">one at a time</text>
    <rect x="440" y="150" width="320" height="150" rx="14" fill="#ffffff" stroke="#e11d48" stroke-width="4"/>
    <text x="600" y="205" font-size="26" font-weight="bold" fill="#0f172a">COORDINATOR</text>
    <text x="600" y="240" font-size="20" fill="#475569">JoinGroup in</text>
    <text x="600" y="268" font-size="20" fill="#475569">everyone revoked</text>
    <rect x="820" y="150" width="320" height="150" rx="14" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
    <text x="980" y="205" font-size="26" font-weight="bold" fill="#0f172a">40,000 PARTITIONS</text>
    <text x="980" y="240" font-size="20" fill="#475569">reassigned</text>
    <text x="980" y="268" font-size="20" fill="#475569">11 minutes silent</text>
    <rect x="60" y="370" width="320" height="150" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <text x="220" y="425" font-size="26" font-weight="bold" fill="#0f172a">STATIC MEMBERS</text>
    <text x="220" y="460" font-size="20" fill="#475569">stable instance ids</text>
    <text x="220" y="488" font-size="20" fill="#475569">restarts skip rebalance</text>
    <rect x="440" y="370" width="320" height="150" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <text x="600" y="425" font-size="26" font-weight="bold" fill="#0f172a">COOPERATIVE</text>
    <text x="600" y="460" font-size="20" fill="#475569">move only movers</text>
    <text x="600" y="488" font-size="20" fill="#475569">rest keep consuming</text>
    <rect x="820" y="370" width="320" height="150" rx="14" fill="#ffffff" stroke="#83663e" stroke-width="3"/>
    <text x="980" y="425" font-size="26" font-weight="bold" fill="#0f172a">BUDGETED RETRIES</text>
    <text x="980" y="460" font-size="20" fill="#475569">backoff plus jitter</text>
    <text x="980" y="488" font-size="20" fill="#475569">recovery near 1x</text>
  </g>
  <g stroke="#0369a1" stroke-width="2.5">
    <line x1="380" y1="225" x2="432" y2="225" marker-end="url(#arr4)"/>
    <line x1="760" y1="225" x2="812" y2="225" marker-end="url(#arr4)"/>
    <line x1="220" y1="300" x2="220" y2="362" marker-end="url(#arr4)"/>
    <line x1="980" y1="300" x2="980" y2="362" marker-end="url(#arr4)"/>
  </g>
  <text x="60" y="590" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0f172a">The brokers were innocent all along. Fix the race, not the brokers.</text>
  <text x="1140" y="640" font-family="sans-serif" font-size="20" fill="#475569" text-anchor="end">buildopsy.com</text>
</svg>
