<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Kafka consumer rebalance protocols: classic eager, cooperative assignment, and static membership</title>
  <desc id="desc">A protocol comparison. Classic eager requires every member to revoke its currently owned partitions before participating in a rebalance. Cooperative assignment can retain partitions that stay with their current owner and transfer revoked partitions in a later round. Static membership with a stable group.instance.id and suitable session timeout can avoid reassignment during transient unavailability; it does not prevent later rebalances after expiry.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: ui-monospace, Consolas, monospace; }
      .title { font-size: 28px; font-weight: 750; fill: #0f172a; }
      .subtitle { font-size: 16px; fill: #475569; }
      .section { font-size: 15px; font-weight: 800; letter-spacing: 1.2px; }
      .label { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 14px; fill: #334155; }
      .small { font-size: 12px; fill: #475569; }
      .white { fill: #f8fafc; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <rect width="1200" height="68" fill="#0f172a"/>
  <text x="38" y="43" font-size="20" font-weight="800" fill="#f8fafc">KAFKA GUIDE · CONSUMER REBALANCE</text>
  <text x="1118" y="43" text-anchor="end" font-size="21" font-weight="800" fill="#f8fafc">Build<tspan fill="#22c55e">opsy</tspan></text>

  <text class="title" x="60" y="119">Which assignments move depends on the protocol.</text>
  <text class="subtitle" x="60" y="151">Classic eager and cooperative are classic-protocol assignors; Kafka's newer Consumer protocol is separate.</text>

  <rect x="60" y="176" width="1080" height="184" rx="14" fill="#fff" stroke="#e11d48" stroke-width="2"/>
  <text class="section" x="84" y="205" fill="#be123c">CLASSIC EAGER</text>
  <rect x="84" y="224" width="220" height="72" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text class="label" x="194" y="253" text-anchor="middle">Membership change</text>
  <text class="small" x="194" y="275" text-anchor="middle">requires a new assignment</text>
  <path class="arrow" d="M314 260 H356"/>
  <rect x="368" y="224" width="350" height="72" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text class="label" x="543" y="253" text-anchor="middle">Every member revokes</text>
  <text class="small" x="543" y="275" text-anchor="middle">all currently owned partitions</text>
  <path class="arrow" d="M728 260 H770"/>
  <rect x="782" y="224" width="330" height="72" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text class="label" x="947" y="253" text-anchor="middle">New assignment installed</text>
  <text class="small" x="947" y="275" text-anchor="middle">group-wide handoff barrier</text>
  <text class="body" x="84" y="332">Eager protocol rule: each consumer revokes its full current assignment before participating in the rebalance.</text>

  <rect x="60" y="376" width="1080" height="184" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text class="section" x="84" y="405" fill="#15803d">COOPERATIVE INCREMENTAL ASSIGNMENT</text>
  <rect x="84" y="424" width="190" height="72" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text class="label" x="179" y="453" text-anchor="middle">Membership change</text>
  <text class="small" x="179" y="475" text-anchor="middle">needs reassignment</text>
  <path class="arrow" d="M278 460 H312"/>
  <rect x="324" y="424" width="230" height="72" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text class="label" x="439" y="453" text-anchor="middle">Keep current owners</text>
  <text class="small" x="439" y="475" text-anchor="middle">where assignment permits</text>
  <path class="arrow" d="M558 460 H592"/>
  <rect x="604" y="424" width="210" height="72" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text class="label" x="709" y="453" text-anchor="middle">Revoke movers</text>
  <text class="small" x="709" y="475" text-anchor="middle">only when ownership changes</text>
  <path class="arrow" d="M818 460 H852"/>
  <rect x="864" y="424" width="248" height="72" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text class="label" x="988" y="453" text-anchor="middle">Assign movers later</text>
  <text class="small" x="988" y="475" text-anchor="middle">may take another rebalance round</text>
  <text class="body" x="84" y="532">Cooperative assignors can retain partitions that remain with their current member and transfer revoked partitions in a later round.</text>

  <rect x="60" y="576" width="1080" height="58" rx="10" fill="#0f172a"/>
  <text x="82" y="601" font-size="14" font-weight="800" fill="#86efac">STATIC MEMBERSHIP</text>
  <text x="258" y="601" font-size="14" fill="#f8fafc">A stable group.instance.id and suitable session timeout may avoid reassignment during brief unavailability.</text>
  <text x="258" y="620" font-size="12" fill="#cbd5e1">After the session expires, Kafka can remove the member and reassign its partitions.</text>

  <text class="mono small" x="60" y="660">SOURCE: Apache Kafka 4.2 consumer protocol, consumer configuration, and assignor API documentation.</text>
  <text class="mono small" x="1140" y="660" text-anchor="end">BY MUKUL KUMAR MISHRA</text>
</svg>
