<svg xmlns="http://www.w3.org/2000/svg" width="390" height="700" viewBox="0 0 390 700" role="img">
  <title>Salesforce login queue disruption timeline</title>
  <desc>Salesforce Trust recorded a 7h 36m disruption across 16 instance IDs starting at 07:50 UTC.</desc>
<rect width="390" height="700" fill="#080F1C"/>
  <rect x="10" y="10" width="370" height="680" rx="12" fill="#141F33" stroke="#24344F" stroke-width="1.4"/>
  <text x="24.0" y="42.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#7DD3C7" letter-spacing="1.5">SALESFORCE / TRUST</text>
  <text x="24.0" y="72.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#EAF1FA">Login Queue Outage</text>
  <line x1="24" y1="88" x2="366" y2="88" stroke="#2F4A6E" stroke-width="1"/>
  <rect x="24.0" y="110.0" width="342.0" height="100.0" rx="8" fill="#101C2F" stroke="#F08A7E" stroke-width="1.4"/>
  <text x="40.0" y="144.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="34" font-weight="700" fill="#F08A7E">7 h 36 m</text>
  <text x="40.0" y="170.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#EAF1FA">duration of login disruption</text>
  <text x="40.0" y="190.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">started 07:50 UTC on Dreamforce week</text>
  <rect x="24.0" y="230.0" width="342.0" height="110.0" rx="8" fill="#101C2F" stroke="#F2B263" stroke-width="1.2"/>
  <text x="36.0" y="258.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#F2B263">16 Impacted Instances</text>
  <text x="36.0" y="280.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">- Core instance IDs listed on Trust</text>
  <text x="36.0" y="300.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">- Login queues saturated across fleet</text>
  <text x="36.0" y="320.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">- Retry storm amplified backlog</text>
  <rect x="24.0" y="360.0" width="342.0" height="90.0" rx="8" fill="#101C2F" stroke="#7DD3C7" stroke-width="1.2"/>
  <text x="36.0" y="388.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#7DD3C7">Resolution</text>
  <text x="36.0" y="410.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">Throttling, traffic shedding, and</text>
  <text x="36.0" y="428.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">worker pool re-balancing restored service.</text>
  <text x="24.0" y="660.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="10" font-weight="400" fill="#64748B">Salesforce Trust; 07:50 UTC start; 16 instance IDs</text>
</svg>
