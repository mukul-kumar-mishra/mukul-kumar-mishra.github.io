<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Notion data-platform flow from an edited block through API permissions, 480 Postgres shards and Kafka CDC into a Hudi data lake, search index and vector tier.">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9db3cf"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#67d5bf"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .eyebrow{font-size:14px;font-weight:700;letter-spacing:2px;fill:#74d7c5}
      .title{font-size:31px;font-weight:700;fill:#f2f6fc}
      .subtitle{font-size:17px;fill:#b9c7da}
      .box{fill:#1a2940;stroke:#3d5877;stroke-width:2}
      .primary{fill:#253149;stroke:#f2a45f;stroke-width:2.5}
      .label{font-size:13px;font-weight:700;letter-spacing:1px;fill:#73d6c4}
      .heading{font-size:18px;font-weight:700;fill:#f2f6fc}
      .body{font-size:14px;fill:#c4d0df}
      .small{font-size:12px;fill:#9fb0c5}
    </style>
  </defs>
  <rect width="1200" height="630" rx="30" fill="#0d1728"/>
  <rect x="24" y="24" width="1152" height="582" rx="22" fill="#142137" stroke="#263a55" stroke-width="2"/>
  <text x="60" y="61" class="eyebrow">NOTION / DATA PLATFORM / 200B+ BLOCKS</text>
  <image x="1010" y="34" width="132" height="48" preserveAspectRatio="xMaxYMid meet" href="../logo.png"/>
  <text x="60" y="111" class="title">One block feeds several purpose-built systems.</text>
  <text x="60" y="142" class="subtitle">Canonical edits stay on shards; CDC feeds the workloads that need different data shapes.</text>

  <text x="60" y="177" class="label">ONLINE WRITE PATH</text>
  <rect x="60" y="192" width="235" height="117" rx="13" class="box"/>
  <text x="82" y="224" class="label">EDITOR</text>
  <text x="82" y="258" class="heading">Block change</text>
  <text x="82" y="285" class="body">optimistic client edit</text>

  <path d="M295 250H315" fill="none" stroke="#9db3cf" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="325" y="192" width="235" height="117" rx="13" class="box"/>
  <text x="347" y="224" class="label">API + PERMISSIONS</text>
  <text x="347" y="258" class="heading">Authorize + route</text>
  <text x="347" y="285" class="body">workspace policy</text>

  <path d="M560 250H580" fill="none" stroke="#9db3cf" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="590" y="192" width="250" height="117" rx="13" class="primary"/>
  <text x="612" y="224" class="label" fill="#ffbd83">POSTGRES</text>
  <text x="612" y="258" class="heading">480 logical shards</text>
  <text x="612" y="285" class="body">canonical blocks + WAL</text>

  <path d="M840 250H860" fill="none" stroke="#9db3cf" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="870" y="192" width="270" height="117" rx="13" class="box"/>
  <text x="892" y="224" class="label">KAFKA CDC</text>
  <text x="892" y="258" class="heading">Debezium stream</text>
  <text x="892" y="285" class="body">change fan-out begins</text>

  <text x="60" y="354" class="label">REPLAY + SPECIALIZED READ PATHS</text>
  <path d="M1005 309V378H240M1005 378H600M1005 378H960" fill="none" stroke="#67d5bf" stroke-width="2.5"/>
  <path d="M240 378V398" fill="none" stroke="#67d5bf" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <path d="M600 378V398" fill="none" stroke="#67d5bf" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <path d="M960 378V398" fill="none" stroke="#67d5bf" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <rect x="90" y="407" width="300" height="98" rx="13" class="box"/>
  <text x="114" y="439" class="label">DURABLE HISTORY</text>
  <text x="114" y="473" class="heading">Hudi on S3</text>
  <text x="114" y="492" class="small">replay + batch analytics</text>

  <rect x="450" y="407" width="300" height="98" rx="13" class="box"/>
  <text x="474" y="439" class="label">TEXT RETRIEVAL</text>
  <text x="474" y="473" class="heading">Search index</text>
  <text x="474" y="492" class="small">denormalized for fast lookup</text>

  <rect x="810" y="407" width="300" height="98" rx="13" class="box"/>
  <text x="834" y="439" class="label">SEMANTIC RETRIEVAL</text>
  <text x="834" y="473" class="heading">Vector tier</text>
  <text x="834" y="492" class="small">embeddings + access filters</text>

  <rect x="60" y="530" width="1080" height="46" rx="12" fill="#0d1728" stroke="#263a55" stroke-width="1.5"/>
  <text x="82" y="559" class="body">A block edit fans out. Model each read path separately; do not charge every workload to one store.</text>
  <text x="60" y="594" class="small">Architecture is reconstructed from public engineering posts; workload and cost figures are modeled in the article.</text>
</svg>
