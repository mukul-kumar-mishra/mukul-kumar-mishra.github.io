<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Modeled Kafka consumer-group rebalance cascade</title>
  <desc id="desc">Buildopsy scenario diagram: a classic-eager Kafka group with 120 members and 40,000 partitions. The model assumes a 660-second pause and a 60,000-events-per-second arrival rate, yielding 39.6 million backlog events. Two retries plus one original request make three attempts per affected call. No company incident or telemetry is described.</desc>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <rect x="3" y="3" width="1194" height="674" fill="none" stroke="#0f172a" stroke-width="6"/>
  <rect x="6" y="6" width="1188" height="60" fill="#0f172a"/>
  <text x="38" y="45" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">MODELED KAFKA GROUP-REBALANCE SCENARIO</text>
  <text x="1148" y="44" text-anchor="end" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="23" font-weight="700" fill="#f8fafc">Build<tspan fill="#16a34a">opsy</tspan></text>

  <text x="48" y="117" font-family="'Segoe UI', Verdana, sans-serif" font-size="30" font-weight="700" fill="#0f172a">When rejoin cadence meets the eager-rebalance barrier</text>
  <text x="48" y="151" font-family="'Segoe UI', Verdana, sans-serif" font-size="18" fill="#475569">Illustrative inputs: 120 members · 40,000 partitions · 60,000 arriving events/s</text>

  <g font-family="'Segoe UI', Verdana, sans-serif">
    <rect x="48" y="184" width="246" height="202" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <text x="68" y="218" font-family="monospace" font-size="14" font-weight="700" fill="#475569">01 · ROLLING DEPLOY</text>
    <text x="68" y="264" font-size="24" font-weight="700" fill="#0f172a">120 members</text>
    <text x="68" y="294" font-size="22" font-weight="700" fill="#0f172a">restart sequentially</text>
    <text x="68" y="342" font-size="17" fill="#475569">Sequential restarts</text>
    <text x="68" y="367" font-size="15" fill="#64748b">Model input, not telemetry.</text>

    <rect x="344" y="184" width="246" height="202" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
    <text x="364" y="218" font-family="monospace" font-size="14" font-weight="700" fill="#92400e">02 · CLASSIC EAGER</text>
    <text x="364" y="264" font-size="23" font-weight="700" fill="#0f172a">Revoke every</text>
    <text x="364" y="294" font-size="23" font-weight="700" fill="#0f172a">group assignment</text>
    <text x="364" y="342" font-size="16" fill="#475569">Then coordinate and</text>
    <text x="364" y="367" font-size="16" fill="#475569">install the new assignment.</text>

    <rect x="640" y="184" width="246" height="202" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
    <text x="660" y="218" font-family="monospace" font-size="14" font-weight="700" fill="#9f1239">03 · OVERLAP CONDITION</text>
    <text x="660" y="264" font-size="22" font-weight="700" fill="#0f172a">Next membership</text>
    <text x="660" y="294" font-size="22" font-weight="700" fill="#0f172a">change arrives early</text>
    <text x="660" y="342" font-size="16" fill="#475569">Before the prior rebalance</text>
    <text x="660" y="367" font-size="16" fill="#475569">has finished.</text>

    <rect x="936" y="184" width="216" height="202" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
    <text x="956" y="218" font-family="monospace" font-size="14" font-weight="700" fill="#9f1239">04 · MODELED RESULT</text>
    <text x="956" y="264" font-size="23" font-weight="700" fill="#0f172a">Group pause</text>
    <text x="956" y="294" font-size="28" font-weight="700" fill="#e11d48">660 s</text>
    <text x="956" y="342" font-size="16" fill="#475569">Duration is an</text>
    <text x="956" y="367" font-size="16" fill="#475569">assumed input.</text>
  </g>

  <g fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M301 284 H331 M320 273 L332 284 L320 295"/>
    <path d="M597 284 H627 M616 273 L628 284 L616 295"/>
    <path d="M893 284 H923 M912 273 L924 284 L912 295"/>
  </g>

  <rect x="48" y="414" width="1104" height="146" rx="10" fill="#0f172a"/>
  <text x="76" y="448" font-family="monospace" font-size="15" font-weight="700" fill="#fda4af">MODELED CONSEQUENCES</text>
  <text x="76" y="486" font-family="'Segoe UI', Verdana, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">60,000 events/s × 660 s = 39.6 million backlog events</text>
  <text x="76" y="526" font-family="'Segoe UI', Verdana, sans-serif" font-size="20" font-weight="700" fill="#86efac">1 original + 2 retries = 3 attempts per affected call, not 6× total load</text>

  <text x="48" y="601" font-family="'Segoe UI', Verdana, sans-serif" font-size="16" fill="#475569">Protocol: Apache Kafka documentation and KIP-429 · group size, pause and arrival rate are modeled inputs.</text>
  <line x1="48" y1="620" x2="1152" y2="620" stroke="#cbd5e1" stroke-width="2"/>
  <text x="48" y="652" font-family="monospace" font-size="15" fill="#475569">SOURCE: APACHE KAFKA CONSUMER REBALANCE PROTOCOL · KIP-429</text>
  <text x="1152" y="652" text-anchor="end" font-family="monospace" font-size="14" font-weight="700" fill="#0f172a">BY MUKUL KUMAR MISHRA</text>
</svg>
