<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Pen sketched meme of a rolling deploy pausing every Kafka consumer">
  <defs>
    <filter id="roughen" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1200" height="680" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="680" fill="none" stroke="#0f172a" stroke-width="6"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a"/>
  <text x="36" y="41" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">The Deploy That Paused Every Consumer</text>
  <text x="948" y="41" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">Build<tspan dx="10" fill="#16a34a">opsy</tspan></text>
  <text x="60" y="130" font-family="'Segoe Script','Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-size="34" font-weight="bold" fill="#0f172a">120 restarts in. 11 minutes out. Zero moved.</text>
  <text x="60" y="156" font-family="'Segoe Script','Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-size="21" font-style="italic" fill="#475569">the coordinator was the bottleneck.</text>
  <g filter="url(#roughen)" stroke="#0f172a" stroke-width="3" stroke-linecap="round">
    <rect x="60" y="200" width="300" height="140" rx="14" fill="#ffffff"/>
    <rect x="60" y="200" width="300" height="36" fill="#0f172a"/>
    <text x="75" y="223" font-family="monospace" font-size="12" font-weight="bold" fill="#f8fafc" stroke="none">rolling deploy</text>
    <text x="75" y="262" font-family="monospace" font-size="12" fill="#0f172a" stroke="none">120 consumers restart</text>
    <text x="75" y="282" font-family="monospace" font-size="12" fill="#0f172a" stroke="none">one by one, all day</text>
    <text x="75" y="312" font-family="monospace" font-size="11" fill="#475569" stroke="none">each restart rejoins group</text>
  </g>
  <g font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="24" font-weight="bold" fill="#e11d48"><text x="372" y="275">→</text></g>
  <g filter="url(#roughen)">
    <rect x="412" y="200" width="340" height="140" rx="14" fill="#fffbeb" stroke="#e11d48" stroke-width="4"/>
    <rect x="412" y="200" width="340" height="36" fill="#e11d48"/>
    <text x="427" y="223" font-family="monospace" font-size="12" font-weight="bold" fill="#fff" stroke="none">coordinator rebalances</text>
    <text x="427" y="262" font-family="monospace" font-size="12" fill="#0f172a" stroke="none">40,000 partitions reassign</text>
    <text x="427" y="282" font-family="monospace" font-size="12" fill="#e11d48" stroke="none">consumption stops worldwide</text>
    <text x="427" y="312" font-family="monospace" font-size="11" fill="#475569" stroke="none">eager protocol, full stop</text>
  </g>
  <g font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="24" font-weight="bold" fill="#0f172a"><text x="764" y="275">→</text></g>
  <g filter="url(#roughen)">
    <rect x="804" y="200" width="336" height="140" rx="14" fill="#16a34a" stroke="#0f172a" stroke-width="3"/>
    <text x="819" y="231" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff" stroke="none">fetch plus retry storm</text>
    <text x="819" y="262" font-family="monospace" font-size="12" fill="#ffffff" stroke="none">duplicates multiply times 6</text>
    <text x="819" y="282" font-family="monospace" font-size="12" fill="#ffffff" stroke="none">downstream times out</text>
    <text x="819" y="312" font-family="monospace" font-size="11" fill="#dcfce7" stroke="none">run the retry math</text>
  </g>
  <g filter="url(#roughen)" stroke="#0f172a" stroke-width="3" stroke-linecap="round">
    <rect x="60" y="380" width="1080" height="110" rx="14" fill="#ffffff"/>
    <text x="90" y="422" font-family="monospace" font-size="13" fill="#0f172a" stroke="none">rebalance math: 120 members times ~330 partitions each, one JoinGroup at a time.</text>
    <text x="90" y="448" font-family="monospace" font-size="13" fill="#0f172a" stroke="none">rolling restart never lets the group settle. the timer resets on every deploy.</text>
    <text x="90" y="474" font-family="monospace" font-size="12" fill="#475569" stroke="none">static membership plus cooperative rebalance ends the loop. estimates modeled.</text>
  </g>
  <rect x="60" y="540" width="1080" height="80" fill="#0f172a"/>
  <text x="90" y="591" font-family="'Segoe Script','Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-size="27" font-weight="bold" fill="#f8fafc">deploy one. pause all.</text>
  <text x="470" y="591" font-family="'Segoe Script','Segoe Print','Comic Sans MS','Chalkboard SE',cursive" font-size="27" font-weight="bold" fill="#16a34a">rebalance is stop-the-world.</text>
</svg>
