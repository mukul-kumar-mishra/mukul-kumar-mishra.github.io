<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Pen sketched meme of a dizzy man meeting a goldfish that holds the session memory">
  <defs>
    <filter id="roughen" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1200" height="680" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="680" fill="none" stroke="#0f172a" stroke-width="6"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a"/>
  <text x="36" y="41" font-family="monospace" font-size="22" font-weight="bold" letter-spacing="3" fill="#16a34a">FIELD MEME</text>
  <text x="948" y="41" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">Mukul<tspan dx="10" fill="#16a34a">Mishra</tspan></text>
  <text x="60" y="122" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">MEET YOUR CODEBASE. AGAIN.</text>
  <text x="60" y="156" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="21" font-style="italic" fill="#475569">context compacted. memories liquidated.</text>
  <g transform="translate(250,400)" filter="url(#roughen)" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="0" cy="-80" r="30" fill="#ffffff"/>
    <path d="M-16,-88 l10,6 M-6,-82 l-10,6 M6,-88 l10,6 M16,-82 l-10,6"/>
    <path d="M-10,-56 q5,-6 10,0 q5,6 10,0"/>
    <rect x="-26" y="-48" width="52" height="98" fill="#ffffff"/>
    <path d="M26,-30 L110,-10"/>
    <path d="M-52,-128 l0,-20 M-62,-138 l20,0 M96,-128 l0,-20 M86,-138 l20,0"/>
    <text x="118" y="-128" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="30" font-weight="bold" fill="#0f172a" stroke="none">?</text>
  </g>
  <g transform="translate(880,400)" filter="url(#roughen)" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none">
    <ellipse cx="0" cy="30" rx="90" ry="70" fill="#e8f4ff"/>
    <ellipse cx="0" cy="-40" rx="90" ry="12" fill="#f8fafc"/>
    <ellipse cx="-30" cy="10" rx="34" ry="22" fill="#f8b4c0"/>
    <path d="M4,10 l26,-16 M4,10 l26,16"/>
    <circle cx="-42" cy="6" r="4" fill="#0f172a"/>
    <path d="M-52,22 q6,5 12,1"/>
    <text x="-72" y="88" font-family="monospace" font-size="17" fill="#0f172a" stroke="none">session memory</text>
  </g>
  <g font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="20" font-style="italic" fill="#475569">
    <text x="560" y="300">nice to meet you.</text>
    <text x="560" y="332">for the 28th time.</text>
  </g>
  <rect x="60" y="540" width="1080" height="80" fill="#0f172a"/>
  <text x="90" y="590" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="25" font-weight="bold" fill="#f8fafc">99% off.</text>
  <text x="300" y="590" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="25" font-weight="bold" fill="#16a34a">memories, that is.</text>
</svg>
