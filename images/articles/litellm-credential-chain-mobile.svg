<svg xmlns="http://www.w3.org/2000/svg" width="390" height="680" viewBox="0 0 390 680" role="img" aria-labelledby="title desc">
  <title id="title">The LiteLLM credential chain from May 27 to October 21, 2026</title>
  <desc id="desc">A master key committed to a public repository on May 27 was not revoked. On October 10 the Agent Platform API returned an organization owner's GitHub CLI token; two CI workflows then posted two maintainer tokens to an attacker endpoint. On October 21 the owner token overrode branch protection, one maintainer token approved the release, and another deleted the run records.</desc>
  <rect width="390" height="680" fill="#fbf7ef"/>
  <text x="20" y="32" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#171412">The credential chain</text>
  <text x="20" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b5b4e">May 27 → Oct 10 → Oct 21, 2026 · UTC</text>

  <line x1="28" y1="76" x2="28" y2="560" stroke="#8f2d2d" stroke-width="2"/>

  <circle cx="28" cy="92" r="6" fill="#8f2d2d"/>
  <text x="46" y="90" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#8f2d2d">MAY 27 · 18:53:14</text>
  <text x="46" y="110" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#171412">Public config commit</text>
  <text x="46" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#171412">Agent Platform master key.</text>
  <text x="46" y="148" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#8f2d2d">Force-pushed over; not revoked.</text>

  <circle cx="28" cy="182" r="6" fill="#8f2d2d"/>
  <text x="46" y="180" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#b07a10">OCT 10 · 21:27:10</text>
  <text x="46" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#171412">Agent Platform API</text>
  <text x="46" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#171412">Returns the owner's GitHub CLI token.</text>
  <text x="46" y="238" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b5b4e">From 69.48.229.143.</text>

  <circle cx="28" cy="272" r="6" fill="#8f2d2d"/>
  <text x="46" y="270" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#8f2d2d">OCT 10 · 22:11–22:12</text>
  <text x="46" y="290" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#171412">Two CI workflows</text>
  <text x="46" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#171412">Post GH_TOKEN and</text>
  <text x="46" y="328" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#171412">RELEASE_PLEASE_TOKEN to an attacker endpoint.</text>

  <circle cx="28" cy="362" r="6" fill="#8f2d2d"/>
  <text x="46" y="360" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#8f2d2d">OCT 21 · 10:08:34</text>
  <text x="46" y="380" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#171412">Owner token</text>
  <text x="46" y="400" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#171412">Overrides branch protection.</text>
  <text x="46" y="418" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#171412">Source set to Berri-AI/litellm.</text>

  <circle cx="28" cy="452" r="6" fill="#8f2d2d"/>
  <text x="46" y="450" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#b07a10">OCT 21 · 11:11 / 11:53</text>
  <text x="46" y="470" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#171412">Two maintainer tokens</text>
  <text x="46" y="490" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#171412">Approve the gate, then delete</text>
  <text x="46" y="508" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#171412">the production and staging run records.</text>

  <rect x="20" y="540" width="350" height="72" rx="10" fill="#f4e6d2" stroke="#d8a83e"/>
  <text x="34" y="566" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8f2d2d">A force-push is not revocation.</text>
  <text x="34" y="586" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#171412">The key stayed valid from May to October.</text>
  <text x="34" y="602" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#171412">The first token came from the Agent Platform.</text>

  <text x="20" y="646" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6b5b4e">Source: LiteLLM final attack-chain report, Oct 23 2026.</text>
</svg>
