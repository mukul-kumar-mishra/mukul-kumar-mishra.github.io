<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Razorpay's Kafka migration and reported IAM connection cap</title>
  <desc id="desc">Three stacked panels summarize Razorpay Engineering's SQS-to-MSK Serverless migration, a reported limit of about 3,000 active IAM-authenticated connections per broker, and a move to franz-go. Exact before-and-after client connection and latency figures remain marked for verification.</desc>
  <style>text{font-family:Arial,Inter,sans-serif}.mono{font-family:Consolas,"Liberation Mono",monospace}</style>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <rect width="1200" height="66" fill="#0f172a"/>
  <text x="38" y="44" class="mono" font-size="30" font-weight="700" fill="#f8fafc">RAZORPAY · KAFKA MIGRATION</text>
  <text x="55" y="118" font-size="45" font-weight="700" fill="#0f172a">Reported cap; client deltas [VERIFY].</text>
  <rect x="50" y="145" width="1100" height="115" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="78" y="181" class="mono" font-size="30" font-weight="700" fill="#0f172a">MIGRATION</text>
  <text x="78" y="233" class="mono" font-size="48" font-weight="700" fill="#0369a1">SQS → MSK Serverless</text>
  <text x="650" y="214" class="mono" font-size="34" fill="#334155">less broker sizing</text>
  <rect x="50" y="275" width="1100" height="120" rx="12" fill="#fffbeb" stroke="#e11d48" stroke-width="3"/>
  <text x="78" y="312" class="mono" font-size="30" font-weight="700" fill="#be123c">REPORTED IAM LIMIT · ASIA CUP SURGE</text>
  <text x="78" y="369" class="mono" font-size="48" font-weight="700" fill="#0f172a">~3,000 active connections / broker</text>
  <rect x="50" y="410" width="1100" height="120" rx="12" fill="#16a34a" stroke="#0f172a" stroke-width="3"/>
  <text x="78" y="447" class="mono" font-size="30" font-weight="700" fill="#dcfce7">CLIENT RECOVERY</text>
  <text x="78" y="503" class="mono" font-size="43" font-weight="700" fill="#ffffff">franz-go · DNS refresh · client controls</text>
  <text x="50" y="575" class="mono" font-size="30" fill="#0f172a">Razorpay marks before/after connection and latency figures [VERIFY].</text>
  <text x="50" y="623" class="mono" font-size="24" fill="#475569">Source: Razorpay Engineering, “Five Years of Kafka at Razorpay’s UPI Switch” (Sep. 7, 2026)</text>
</svg>
