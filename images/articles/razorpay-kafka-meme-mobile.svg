<svg xmlns="http://www.w3.org/2000/svg" width="390" height="700" viewBox="0 0 390 700" role="img">
  <title>Razorpay Kafka migration connection cap</title>
  <desc>Razorpay UPI Switch migration from SQS to MSK Serverless and the reported 3,000 active connections per broker IAM cap.</desc>
<rect width="390" height="700" fill="#080F1C"/>
  <rect x="10" y="10" width="370" height="680" rx="12" fill="#141F33" stroke="#24344F" stroke-width="1.4"/>
  <text x="24.0" y="42.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#7DD3C7" letter-spacing="1.5">RAZORPAY / KAFKA</text>
  <text x="24.0" y="72.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#EAF1FA">3,000 Connection Cap</text>
  <line x1="24" y1="88" x2="366" y2="88" stroke="#2F4A6E" stroke-width="1"/>
  <text x="24.0" y="116.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#EAF1FA">SQS to MSK Serverless Migration</text>
  <text x="24.0" y="138.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">Adopted for UPI Switch streaming scale</text>
  <rect x="24.0" y="170.0" width="342.0" height="100.0" rx="8" fill="#101C2F" stroke="#F08A7E" stroke-width="1.4"/>
  <text x="40.0" y="206.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="34" font-weight="700" fill="#F08A7E">3,000</text>
  <text x="40.0" y="232.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#EAF1FA">active connections per broker cap</text>
  <text x="40.0" y="252.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">IAM authentication limit on MSK</text>
  <rect x="24.0" y="290.0" width="342.0" height="110.0" rx="8" fill="#101C2F" stroke="#2F4A6E" stroke-width="1.2"/>
  <text x="36.0" y="318.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#7DD3C7">Reported Bottlenecks</text>
  <text x="36.0" y="340.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">- Client connection deltas marked [VERIFY]</text>
  <text x="36.0" y="360.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">- Partition count pressure on brokers</text>
  <text x="36.0" y="380.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">- Required franz-go client tuning</text>
  <rect x="24.0" y="420.0" width="342.0" height="90.0" rx="8" fill="#101C2F" stroke="#7DD3C7" stroke-width="1.2"/>
  <text x="36.0" y="448.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#7DD3C7">Resolution</text>
  <text x="36.0" y="470.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">Connection pooling, split consumer groups,</text>
  <text x="36.0" y="488.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">and isolated VPA validation services.</text>
  <text x="24.0" y="660.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="10" font-weight="400" fill="#64748B">Razorpay retrospective; client deltas marked VERIFY</text>
</svg>
