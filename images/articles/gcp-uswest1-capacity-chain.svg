<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">GCP us-west1 outage: reported capacity failure sequence</title>
  <desc id="desc">Buildopsy diagram of Google's August 2026 incident report: scheduled fiber maintenance unexpectedly reduced inter-datacenter capacity; automated rerouting did not properly redistribute traffic; traffic exceeded available bandwidth, causing congestion, packet loss, request throttling, latency and errors. The diagram is not Google's network topology.</desc>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <rect x="3" y="3" width="1194" height="674" fill="none" stroke="#0f172a" stroke-width="6"/>
  <rect x="6" y="6" width="1188" height="60" fill="#0f172a"/>
  <text x="38" y="45" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="21" font-weight="700" fill="#f8fafc">GCP US-WEST1 · AUG 20, 2026</text>
  <text x="1148" y="44" text-anchor="end" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="23" font-weight="700" fill="#f8fafc">Build<tspan fill="#16a34a">opsy</tspan></text>

  <text x="48" y="116" font-family="'Segoe UI', Verdana, sans-serif" font-size="31" font-weight="700" fill="#0f172a">How planned fiber work became a regional capacity failure</text>
  <text x="48" y="151" font-family="'Segoe UI', Verdana, sans-serif" font-size="19" fill="#475569">Sequence reported in Google Cloud's final incident report</text>

  <g font-family="'Segoe UI', Verdana, sans-serif">
    <rect x="48" y="184" width="240" height="218" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <text x="68" y="218" font-family="monospace" font-size="15" font-weight="700" fill="#475569">01 · SCHEDULED WORK</text>
    <text x="68" y="267" font-size="26" font-weight="700" fill="#0f172a">Fiber</text>
    <text x="68" y="299" font-size="26" font-weight="700" fill="#0f172a">maintenance</text>
    <text x="68" y="349" font-size="17" fill="#475569">Unexpectedly reduced</text>
    <text x="68" y="375" font-size="17" fill="#475569">inter-datacenter capacity.</text>

    <rect x="336" y="184" width="240" height="218" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <text x="356" y="218" font-family="monospace" font-size="15" font-weight="700" fill="#92400e">02 · CAPACITY LOSS</text>
    <text x="356" y="267" font-size="26" font-weight="700" fill="#0f172a">Less available</text>
    <text x="356" y="299" font-size="26" font-weight="700" fill="#0f172a">bandwidth</text>
    <text x="356" y="349" font-size="17" fill="#475569">Between data centers</text>
    <text x="356" y="375" font-size="17" fill="#475569">in the us-west1 region.</text>

    <rect x="624" y="184" width="240" height="218" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
    <text x="644" y="218" font-family="monospace" font-size="15" font-weight="700" fill="#9f1239">03 · REROUTING</text>
    <text x="644" y="267" font-size="26" font-weight="700" fill="#0f172a">Rerouting</text>
    <text x="644" y="299" font-size="26" font-weight="700" fill="#0f172a">shortfall</text>
    <text x="644" y="344" font-size="16" fill="#475569">Rerouting did not properly</text>
    <text x="644" y="369" font-size="16" fill="#475569">redistribute traffic to</text>
    <text x="644" y="394" font-size="16" fill="#475569">alternate capacity.</text>

    <rect x="912" y="184" width="240" height="218" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
    <text x="932" y="218" font-family="monospace" font-size="15" font-weight="700" fill="#9f1239">04 · CONGESTION</text>
    <text x="932" y="267" font-size="26" font-weight="700" fill="#0f172a">Traffic exceeded</text>
    <text x="932" y="299" font-size="26" font-weight="700" fill="#0f172a">available capacity</text>
    <text x="932" y="344" font-size="16" fill="#475569">Traffic volumes exceeded</text>
    <text x="932" y="369" font-size="16" fill="#475569">available bandwidth in</text>
    <text x="932" y="394" font-size="16" fill="#475569">the affected area.</text>
  </g>

  <g fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M298 293 H324 M315 282 L326 293 L315 304"/>
    <path d="M586 293 H612 M603 282 L614 293 L603 304"/>
    <path d="M874 293 H900 M891 282 L902 293 L891 304"/>
  </g>

  <rect x="48" y="438" width="1104" height="112" rx="8" fill="#0f172a"/>
  <text x="76" y="474" font-family="monospace" font-size="16" font-weight="700" fill="#fda4af">REPORTED EFFECTS</text>
  <text x="76" y="518" font-family="'Segoe UI', Verdana, sans-serif" font-size="27" font-weight="700" fill="#f8fafc">Packet loss · request throttling · latency · service errors</text>

  <text x="48" y="592" font-family="'Segoe UI', Verdana, sans-serif" font-size="17" fill="#475569">Buildopsy illustration of Google's public sequence, not a network topology; the report publishes no capacity or traffic values.</text>
  <line x1="48" y1="614" x2="1152" y2="614" stroke="#cbd5e1" stroke-width="2"/>
  <text x="48" y="649" font-family="monospace" font-size="15" fill="#475569">SOURCE: GOOGLE CLOUD STATUS · FINAL REPORT POSTED AUG 27, 2026</text>
  <text x="1152" y="649" text-anchor="end" font-family="monospace" font-size="14" font-weight="700" fill="#0f172a">BY MUKUL KUMAR MISHRA</text>
</svg>
