<title id="img-title">One zone lost packets. The region felt it.</title>
<desc id="img-desc">AWS EU-SOUTH-2: a networking change in eus2-az1 raised API errors region-wide until reverted.. 1 / CHANGE, Networking change deploys, Single AZ: eus2-az1 · Packet loss from 08:48 PDT. 2 / FAN-OUT, Regional APIs stumble, EC2, DynamoDB, EKS + more · Latency + errors past timeouts. 3 / REVERT, Change undone at 10:38, Full recovery 11:28 PDT · 2h 40m total window</desc>
