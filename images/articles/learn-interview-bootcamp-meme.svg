<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="interview-title interview-desc">
  <title id="interview-title">System design interview bootcamp: draw the path, defend the math</title>
  <desc id="interview-desc">A dark technical course banner maps a repeatable interview sequence from clarifying users and service goals through sketching, sizing, failure testing, and a final decision.</desc>
  <defs>
    <linearGradient id="interview-bg" x2="1" y2="1"><stop stop-color="#101e2e"/><stop offset="1" stop-color="#222c43"/></linearGradient>
    <pattern id="interview-dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d6e8ff" opacity=".16"/></pattern>
    <marker id="interview-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8da9bd"/></marker>
  </defs>
  <rect width="1200" height="680" rx="32" fill="url(#interview-bg)"/>
  <rect width="1200" height="680" rx="32" fill="url(#interview-dots)"/>
  <text x="70" y="73" fill="#d4ec74" font-family="ui-monospace,monospace" font-size="15" letter-spacing="3">SYSTEM DESIGN / INTERVIEW FIELD GUIDE</text>
  <text x="68" y="145" fill="#f4f5ee" font-family="Georgia,serif" font-size="51">Show the path. Defend the math.</text>
  <text x="72" y="184" fill="#b9c8d5" font-family="ui-monospace,monospace" font-size="17">Clarify, sketch, size, stress-test, decide—one visible chain of reasoning.</text>

  <g font-family="ui-monospace,monospace">
    <rect x="54" y="250" width="194" height="196" rx="15" fill="#142a3a" stroke="#d4ec74" stroke-width="2"/>
    <text x="74" y="282" fill="#d4ec74" font-size="13" letter-spacing="2">01 / SCOPE</text>
    <text x="74" y="325" fill="#f4f5ee" font-size="22" font-weight="700">Clarify</text>
    <text x="74" y="360" fill="#b9c8d5" font-size="13">users · use cases</text>
    <text x="74" y="384" fill="#b9c8d5" font-size="13">SLO · constraints</text>
    <text x="74" y="420" fill="#74d4c4" font-size="12">write assumptions</text>

    <rect x="282" y="250" width="194" height="196" rx="15" fill="#142a3a" stroke="#74d4c4" stroke-width="2"/>
    <text x="302" y="282" fill="#74d4c4" font-size="13" letter-spacing="2">02 / MODEL</text>
    <text x="302" y="325" fill="#f4f5ee" font-size="22" font-weight="700">Sketch</text>
    <rect x="302" y="348" width="50" height="31" rx="5" fill="#20384a" stroke="#74d4c4"/>
    <rect x="382" y="348" width="72" height="31" rx="5" fill="#20384a" stroke="#74d4c4"/>
    <path d="M352 364H376" stroke="#d4ec74" stroke-width="2" marker-end="url(#interview-arrow)"/>
    <text x="302" y="420" fill="#b9c8d5" font-size="12">request path</text>

    <rect x="510" y="250" width="194" height="196" rx="15" fill="#142a3a" stroke="#aaa2dc" stroke-width="2"/>
    <text x="530" y="282" fill="#c0b8ed" font-size="13" letter-spacing="2">03 / SIZE</text>
    <text x="530" y="325" fill="#f4f5ee" font-size="22" font-weight="700">Calculate</text>
    <text x="530" y="360" fill="#b9c8d5" font-size="13">RPS · data size</text>
    <text x="530" y="384" fill="#b9c8d5" font-size="13">bandwidth · cost</text>
    <text x="530" y="420" fill="#d4ec74" font-size="12">say units aloud</text>

    <rect x="738" y="250" width="194" height="196" rx="15" fill="#142a3a" stroke="#d7a263" stroke-width="2"/>
    <text x="758" y="282" fill="#e2b675" font-size="13" letter-spacing="2">04 / STRESS</text>
    <text x="758" y="325" fill="#f4f5ee" font-size="22" font-weight="700">Challenge</text>
    <text x="758" y="360" fill="#b9c8d5" font-size="13">failure · retries</text>
    <text x="758" y="384" fill="#b9c8d5" font-size="13">recovery · limits</text>
    <text x="758" y="420" fill="#e2b675" font-size="12">break your design</text>

    <rect x="966" y="250" width="180" height="196" rx="15" fill="#142a3a" stroke="#d4ec74" stroke-width="2"/>
    <text x="986" y="282" fill="#d4ec74" font-size="13" letter-spacing="2">05 / CLOSE</text>
    <text x="986" y="325" fill="#f4f5ee" font-size="22" font-weight="700">Decide</text>
    <text x="986" y="360" fill="#b9c8d5" font-size="13">trade-off</text>
    <text x="986" y="384" fill="#b9c8d5" font-size="13">cost · verdict</text>
    <text x="986" y="420" fill="#74d4c4" font-size="12">name next step</text>
  </g>
  <path d="M250 348H273M478 348H501M706 348H729M934 348H957" fill="none" stroke="#d4ec74" stroke-width="3" stroke-dasharray="6 7" marker-end="url(#interview-arrow)"/>
  <rect x="54" y="486" width="1092" height="128" rx="16" fill="#111c2a" fill-opacity=".95" stroke="#637c91" stroke-opacity=".65"/>
  <text x="82" y="523" fill="#d4ec74" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2">THE WHITEBOARD PROMISE</text>
  <text x="82" y="564" fill="#f4f5ee" font-family="ui-monospace,monospace" font-size="18">assumptions first · bottleneck next · trade-off last</text>
  <text x="82" y="592" fill="#b9c8d5" font-family="ui-monospace,monospace" font-size="13">Every number gets a unit. Every failure gets a recovery plan.</text>
</svg>
