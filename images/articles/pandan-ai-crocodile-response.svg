<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Pandan Reservoir AI image incident and disclosure timeline</title>
  <desc id="desc">Chronological timeline of the August 20 crocodile-image report, August 21 fake-image confirmation and August 22 resumption of water activities, September 29 court charges, and PUB's October 1 public disclosure that earlier AI checks were inconclusive.</desc>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <rect width="1200" height="64" fill="#0f172a"/>
  <text x="36" y="41" font-family="Sora, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">PANDAN RESERVOIR: IMAGE, SIGNAL, RESPONSE</text>
  <text x="948" y="41" font-family="Sora, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Build<tspan fill="#16a34a">opsy</tspan></text>
  <text x="60" y="117" font-family="Sora, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Four dates. Three different kinds of evidence.</text>
  <text x="60" y="149" font-family="Montserrat, Arial, sans-serif" font-size="16" fill="#475569">Timeline dates mark reported events or public disclosure, not detector runtime.</text>
  <line x1="145" y1="370" x2="1055" y2="370" stroke="#94a3b8" stroke-width="5"/>
  <g>
    <rect x="60" y="207" width="255" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="60" y="207" width="255" height="8" rx="4" fill="#38bdf8"/>
    <text x="80" y="245" font-family="Sora, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">AUG 20 · REPORT</text>
    <text x="80" y="276" font-family="Montserrat, Arial, sans-serif" font-size="15" fill="#334155">Image reported to PUB.</text>
    <text x="80" y="299" font-family="Montserrat, Arial, sans-serif" font-size="15" fill="#334155">searches and precaution</text>
    <text x="80" y="322" font-family="Montserrat, Arial, sans-serif" font-size="15" fill="#334155">begin.</text>
    <circle cx="187" cy="370" r="16" fill="#38bdf8" stroke="#0f172a" stroke-width="3"/>
  </g>
  <g>
    <rect x="330" y="207" width="255" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="330" y="207" width="255" height="8" rx="4" fill="#fbbf24"/>
    <text x="350" y="245" font-family="Sora, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">AUG 21–22 · RESPONSE</text>
    <text x="350" y="276" font-family="Montserrat, Arial, sans-serif" font-size="15" fill="#334155">PUB confirms photo fake.</text>
    <text x="350" y="299" font-family="Montserrat, Arial, sans-serif" font-size="15" fill="#334155">search ends. Water use</text>
    <text x="350" y="322" font-family="Montserrat, Arial, sans-serif" font-size="15" fill="#334155">resumes Aug 22.</text>
    <circle cx="457" cy="370" r="16" fill="#fbbf24" stroke="#0f172a" stroke-width="3"/>
  </g>
  <g>
    <rect x="600" y="207" width="255" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="600" y="207" width="255" height="8" rx="4" fill="#fb7185"/>
    <text x="620" y="245" font-family="Sora, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">SEP 29 · COURT</text>
    <text x="620" y="276" font-family="Montserrat, Arial, sans-serif" font-size="15" fill="#334155">Two charges filed.</text>
    <text x="620" y="299" font-family="Montserrat, Arial, sans-serif" font-size="15" fill="#334155">No conviction reported</text>
    <text x="620" y="322" font-family="Montserrat, Arial, sans-serif" font-size="15" fill="#334155">as of Oct 9.</text>
    <circle cx="727" cy="370" r="16" fill="#fb7185" stroke="#0f172a" stroke-width="3"/>
  </g>
  <g>
    <rect x="870" y="207" width="255" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="870" y="207" width="255" height="8" rx="4" fill="#a3e635"/>
    <text x="890" y="245" font-family="Sora, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">OCT 1 · DISCLOSURE</text>
    <text x="890" y="276" font-family="Montserrat, Arial, sans-serif" font-size="15" fill="#334155">PUB says earlier AI</text>
    <text x="890" y="299" font-family="Montserrat, Arial, sans-serif" font-size="15" fill="#334155">checks gave inconclusive</text>
    <text x="890" y="322" font-family="Montserrat, Arial, sans-serif" font-size="15" fill="#334155">results.</text>
    <circle cx="997" cy="370" r="16" fill="#a3e635" stroke="#0f172a" stroke-width="3"/>
  </g>
  <rect x="60" y="450" width="1080" height="112" rx="10" fill="#0f172a"/>
  <text x="86" y="488" font-family="Sora, Arial, sans-serif" font-size="16" font-weight="700" fill="#a3e635">ROOK'S DISTINCTION</text>
  <text x="86" y="526" font-family="Montserrat, Arial, sans-serif" font-size="17" fill="#f8fafc">Inconclusive detection is not authenticity. Precaution is not proof. A charge is not a conviction.</text>
  <text x="1110" y="650" text-anchor="end" font-family="monospace" font-size="14" fill="#64748b">BY ROOK · AI INCIDENT AUDIT</text>
</svg>
