<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">A shared package cache can connect otherwise isolated agents</title>
  <desc id="desc">Two separate agent sandboxes can communicate when both can write to and enumerate the same Artifactory cache namespace. The shared namespace is an information-flow boundary.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#55718a"/></marker>
    <marker id="warn" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#b54735"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#152c3c}.eyebrow{font-size:15px;font-weight:700;letter-spacing:2px;fill:#387d75}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#526779}.box{fill:#fff;stroke:#a8bac5;stroke-width:2}.sandbox{fill:#edf3f7;stroke:#8099aa;stroke-width:2}.shared{fill:#fff4e7;stroke:#bf7440;stroke-width:3}.label{font-size:19px;font-weight:700}.small{font-size:15px;fill:#526779}.mono{font:15px ui-monospace,Consolas,monospace}.flow{fill:none;stroke:#55718a;stroke-width:3;marker-end:url(#arrow)}.risk{fill:none;stroke:#b54735;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#warn)}
    </style>
  </defs>
  <rect width="1200" height="680" rx="20" fill="#f5f7f8"/>
  <text x="54" y="57" class="eyebrow">DISTRIBUTED AGENT SECURITY · INFORMATION-FLOW MODEL</text>
  <text x="54" y="111" class="title">Isolation stops at the shared namespace</text>
  <text x="54" y="145" class="sub">A storage service becomes a communication channel when writers and readers cross trust boundaries.</text>

  <rect x="54" y="193" width="298" height="186" rx="14" class="sandbox"/>
  <text x="82" y="232" class="eyebrow">TRUST ZONE A</text>
  <text x="82" y="270" class="label">Agent A</text>
  <text x="82" y="300" class="small">Isolated execution environment</text>
  <rect x="82" y="324" width="240" height="34" rx="6" class="box"/>
  <text x="98" y="347" class="mono">write artifact name</text>

  <rect x="451" y="193" width="298" height="186" rx="14" class="shared"/>
  <text x="479" y="232" class="eyebrow" style="fill:#9b4f2e">SHARED TRUST BOUNDARY</text>
  <text x="479" y="270" class="label">Package cache</text>
  <text x="479" y="300" class="small">Same namespace · shared metadata</text>
  <rect x="479" y="324" width="240" height="34" rx="6" fill="#fff" stroke="#d5a27e" stroke-width="2"/>
  <text x="495" y="347" class="mono">directory / property names</text>

  <rect x="848" y="193" width="298" height="186" rx="14" class="sandbox"/>
  <text x="876" y="232" class="eyebrow">TRUST ZONE B</text>
  <text x="876" y="270" class="label">Agent B</text>
  <text x="876" y="300" class="small">Separate execution environment</text>
  <rect x="876" y="324" width="240" height="34" rx="6" class="box"/>
  <text x="892" y="347" class="mono">list and read metadata</text>

  <path d="M352 286h84" class="flow"/>
  <path d="M749 286h84" class="risk"/>
  <text x="366" y="267" class="small">write</text>
  <text x="766" y="267" class="small" style="fill:#9b3b2f">read</text>

  <rect x="54" y="424" width="1092" height="138" rx="14" fill="#e8eef2"/>
  <text x="82" y="463" class="eyebrow">DESIGN CONSEQUENCE</text>
  <text x="82" y="501" class="label">Treat shared mutable storage as a communication path—not passive infrastructure.</text>
  <text x="82" y="533" class="small">Scope by principal and run · authorize reads and writes · audit enumeration · test cross-tenant visibility</text>
  <text x="54" y="622" class="small">Incident figures are attributed to the METR / Redwood Research investigation; see the article sources.</text>
  <image x="982" y="598" width="164" height="60" preserveAspectRatio="xMaxYMid meet" href="../logo-white.png"/>
</svg>
