<svg xmlns="http://www.w3.org/2000/svg" width="390" height="680" viewBox="0 0 390 680" role="img" aria-labelledby="title desc">
  <title id="title">Maintenance sequencing failure led to fiber isolation in Google's us-central1 incident</title>
  <desc id="desc">Google's final report says a scheduled router capacity upgrade used incompatible optical transceivers. The manual work list omitted one-router-at-a-time instructions and expected human and software verification. Technicians disconnected fiber paths within thirteen minutes, isolating compute capacity from the network.</desc>
  <style>text{font-family:Inter,Arial,sans-serif}</style>
  <rect width="390" height="680" fill="#101a2c"/><rect width="390" height="58" fill="#0b1423"/>
  <text x="18" y="24" font-size="10" font-weight="700" letter-spacing="1.1" fill="#67d5cb">MAINTENANCE SEQUENCE / FINAL REPORT</text>
  <text x="18" y="82" font-size="20" font-weight="750" fill="#f2f6fb">Maintenance failure sequence</text>
  <text x="18" y="104" font-size="12" fill="#b6c5d8">Google's report · September 1, 2026</text>
  <rect x="18" y="124" width="354" height="88" rx="10" fill="#192741" stroke="#405776" stroke-width="1.5"/>
  <text x="31" y="151" font-size="12" font-weight="700" fill="#67d5cb">1 · ROUTER CAPACITY UPGRADE</text>
  <text x="31" y="180" font-size="12" fill="#f2f6fb">Scheduled data-center maintenance</text>
  <path d="M195 213v8m-5-4 5 5 5-5" fill="none" stroke="#b6c5d8" stroke-width="1.5"/>
  <rect x="18" y="224" width="354" height="88" rx="10" fill="#202e46" stroke="#405776" stroke-width="1.5"/>
  <text x="31" y="251" font-size="12" font-weight="700" fill="#ffb36b">2 · INCOMPATIBLE TRANSCEIVERS</text>
  <text x="31" y="280" font-size="12" fill="#f2f6fb">Replacement optics did not match fabric</text>
  <path d="M195 313v8m-5-4 5 5 5-5" fill="none" stroke="#b6c5d8" stroke-width="1.5"/>
  <rect x="18" y="324" width="354" height="88" rx="10" fill="#192741" stroke="#405776" stroke-width="1.5"/>
  <text x="31" y="351" font-size="12" font-weight="700" fill="#ffb36b">3 · SEQUENCE AND CHECKS MISSING</text>
  <text x="31" y="380" font-size="12" fill="#f2f6fb">Manual list omitted one-router-at-a-time controls</text>
  <path d="M195 413v8m-5-4 5 5 5-5" fill="none" stroke="#b6c5d8" stroke-width="1.5"/>
  <rect x="18" y="424" width="354" height="88" rx="10" fill="#202e46" stroke="#ff846e" stroke-width="1.5"/>
  <text x="31" y="451" font-size="12" font-weight="700" fill="#ff846e">4 · FIBER PATHS DISCONNECTED</text>
  <text x="31" y="480" font-size="12" fill="#f2f6fb">Affected compute capacity isolated within 13 min</text>
  <rect x="18" y="535" width="354" height="66" rx="10" fill="#283751" stroke="#405776" stroke-width="1.5"/>
  <text x="31" y="562" font-size="12" font-weight="700" fill="#67d5cb">REPORTED RESULT</text>
  <text x="31" y="583" font-size="12" fill="#f2f6fb">Affected compute clusters lost network access</text>
  <text x="18" y="648" font-size="9" fill="#b6c5d8">Source: Google Cloud Status · final report, Sep 10, 2026.</text>
</svg>
