<svg xmlns="http://www.w3.org/2000/svg" width="390" height="625" viewBox="0 0 390 625" role="img" aria-labelledby="title desc">
  <title id="title">Google's reported us-west1 recovery sequence</title>
  <desc id="desc">Google reports that engineers drained traffic away from the compromised inter-campus network, restored network capacity, and reintroduced production traffic through controlled validation stages. Some long-running operations and localized state reconciliation continued after primary service traffic normalized. Buildopsy illustration, not Google's network topology.</desc>
  <style>text{font-family:Inter,Arial,sans-serif}</style>
  <rect width="390" height="625" fill="#f8fafc"/><rect width="390" height="58" fill="#0f172a"/>
<image x="298" y="15" width="74" height="27" href="data:image/png;base64,"/>
  <text x="18" y="24" font-size="10" font-weight="700" letter-spacing="1.1" fill="#f8fafc">GCP US-WEST1 / REPORTED RECOVERY</text>
  <text x="18" y="83" font-size="21" font-weight="750" fill="#0f172a">Drain · restore · validate</text>
  <text x="18" y="105" font-size="12" fill="#475569">Google's final report · August 27, 2026</text>
  <rect x="18" y="128" width="354" height="88" rx="9" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="31" y="156" font-size="12" font-weight="700" fill="#475569">1 · DRAIN TRAFFIC</text>
  <text x="31" y="185" font-size="12" fill="#0f172a">Move production traffic off compromised links</text>
  <path d="M195 218v8m-5-4 5 5 5-5" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="18" y="230" width="354" height="88" rx="9" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="31" y="258" font-size="12" font-weight="700" fill="#166534">2 · RESTORE CAPACITY</text>
  <text x="31" y="287" font-size="12" fill="#0f172a">Repair the inter-campus network path</text>
  <path d="M195 320v8m-5-4 5 5 5-5" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="18" y="332" width="354" height="88" rx="9" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="31" y="360" font-size="12" font-weight="700" fill="#075985">3 · CONTROLLED REINTRODUCTION</text>
  <text x="31" y="389" font-size="12" fill="#0f172a">Return production traffic in validation stages</text>
  <rect x="18" y="455" width="354" height="90" rx="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="31" y="483" font-size="11" font-weight="700" fill="#334155">RECOVERY CONTINUED AFTER TRAFFIC NORMALIZED</text>
  <text x="31" y="511" font-size="12" fill="#0f172a">Some long-running operations and localized</text>
  <text x="31" y="531" font-size="12" fill="#0f172a">state reconciliation were still recovering.</text>
  <text x="18" y="581" font-size="10" fill="#475569">Buildopsy illustration, not Google's network topology.</text>
</svg>
