<svg xmlns="http://www.w3.org/2000/svg" width="390" height="700" viewBox="0 0 390 700" role="img">
  <title>Coinbase matching engine quorum loss timeline</title>
  <desc>Coinbase lost 3 of 5 matching engine nodes when AWS terminated instances in its placement group at 9:29 PM ET on May 7, 2026. Quorum returned at 12:06 AM ET and full trading resumed at 3:49 AM ET.</desc>
<rect width="390" height="700" fill="#080F1C"/>
  <rect x="10" y="10" width="370" height="680" rx="12" fill="#141F33" stroke="#24344F" stroke-width="1.4"/>
  <text x="24.0" y="42.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#7DD3C7" letter-spacing="1.5">COINBASE / AWS MAY 7</text>
  <text x="24.0" y="72.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#EAF1FA">Quorum lost at 9:29 PM</text>
  <line x1="24" y1="88" x2="366" y2="88" stroke="#2F4A6E" stroke-width="1"/>
  <text x="24.0" y="124.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#F2B263">7:20 PM</text>
  <text x="24.0" y="142.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">Chiller units fail in us-east-1 data hall</text>
  <text x="24.0" y="170.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#F2B263">7:48 PM</text>
  <text x="24.0" y="188.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">Nearly all trading halted</text>
  <text x="24.0" y="216.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#F08A7E">9:29 PM</text>
  <text x="24.0" y="234.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">AWS terminates placement group; 3/5 lost</text>
  <text x="24.0" y="262.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#7DD3C7">12:06 AM</text>
  <text x="24.0" y="280.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">Quorum restored (2h 37m)</text>
  <text x="24.0" y="308.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#7DD3C7">3:49 AM</text>
  <text x="24.0" y="326.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">Full trading resumed</text>
  <text x="24.0" y="360.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F08A7E">3 of 5 nodes lost in placement group</text>
  <rect x="24" y="380" width="60" height="34" rx="4" fill="#2E1721" stroke="#F08A7E" stroke-width="1.2"/>
  <text x="54.0" y="396.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="11" font-weight="600" fill="#F08A7E" text-anchor="middle">N1</text>
  <text x="54.0" y="408.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="9" font-weight="700" fill="#F08A7E" text-anchor="middle">DOWN</text>
  <rect x="92" y="380" width="60" height="34" rx="4" fill="#2E1721" stroke="#F08A7E" stroke-width="1.2"/>
  <text x="122.0" y="396.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="11" font-weight="600" fill="#F08A7E" text-anchor="middle">N2</text>
  <text x="122.0" y="408.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="9" font-weight="700" fill="#F08A7E" text-anchor="middle">DOWN</text>
  <rect x="160" y="380" width="60" height="34" rx="4" fill="#2E1721" stroke="#F08A7E" stroke-width="1.2"/>
  <text x="190.0" y="396.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="11" font-weight="600" fill="#F08A7E" text-anchor="middle">N3</text>
  <text x="190.0" y="408.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="9" font-weight="700" fill="#F08A7E" text-anchor="middle">DOWN</text>
  <rect x="228" y="380" width="60" height="34" rx="4" fill="#132C2A" stroke="#7DD3C7" stroke-width="1.2"/>
  <text x="258.0" y="396.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="11" font-weight="600" fill="#7DD3C7" text-anchor="middle">N4</text>
  <text x="258.0" y="408.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="9" font-weight="700" fill="#7DD3C7" text-anchor="middle">UP</text>
  <rect x="296" y="380" width="60" height="34" rx="4" fill="#132C2A" stroke="#7DD3C7" stroke-width="1.2"/>
  <text x="326.0" y="396.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="11" font-weight="600" fill="#7DD3C7" text-anchor="middle">N5</text>
  <text x="326.0" y="408.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="9" font-weight="700" fill="#7DD3C7" text-anchor="middle">UP</text>
  <rect x="24.0" y="440.0" width="342.0" height="60.0" rx="8" fill="#101C2F" stroke="#F2B263" stroke-width="1.2"/>
  <text x="36.0" y="465.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#F2B263">9:29 PM to 12:06 AM: 2h 37m quorum loss</text>
  <text x="36.0" y="485.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#EAF1FA">Full trading resumed at 3:49 AM ET</text>
  <rect x="24.0" y="520.0" width="342.0" height="80.0" rx="8" fill="#101C2F" stroke="#2F4A6E" stroke-width="1.2"/>
  <text x="36.0" y="545.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#EAF1FA">MSK defect stalled Kafka recovery</text>
  <text x="36.0" y="565.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">2 clusters stuck healing; manual partition</text>
  <text x="36.0" y="582.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">reassignment began at 3:00 AM ET</text>
  <text x="24.0" y="660.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="10" font-weight="400" fill="#64748B">Coinbase postmortem, June 1, 2026; times in ET</text>
</svg>
