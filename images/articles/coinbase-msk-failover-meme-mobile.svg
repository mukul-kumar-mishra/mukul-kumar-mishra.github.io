<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Coinbase matching-engine quorum recovery timeline</title>
  <desc id="desc">Coinbase's May 7, 2026 postmortem reports that AWS terminated placement-group instances at 9:29 PM ET on May 7, three of five matching-engine nodes went down and quorum was lost. Quorum returned at 12:06 AM ET on May 8, and full trading resumed at 3:49 AM ET on May 8.</desc>
  <style>text{font-family:Arial,Inter,sans-serif}.mono{font-family:Consolas,"Liberation Mono",monospace}</style>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <rect width="1200" height="68" fill="#0f172a"/>
  <text x="42" y="46" class="mono" font-size="32" font-weight="700" fill="#f8fafc">COINBASE · MATCHING-ENGINE RECOVERY</text>
  <text x="52" y="124" font-size="46" font-weight="700" fill="#0f172a">Quorum was lost at 9:29 PM ET.</text>
  <text x="54" y="163" font-size="28" fill="#475569">Coinbase's May 7 report · recovery milestones are May 8 ET</text>
  <rect x="50" y="184" width="1100" height="96" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="82" y="226" class="mono" font-size="42" font-weight="700" fill="#0f172a">9:29 PM</text>
  <text x="378" y="222" font-size="34" font-weight="700" fill="#0f172a">AWS terminated placement-group EC2.</text>
  <text x="378" y="259" font-size="28" fill="#475569">Three of five matching-engine nodes went down.</text>
  <rect x="50" y="295" width="1100" height="96" rx="12" fill="#e0f2fe" stroke="#0f172a" stroke-width="3"/>
  <text x="82" y="338" class="mono" font-size="42" font-weight="700" fill="#0f172a">12:06 AM</text>
  <text x="378" y="337" font-size="36" font-weight="700" fill="#0f172a">May 8 · quorum restored.</text>
  <text x="378" y="372" font-size="26" fill="#475569">Markets reopened in stages.</text>
  <rect x="50" y="406" width="1100" height="96" rx="12" fill="#dcfce7" stroke="#0f172a" stroke-width="3"/>
  <text x="82" y="450" class="mono" font-size="42" font-weight="700" fill="#0f172a">3:49 AM</text>
  <text x="378" y="449" font-size="36" font-weight="700" fill="#0f172a">May 8 · full trading resumed.</text>
  <text x="378" y="484" font-size="26" fill="#475569">The site and app recovered later.</text>
  <rect x="50" y="520" width="1100" height="124" rx="12" fill="#0f172a"/>
  <text x="80" y="566" class="mono" font-size="30" font-weight="700" fill="#86efac">THREE NODES DOWN · QUORUM LOST · MANUAL RECOVERY</text>
  <text x="80" y="610" font-size="26" fill="#f8fafc">Source: Coinbase Engineering, May 7, 2026 outage postmortem.</text>
</svg>
