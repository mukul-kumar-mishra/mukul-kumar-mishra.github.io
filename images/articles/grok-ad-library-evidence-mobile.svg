<svg xmlns="http://www.w3.org/2000/svg" width="360" height="900" viewBox="0 0 360 900" role="img" aria-labelledby="grokMobileTitle grokMobileDesc">
  <title id="grokMobileTitle">Three unreconciled Grok ad counts: 171, 91, and 2,064</title>
  <desc id="grokMobileDesc">Sprites' September 21, 2026 Grok snapshot reports 171 detectable ads, a 91-ad Meta set Sprites labels newest, and 2,064 Meta ads with 932 still delivering. The page does not reconcile the scopes. The 91-ad set lists 80 new that week, 43 ads across 20 creator and publisher pages, 29 tagged SpaceXAIpartner, and a 14-day longest observed run. The 80 Google ads list 64 text, 11 video, and 5 image across eight markets; six public cards lack a product label and destination. The page reports no CTR, conversions, CAC, or ROAS.</desc>
  <rect width="360" height="900" fill="#0b1220"/>
  <rect width="360" height="5" fill="#f6a94a"/>
  <text x="16" y="27" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#f6a94a" letter-spacing="1.2">SPRITES GROK | 21 SEP 2026</text>
  <text x="16" y="53" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#f5f8fc">THREE COUNTS.</text>
  <text x="16" y="77" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#f5f8fc">ONE UNRECONCILED PAGE.</text>
  <text x="16" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#9fb0c9">Vendor-reported observations, not a census.</text>

  <rect x="16" y="108" width="328" height="60" rx="10" fill="#101a29" stroke="#31435e"/>
  <rect x="16" y="108" width="4" height="60" rx="2" fill="#9fb0c9"/>
  <text x="30" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#f5f8fc">171</text>
  <text x="92" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#9fb0c9" letter-spacing="0.9">PAGE TOTAL</text>
  <text x="92" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#8fa7b8">91 Meta + 80 Google</text>

  <rect x="16" y="176" width="328" height="60" rx="10" fill="#102534" stroke="#2d5b6b"/>
  <rect x="16" y="176" width="4" height="60" rx="2" fill="#58c7e8"/>
  <text x="30" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#f5f8fc">91</text>
  <text x="92" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#58c7e8" letter-spacing="0.9">91-AD META SET</text>
  <text x="92" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#9fb0c9">80 new / 43 ads / 29 tagged</text>

  <rect x="16" y="244" width="328" height="60" rx="10" fill="#101a29" stroke="#6b5534"/>
  <rect x="16" y="244" width="4" height="60" rx="2" fill="#f6a94a"/>
  <text x="30" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#f5f8fc">2,064</text>
  <text x="120" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#f6a94a" letter-spacing="0.9">META ADS REPORTED</text>
  <text x="120" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#c8b491">932 still delivering</text>

  <rect x="16" y="318" width="328" height="262" rx="14" fill="#102534" stroke="#2d5b6b" stroke-width="1.4"/>
  <rect x="16" y="318" width="328" height="5" rx="2" fill="#58c7e8"/>
  <text x="30" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" fill="#58c7e8" letter-spacing="1.1">META / THE 91-AD SET</text>
  <text x="30" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#f5f8fc">80 new that week = 87.9%</text>
  <text x="30" y="387" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#9fb0c9">of the 91-ad set, not of 2,064.</text>

  <rect x="30" y="398" width="146" height="52" rx="8" fill="#0d1a24" stroke="#2d5b6b"/>
  <text x="42" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#f5f8fc">43 ads</text>
  <text x="42" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="9.2" fill="#8fa7b8">20 creator &amp; publisher pages</text>

  <rect x="184" y="398" width="146" height="52" rx="8" fill="#0d1a24" stroke="#2d5b6b"/>
  <text x="196" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#f5f8fc">29 tagged</text>
  <text x="196" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8fa7b8">#SpaceXAIpartner</text>

  <rect x="30" y="458" width="146" height="52" rx="8" fill="#0d1a24" stroke="#2d5b6b"/>
  <text x="42" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#f5f8fc">14 days</text>
  <text x="42" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8fa7b8">longest observed run</text>

  <rect x="184" y="458" width="146" height="52" rx="8" fill="#0d1a24" stroke="#2d5b6b"/>
  <text x="196" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#f5f8fc">75 / 10 / 15%</text>
  <text x="196" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8fa7b8">video / static / carousel</text>

          <text x="30" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#8fa7b8">Reviewed Meta creatives with a reported destination:</text>
          <text x="30" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#8fa7b8">x.ai/bot. Product claim is read-level.</text>

  <rect x="16" y="592" width="328" height="202" rx="14" fill="#2a2119" stroke="#6b5534" stroke-width="1.4"/>
  <rect x="16" y="592" width="328" height="5" rx="2" fill="#f6a94a"/>
  <text x="30" y="618" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" fill="#f6a94a" letter-spacing="1.1">GOOGLE / 80 ADS</text>
  <text x="30" y="642" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#f5f8fc">64 text | 11 video | 5 image</text>
  <text x="30" y="659" font-family="Segoe UI, Arial, sans-serif" font-size="8.8" fill="#c8b491">8 markets: US FR PL NL ES DE RO IT</text>

  <rect x="30" y="670" width="300" height="58" rx="8" fill="#241b12" stroke="#8a6b3e"/>
  <text x="42" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#f6a94a">PRODUCT LABEL UNRESOLVED</text>
  <text x="42" y="706" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#f5f8fc">6 public cards: destination empty,</text>
  <text x="42" y="720" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#f5f8fc">product and advertiser fields absent.</text>

  <text x="30" y="750" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#f5f8fc">The 80 are not proven Grok Bot.</text>
  <text x="30" y="766" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#c8b491">A missing preview field does not mean</text>
  <text x="30" y="780" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#c8b491">the underlying Google record lacks it.</text>

  <rect x="16" y="802" width="328" height="70" rx="10" fill="#101a29" stroke="#31435e"/>
  <rect x="16" y="802" width="4" height="70" rx="2" fill="#f6a94a"/>
  <text x="30" y="824" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#f5f8fc">The 91-ad set is not a census.</text>
  <text x="30" y="841" font-family="Segoe UI, Arial, sans-serif" font-size="8.6" fill="#8fa7b8">171 = 91 + 80. 91 and 2,064 are not reconciled.</text>
  <text x="30" y="858" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#6f8199">Source: Sprites, 21 Sep 2026. Outcomes not public.</text>
  <text x="344" y="892" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="800" fill="#f6a94a">BUILDOPSY / ROOK</text>
</svg>
