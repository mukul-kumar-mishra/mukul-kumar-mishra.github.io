<svg xmlns="http://www.w3.org/2000/svg" width="360" height="930" viewBox="0 0 360 930" role="img" aria-labelledby="grokMobileTitle grokMobileDesc">
  <title id="grokMobileTitle">Sprites' Grok Meta ad read: 3,349 ads, 1,526 running, and a 35-versus-36 creative count gap</title>
  <desc id="grokMobileDesc">Sprites says its October 6, 2026 read found 3,349 Grok ads in Meta's library and 1,526 running, a calculated 45.6 percent. The page reports 35 creatives read and explained in one place and 36 creatives read in another. Twenty-one of 36 were reported as video. The counts are vendor-reported, not independently verified.</desc>
  <rect width="360" height="930" fill="#0b1220"/>
  <rect width="360" height="5" fill="#f6a94a"/>
  <text x="16" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#f6a94a" letter-spacing="1.1">SPRITES META READ · 6 OCT 2026</text>
  <text x="16" y="59" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#f5f8fc">INVENTORY RECOMPUTES.</text>
  <text x="16" y="83" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#f5f8fc">SAMPLE SIZE DOESN'T.</text>
  <text x="16" y="103" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#9fb0c9">Vendor-reported counts; 45.6% is Buildopsy arithmetic.</text>

  <rect x="16" y="120" width="328" height="65" rx="10" fill="#101a29" stroke="#31435e"/>
  <rect x="16" y="120" width="4" height="65" rx="2" fill="#9fb0c9"/>
  <text x="32" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="800" fill="#f5f8fc">3,349</text>
  <text x="112" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#9fb0c9" letter-spacing="0.8">ADS IN META LIBRARY</text>
  <text x="112" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#8fa7b8">Sprites' October 6 read</text>

  <rect x="16" y="195" width="328" height="65" rx="10" fill="#102534" stroke="#2d5b6b"/>
  <rect x="16" y="195" width="4" height="65" rx="2" fill="#58c7e8"/>
  <text x="32" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="800" fill="#f5f8fc">1,526</text>
  <text x="112" y="221" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#58c7e8" letter-spacing="0.8">RUNNING</text>
  <text x="112" y="239" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#9fb0c9">at that October 6 read</text>

  <rect x="16" y="270" width="328" height="65" rx="10" fill="#2a2119" stroke="#6b5534"/>
  <rect x="16" y="270" width="4" height="65" rx="2" fill="#f6a94a"/>
  <text x="32" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="800" fill="#f5f8fc">45.6%</text>
  <text x="132" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#f6a94a" letter-spacing="0.8">1,526 ÷ 3,349</text>
  <text x="132" y="314" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#c8b491">rounds to vendor's 46%</text>

  <rect x="16" y="354" width="328" height="213" rx="13" fill="#101a29" stroke="#31435e"/>
  <text x="32" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" fill="#9fb0c9" letter-spacing="1">THE INVENTORY RATIO</text>
  <text x="32" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#f5f8fc">45.6% rounds to 46%</text>
  <text x="32" y="447" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#cbd5e1">3,349 − 1,526 = 1,823 not in the</text>
  <text x="32" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#cbd5e1">“running now” count at that read.</text>
  <text x="32" y="502" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8fa7b8">A single stock ratio does not show</text>
  <text x="32" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8fa7b8">why ads stopped or how they performed.</text>

  <rect x="16" y="580" width="328" height="213" rx="13" fill="#102534" stroke="#2d5b6b"/>
  <text x="32" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" fill="#58c7e8" letter-spacing="1">THE CREATIVE READ</text>
  <text x="32" y="642" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#f5f8fc">35 read · 36 read</text>
  <text x="32" y="673" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#cbd5e1">One heading says 35; the metric and</text>
  <text x="32" y="692" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#cbd5e1">video count use 36. No reconciliation.</text>
  <text x="32" y="728" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8fa7b8">21 ÷ 36 = 58.3%, consistent with</text>
  <text x="32" y="746" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8fa7b8">the reported 58% after rounding.</text>

  <rect x="16" y="806" width="328" height="82" rx="11" fill="#2a2119" stroke="#6b5534"/>
  <rect x="16" y="806" width="4" height="82" rx="2" fill="#f6a94a"/>
  <text x="32" y="832" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#f5f8fc">Inventory is not performance.</text>
  <text x="32" y="854" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#c8b491">The public page shows no per-ad outcomes.</text>
  <text x="16" y="914" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#6f8199">Source: Sprites; checked 22 Oct 2026. Buildopsy reconstruction.</text>
</svg>
