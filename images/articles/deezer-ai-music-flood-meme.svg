<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Deezer-reported AI music uploads, streams, and fraudulent plays</title>
  <desc id="desc">Three panels separate platform-reported measures: approximately 90,000 fully AI-generated tracks per day at a June 2026 peak, more than 50 percent of new deliveries on peak days, 1 to 3 percent of all platform streams, and up to 85 percent of streams on fully AI-generated tracks identified as fraudulent in 2025.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a2c"/><stop offset="1" stop-color="#1d2942"/></linearGradient>
    <linearGradient id="bar" x2="1"><stop stop-color="#7dd3c7"/><stop offset="1" stop-color="#9ae6b4"/></linearGradient>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#edf3fb}.muted{fill:#abbad0}.kicker{font-size:16px;font-weight:700;letter-spacing:2px;fill:#7dd3c7}.title{font-size:30px;font-weight:700}.metric{font-size:37px;font-weight:700}.caption{font-size:17px}.small{font-size:14px}.card{fill:#192741;stroke:#405776;stroke-width:2}.rule{stroke:#54708f;stroke-width:2}.chip{fill:#293955}
    </style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="58" y="60" class="kicker">CLAIM AUDIT / KEEP THE DENOMINATORS SEPARATE</text>
  <text x="58" y="106" class="title">Three measures. Three different populations.</text>
  <text x="58" y="140" class="muted" font-size="18">All figures below are reported by Deezer, not an independent census of streaming services.</text>

  <rect x="58" y="187" width="334" height="346" rx="18" class="card"/>
  <text x="86" y="229" class="kicker" font-size="14">UPLOAD VOLUME</text>
  <text x="86" y="289" class="metric">~90,000</text>
  <text x="86" y="320" class="caption">fully AI-generated tracks / day</text>
  <text x="86" y="348" class="small muted">June 2026 monthly average at reported peak</text>
  <rect x="86" y="389" width="273" height="26" rx="13" class="chip"/>
  <rect x="86" y="389" width="160" height="26" rx="13" fill="url(#bar)"/>
  <line x1="222" y1="381" x2="222" y2="424" stroke="#ffb36b" stroke-width="3"/>
  <text x="86" y="448" class="small muted">Over 50% of new deliveries</text>
  <text x="86" y="473" class="small muted">on peak days, per Deezer</text>
  <rect x="86" y="492" width="98" height="26" rx="13" fill="#2e3b55"/><text x="101" y="510" class="small">Peak share</text>

  <rect x="433" y="187" width="334" height="346" rx="18" class="card"/>
  <text x="461" y="229" class="kicker" font-size="14">LISTENING SHARE</text>
  <text x="461" y="289" class="metric">1–3%</text>
  <text x="461" y="320" class="caption">of all streams on Deezer</text>
  <text x="461" y="348" class="small muted">Deezer-reported platform measure</text>
  <line x1="461" y1="389" x2="737" y2="389" class="rule"/>
  <circle cx="485" cy="447" r="10" fill="#7dd3c7"/><text x="508" y="453" class="caption">Uploads ≠ listening</text>
  <circle cx="485" cy="487" r="10" fill="#ffb36b"/><text x="508" y="493" class="caption">Supply ≠ attention</text>

  <rect x="808" y="187" width="334" height="346" rx="18" class="card"/>
  <text x="836" y="229" class="kicker" font-size="14">FRAUD CLASSIFICATION</text>
  <text x="836" y="289" class="metric">Up to 85%</text>
  <text x="836" y="320" class="caption">of streams on AI tracks</text>
  <text x="836" y="348" class="small muted">Deezer's 2025 estimate of fraudulent plays</text>
  <rect x="836" y="389" width="273" height="26" rx="13" class="chip"/>
  <rect x="836" y="389" width="225" height="26" rx="13" fill="#f08d71"/>
  <text x="836" y="448" class="small muted">Subset of plays on fully AI-generated</text>
  <text x="836" y="473" class="small muted">tracks—not 85% of all platform streams.</text>
  <rect x="836" y="492" width="121" height="26" rx="13" fill="#49313a"/><text x="851" y="510" class="small">Company estimate</text>

  <line x1="58" y1="565" x2="1142" y2="565" class="rule"/>
  <text x="58" y="603" class="caption">Upload count measures supply. Stream share measures attention. Fraud share uses a separate flagged subset and period.</text>
  <text x="58" y="638" class="small muted">Deezer disclosures, Jan and Jul 2026. Definitions and caveats are linked in the audit.</text>
<image x="996" y="608" width="145" height="53" preserveAspectRatio="xMaxYMid meet" href="../logo.png"/>
</svg>
