<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Themed meme cartoon of an agent pressing retry on a failed install while the meter spins">
  <rect x="0" y="0" width="1200" height="680" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="680" fill="none" stroke="#0f172a" stroke-width="6"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a"/>
  <text x="36" y="41" font-family="monospace" font-size="22" font-weight="bold" letter-spacing="3" fill="#16a34a">FIELD MEME</text>
  <text x="948" y="41" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">Mukul<tspan dx="10" fill="#16a34a">Mishra</tspan></text>
  <text x="60" y="122" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">THE AGENT HAS ENTERED MEDITATION</text>
  <text x="60" y="156" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="21" font-style="italic" fill="#475569">attempt 47 of installing the same package.</text>
  <circle cx="200" cy="336" r="50" fill="#16a34a" stroke="#0f172a" stroke-width="4"/>
  <circle cx="183" cy="327" r="7" fill="#0f172a"/>
  <circle cx="217" cy="327" r="7" fill="#0f172a"/>
  <rect x="178" y="350" width="44" height="7" fill="#0f172a"/>
  <rect x="166" y="390" width="68" height="86" fill="#0369a1" stroke="#0f172a" stroke-width="4"/>
  <rect x="360" y="290" width="220" height="120" rx="60" fill="#e11d48" stroke="#0f172a" stroke-width="5"/>
  <text x="402" y="345" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="33" font-weight="bold" fill="#ffffff">RETRY</text>
  <text x="398" y="378" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="17" fill="#ffffff">install (again)</text>
  <rect x="680" y="190" width="460" height="300" fill="#0f172a" stroke="#0f172a" stroke-width="4"/>
  <text x="705" y="230" font-family="monospace" font-size="20" font-weight="bold" fill="#16a34a">$ tail build.log</text>
  <text x="705" y="270" font-family="monospace" font-size="18" fill="#fb7185">error: try another version</text>
  <text x="705" y="305" font-family="monospace" font-size="18" fill="#fb7185">error: different error now</text>
  <text x="705" y="340" font-family="monospace" font-size="18" fill="#fb7185">error: see previous error</text>
  <text x="705" y="380" font-family="monospace" font-size="18" fill="#f8fafc">new plan: same install</text>
  <text x="705" y="415" font-family="monospace" font-size="18" fill="#f8fafc">budget: what budget</text>
  <text x="705" y="450" font-family="monospace" font-size="18" fill="#16a34a">meter: spinning. cha-ching.</text>
  <rect x="60" y="540" width="1080" height="70" fill="#0f172a"/>
  <text x="90" y="585" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="25" font-weight="bold" fill="#f8fafc">learning nothing.</text>
  <text x="470" y="585" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="25" font-weight="bold" fill="#16a34a">billing everything.</text>
  <text x="840" y="585" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="17" font-style="italic" fill="#93a4ba">idempotency was right there.</text>
</svg>
