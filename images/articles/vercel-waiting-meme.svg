<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Pen sketched meme of a bored man watching a melting clock while the provider waits">
  <defs>
    <filter id="roughen" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1200" height="680" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="680" fill="none" stroke="#0f172a" stroke-width="6"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a"/>
  <text x="36" y="41" font-family="monospace" font-size="22" font-weight="bold" letter-spacing="3" fill="#16a34a">FIELD MEME</text>
  <text x="948" y="41" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">Mukul<tspan dx="10" fill="#16a34a">Mishra</tspan></text>
  <text x="60" y="122" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">HOLD ON. STILL HOLDING.</text>
  <text x="60" y="156" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="21" font-style="italic" fill="#475569">the provider will respond. eventually. maybe.</text>
  <g transform="translate(250,400)" filter="url(#roughen)" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="0" cy="-80" r="30" fill="#ffffff"/>
    <path d="M-16,-86 l18,0 M4,-86 l18,0"/>
    <path d="M-8,-56 l16,0"/>
    <rect x="-26" y="-48" width="52" height="98" fill="#ffffff"/>
  </g>
  <g transform="translate(830,360)" filter="url(#roughen)" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M-110,-60 q110,-30 220,0 q10,60 -30,90 q-70,50 -150,20 q-60,-30 -40,-110 z" fill="#ffffff"/>
    <circle cx="-70" cy="-20" r="6" fill="#0f172a"/>
    <circle cx="70" cy="-20" r="6" fill="#0f172a"/>
    <path d="M-70,-20 L-20,-34 M70,-20 L30,20"/>
    <path d="M-40,60 q-6,40 -20,52 M0,66 q0,40 -14,54" stroke="#e11d48"/>
    <text x="-105" y="120" font-family="monospace" font-size="17" fill="#0f172a" stroke="none">provider o'clock</text>
  </g>
  <g font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="20" font-style="italic" fill="#475569">
    <text x="560" y="300">14,800 hours</text>
    <text x="560" y="332">of this. billed.</text>
  </g>
  <rect x="60" y="540" width="1080" height="80" fill="#0f172a"/>
  <text x="90" y="590" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="25" font-weight="bold" fill="#f8fafc">still waiting on the provider.</text>
  <text x="700" y="590" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="25" font-weight="bold" fill="#16a34a">billed anyway.</text>
</svg>
