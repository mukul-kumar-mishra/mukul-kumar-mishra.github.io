<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="img-title img-desc">
<title id="img-title">Detected in six minutes. Cause identified about 110 minutes after onset.</title>
<desc id="img-desc">AWS reported an alert at 08:54 PDT, six minutes after packet loss began at 08:48. Root cause was identified at 10:38, with full recovery at 11:28 PDT. The event affected more than twelve listed services.</desc>
