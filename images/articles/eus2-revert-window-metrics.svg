<text x="54.0" y="137.0" font-size="31" font-weight="750" fill="#eff8ff" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="54.0" dy="0">Alerted in six minutes. Cause found by 10:38.</tspan></text>
<text x="56.0" y="177.0" font-size="17" font-weight="400" fill="#b5d0df" font-family="Inter, Arial, sans-serif" text-anchor="start"><tspan x="56.0" dy="0">AWS reported full mitigation by 11:28 PDT after a single-zone packet-loss event.</tspan></text>
