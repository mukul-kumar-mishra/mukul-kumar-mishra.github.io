<svg xmlns="http://www.w3.org/2000/svg" width="390" height="700" viewBox="0 0 390 700" role="img">
  <title>Razorpay decoupled VPA validation and payment flow</title>
  <desc>Illustrative summary of Razorpay splitting slow VPA validation from financial transaction flows.</desc>
<rect width="390" height="700" fill="#080F1C"/>
  <rect x="10" y="10" width="370" height="680" rx="12" fill="#141F33" stroke="#24344F" stroke-width="1.4"/>
  <text x="24.0" y="42.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#7DD3C7" letter-spacing="1.5">RAZORPAY / ARCHITECTURE</text>
  <text x="24.0" y="72.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#EAF1FA">VPA Validation Split</text>
  <line x1="24" y1="88" x2="366" y2="88" stroke="#2F4A6E" stroke-width="1"/>
  <rect x="24.0" y="110.0" width="342.0" height="130.0" rx="8" fill="#101C2F" stroke="#F2B263" stroke-width="1.4"/>
  <text x="36.0" y="136.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#F2B263">Slow VPA Validation</text>
  <text x="36.0" y="160.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">- Pre-payment address verification</text>
  <text x="36.0" y="180.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">- High latency third-party bank lookups</text>
  <text x="36.0" y="200.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">- Dedicated Kafka topics &amp; consumers</text>
  <text x="36.0" y="220.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">- Prevents slow queries blocking payments</text>
  <rect x="24.0" y="260.0" width="342.0" height="130.0" rx="8" fill="#101C2F" stroke="#7DD3C7" stroke-width="1.4"/>
  <text x="36.0" y="286.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#7DD3C7">Core Financial Payments</text>
  <text x="36.0" y="310.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">- Immediate debit and credit execution</text>
  <text x="36.0" y="330.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">- Strict low-latency SLAs</text>
  <text x="36.0" y="350.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">- Separate broker partition allocations</text>
  <text x="36.0" y="370.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9FB3CC">- Protected from upstream validation spikes</text>
  <rect x="24.0" y="410.0" width="342.0" height="90.0" rx="8" fill="#101C2F" stroke="#2F4A6E" stroke-width="1.2"/>
  <text x="36.0" y="438.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#EAF1FA">Design Lesson</text>
  <text x="36.0" y="460.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">Independent topics, consumer groups, and</text>
  <text x="36.0" y="478.0" font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9FB3CC">compute keep validation latency isolated.</text>
  <text x="24.0" y="660.0" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="10" font-weight="400" fill="#64748B">Razorpay UPI architecture; decoupled processing</text>
</svg>
