<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Razorpay reports separating VPA validation from financial flows</title>
  <desc id="desc">An illustrative diagram separates a slow VPA validation component from payment and mandate flows. Razorpay's retrospective describes independently deployable components with separate Kafka topics, consumer groups and compute; this is a summary, not an exact system topology.</desc>
  <style>text{font-family:Arial,Inter,sans-serif}.mono{font-family:Consolas,"Liberation Mono",monospace}</style>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <rect width="1200" height="66" fill="#0f172a"/>
  <text x="38" y="44" class="mono" font-size="30" font-weight="700" fill="#f8fafc">RAZORPAY · SERVICE ISOLATION</text>
  <text x="55" y="120" font-size="44" font-weight="700" fill="#0f172a">Separate the slow path from payments.</text>
  <rect x="50" y="155" width="1100" height="115" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="78" y="192" class="mono" font-size="30" font-weight="700" fill="#0f172a">VPA VALIDATION</text>
  <text x="78" y="244" class="mono" font-size="38" fill="#334155">independent service · separate consumer group</text>
  <rect x="50" y="285" width="1100" height="115" rx="12" fill="#e8f1f6" stroke="#0369a1" stroke-width="3"/>
  <text x="78" y="322" class="mono" font-size="30" font-weight="700" fill="#0369a1">PAYMENTS AND MANDATES</text>
  <text x="78" y="374" class="mono" font-size="32" fill="#334155">separate services · topics · groups · compute</text>
  <rect x="50" y="415" width="1100" height="105" rx="12" fill="#16a34a" stroke="#0f172a" stroke-width="3"/>
  <text x="78" y="455" class="mono" font-size="30" font-weight="700" fill="#dcfce7">REPORTED DESIGN CHANGE</text>
  <text x="78" y="500" class="mono" font-size="34" fill="#ffffff">Separate service capacity · independent deployment</text>
  <rect x="50" y="535" width="1100" height="110" rx="12" fill="#0f172a"/>
  <text x="78" y="577" class="mono" font-size="30" font-weight="700" fill="#f8fafc">Illustrative separation, not an exact topology diagram.</text>
  <text x="78" y="614" class="mono" font-size="24" fill="#cbd5e1">Source: Razorpay Engineering, “Five Years of Kafka at Razorpay’s UPI Switch”</text>
</svg>
