<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="grokTitle grokDesc">
  <title id="grokTitle">Sprites' Grok Meta ad read: 3,349 ads, 1,526 running, and a 35-versus-36 creative count gap</title>
  <desc id="grokDesc">Sprites says its October 6, 2026 read found 3,349 Grok ads in Meta's library and 1,526 running, a calculated 45.6 percent. The page reports 35 creatives read and explained in one place and 36 creatives read in another. Twenty-one of 36 were reported as video. The counts are vendor-reported, not independently verified.</desc>
  <rect width="1200" height="680" fill="#0b1220"/>
  <rect width="1200" height="7" fill="#f6a94a"/>
  <text x="52" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#f6a94a" letter-spacing="1.6">SPRITES META READ · 6 OCT 2026</text>
  <text x="52" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#f5f8fc">INVENTORY RECOMPUTES. SAMPLE SIZE DOESN'T.</text>
  <text x="52" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#9fb0c9">Vendor-reported counts; 45.6% is Buildopsy arithmetic, not an outcome measure.</text>

  <rect x="52" y="158" width="340" height="122" rx="14" fill="#101a29" stroke="#31435e" stroke-width="1.5"/>
  <rect x="52" y="158" width="340" height="6" rx="3" fill="#9fb0c9"/>
  <text x="78" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="47" font-weight="800" fill="#f5f8fc">3,349</text>
  <text x="78" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#9fb0c9" letter-spacing="1.2">ADS IN META LIBRARY</text>

  <rect x="430" y="158" width="340" height="122" rx="14" fill="#102534" stroke="#2d5b6b" stroke-width="1.5"/>
  <rect x="430" y="158" width="340" height="6" rx="3" fill="#58c7e8"/>
  <text x="456" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="47" font-weight="800" fill="#f5f8fc">1,526</text>
  <text x="456" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#58c7e8" letter-spacing="1.2">RUNNING IN OCTOBER 6 READ</text>

  <rect x="808" y="158" width="340" height="122" rx="14" fill="#2a2119" stroke="#6b5534" stroke-width="1.5"/>
  <rect x="808" y="158" width="340" height="6" rx="3" fill="#f6a94a"/>
  <text x="834" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="47" font-weight="800" fill="#f5f8fc">45.6%</text>
  <text x="834" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#f6a94a" letter-spacing="1.2">1,526 ÷ 3,349</text>

  <rect x="52" y="306" width="530" height="238" rx="16" fill="#101a29" stroke="#31435e" stroke-width="1.5"/>
  <text x="80" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#9fb0c9" letter-spacing="1.4">THE INVENTORY RATIO</text>
  <text x="80" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="800" fill="#f5f8fc">45.6% rounds to 46%</text>
  <text x="80" y="434" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#cbd5e1">3,349 − 1,526 = 1,823 not in the</text>
  <text x="80" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#cbd5e1">“running now” count at that read.</text>
  <text x="80" y="506" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8fa7b8">A single stock ratio does not show why ads stopped.</text>

  <rect x="618" y="306" width="530" height="238" rx="16" fill="#102534" stroke="#2d5b6b" stroke-width="1.5"/>
  <text x="646" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#58c7e8" letter-spacing="1.4">THE CREATIVE READ</text>
  <text x="646" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="800" fill="#f5f8fc">35 read · 36 read</text>
  <text x="646" y="434" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#cbd5e1">One heading says 35; the metric and</text>
  <text x="646" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#cbd5e1">video count use 36. No reconciliation.</text>
  <text x="646" y="506" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8fa7b8">21 ÷ 36 = 58.3%, consistent with reported 58%.</text>

  <rect x="52" y="570" width="1096" height="66" rx="12" fill="#2a2119" stroke="#6b5534"/>
  <rect x="52" y="570" width="6" height="66" rx="3" fill="#f6a94a"/>
  <text x="78" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#f5f8fc">Inventory is not performance.</text>
  <text x="78" y="624" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#c8b491">No per-ad spend, reach, conversions, or outcome data appear in the public page inspected.</text>
  <text x="52" y="665" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6f8199">Source: Sprites, “Grok ads &amp; commercials,” inspected 22 Oct 2026; page dates read to 6 Oct 2026. Buildopsy reconstruction.</text>
</svg>
