<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI's reported forced Navier–Stokes result and paper-to-Lean mismatch</title>
  <desc id="desc">The forced Navier–Stokes equation includes smooth external force f. Panels summarize OpenAI-reported search and Lean process figures and the October 6 preprint's m plus 4 versus m plus 5 estimate mismatch. The preprint authors do not judge the natural-language proof's correctness.</desc>
  <style>text{font-family:Arial,Inter,sans-serif}.mono{font-family:Consolas,"Liberation Mono",monospace}</style>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <rect width="1200" height="66" fill="#0f172a"/>
  <text x="38" y="44" class="mono" font-size="30" font-weight="700" fill="#f8fafc">NAVIER–STOKES · CLAIM AND CORRESPONDENCE</text>
  <text x="55" y="117" font-size="42" font-weight="700" fill="#0f172a">OpenAI claims a forced-system blow-up.</text>
  <rect x="50" y="145" width="1100" height="135" rx="12" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
  <text x="78" y="182" class="mono" font-size="30" font-weight="700" fill="#0369a1">FORCED INCOMPRESSIBLE SYSTEM · CLAIM SUMMARY</text>
  <text x="78" y="230" class="mono" font-size="37" fill="#0f172a">∂u/∂t + (u·∇)u = −∇p + νΔu + f</text>
  <text x="78" y="266" class="mono" font-size="32" fill="#334155">∇·u = 0 · smooth external force f · finite energy claimed</text>
  <rect x="50" y="290" width="1100" height="115" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="78" y="326" class="mono" font-size="30" font-weight="700" fill="#15803d">OPENAI-REPORTED PROCESS</text>
  <text x="78" y="371" class="mono" font-size="34" fill="#0f172a">~10,000 agents · 88h search · 17h Lean</text>
  <text x="78" y="398" class="mono" font-size="29" fill="#334155">~130B output tokens for the Navier–Stokes effort</text>
  <rect x="50" y="415" width="1100" height="132" rx="12" fill="#fffbeb" stroke="#e11d48" stroke-width="3"/>
  <text x="78" y="451" class="mono" font-size="30" font-weight="700" fill="#be123c">OCTOBER 6 PREPRINT · §3.1</text>
  <text x="78" y="495" class="mono" font-size="36" fill="#0f172a">Paper: m+4 · cited Lean estimate: m+5</text>
  <text x="78" y="533" class="mono" font-size="30" fill="#334155">Authors do not assess written-proof correctness.</text>
  <rect x="50" y="557" width="1100" height="89" rx="12" fill="#0f172a"/>
  <text x="78" y="592" class="mono" font-size="30" font-weight="700" fill="#f8fafc">OpenAI says it does not intend to claim the Millennium Prize.</text>
  <text x="78" y="628" class="mono" font-size="23" fill="#cbd5e1">Sources: OpenAI announcement · repository f9e8bc5 · arXiv:2610.08144v1</text>
</svg>
