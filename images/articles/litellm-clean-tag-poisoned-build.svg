<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Clean tag, poisoned build: the LiteLLM v1.107.0 release path</title>
  <desc id="desc">The v1.107.0 tag contains none of the three payload files. Ten commits in the lookalike repository Berri-AI/litellm add cook.pth, cook.py and sitecustomize.py, and a data equals cook build directive. The release workflow builds from commit 20535d8f in that fork and publishes seven wheels, four container tags and three image variants.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f2d2d"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#fbf7ef"/>
  <text x="60" y="66" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#171412">The tag was clean. The build was not.</text>
  <text x="60" y="98" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6b5b4e">LiteLLM v1.107.0 — ten commits above the release tag</text>

  <rect x="60" y="140" width="320" height="380" rx="18" fill="#f5ecdf" stroke="#d8c9b3"/>
  <text x="84" y="184" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2f6b4f">1. CLEAN TAG</text>
  <text x="84" y="224" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#171412">v1.107.0</text>
  <text x="84" y="254" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6b5b4e">66c8f5b1 · 06:59:32Z</text>
  <line x1="84" y1="276" x2="356" y2="276" stroke="#d8c9b3"/>
  <text x="84" y="310" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#171412">No cook.pth</text>
  <text x="84" y="342" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#171412">No cook.py</text>
  <text x="84" y="374" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#171412">No sitecustomize.py</text>
  <text x="84" y="420" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6b5b4e">pyproject.toml</text>
  <text x="84" y="446" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171412">version 1.108.0</text>
  <text x="84" y="470" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171412">no data = "cook"</text>

  <line x1="380" y1="330" x2="408" y2="330" stroke="#8f2d2d" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="410" y="140" width="360" height="380" rx="18" fill="#f5ecdf" stroke="#d8c9b3"/>
  <text x="434" y="184" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8f2d2d">2. POISONED FORK</text>
  <text x="434" y="224" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#171412">Berri-AI/litellm</text>
  <text x="434" y="254" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6b5b4e">10 commits · 08:56:59–10:46:29</text>
  <line x1="434" y1="276" x2="746" y2="276" stroke="#d8c9b3"/>
  <text x="434" y="310" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#171412">3 payload files added</text>
  <text x="434" y="342" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#171412">4 version bumps</text>
  <text x="434" y="374" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#171412">data = "cook" at 09:48:21</text>
  <text x="434" y="406" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#171412">COPY cook ./cook at 10:46:29</text>
  <text x="434" y="452" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6b5b4e">The tag review misses the build</text>
  <text x="434" y="476" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6b5b4e">directive and the wheel contents.</text>

  <line x1="770" y1="330" x2="798" y2="330" stroke="#8f2d2d" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="800" y="140" width="340" height="380" rx="18" fill="#f5ecdf" stroke="#d8c9b3"/>
  <text x="824" y="184" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#b07a10">3. RELEASE WORKFLOW</text>
  <text x="824" y="224" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#171412">Build &amp; sign</text>
  <text x="824" y="254" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6b5b4e">run 39587059944</text>
  <line x1="824" y1="276" x2="1116" y2="276" stroke="#d8c9b3"/>
  <text x="824" y="310" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#171412">source: Berri-AI/litellm</text>
  <text x="824" y="342" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#171412">revision: 20535d8f</text>
  <text x="824" y="374" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#171412">7 wheels · 4 tags</text>
  <text x="824" y="406" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#171412">3 image variants</text>
  <text x="824" y="452" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6b5b4e">Genuine provenance records</text>
  <text x="824" y="476" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6b5b4e">the malicious source.</text>

  <rect x="60" y="550" width="1080" height="78" rx="14" fill="#f4e6d2" stroke="#d8a83e"/>
  <text x="84" y="580" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#8f2d2d">The trust question:</text>
  <text x="84" y="608" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#171412">Provenance answers which workflow built the bytes, not who was authorized to choose the source.</text>
  <text x="60" y="662" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b5b4e">Sources: LiteLLM final attack-chain report, Oct 23 2026; GitHub compare a8113b0d...20535d8f; tag tree inspected.</text>
</svg>
