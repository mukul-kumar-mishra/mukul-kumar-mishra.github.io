<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Themed meme cartoon of a compaction event crushing a huge context window into a tiny summary while the agent forgets the codebase">
  <rect x="0" y="0" width="1200" height="680" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="680" fill="none" stroke="#0f172a" stroke-width="6"/>
  <rect x="0" y="0" width="1200" height="64" fill="#0f172a"/>
  <text x="36" y="41" font-family="monospace" font-size="22" font-weight="bold" letter-spacing="3" fill="#16a34a">FIELD MEME</text>
  <text x="948" y="41" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">Mukul<tspan dx="10" fill="#16a34a">Mishra</tspan></text>
  <text x="60" y="122" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">COMPACTION: A LOVE STORY</text>
  <text x="60" y="156" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="21" font-style="italic" fill="#475569">575K tokens of hard-won knowledge walks in.</text>
  <rect x="60" y="190" width="540" height="120" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
  <text x="80" y="232" font-family="monospace" font-size="19" fill="#1e293b">auth module: understood</text>
  <text x="80" y="262" font-family="monospace" font-size="19" fill="#1e293b">20 files read. plan held.</text>
  <text x="80" y="292" font-family="monospace" font-size="19" fill="#1e293b">3 edits from done ...</text>
  <text x="628" y="262" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="42" font-weight="bold" fill="#0f172a">--&gt;</text>
  <rect x="700" y="190" width="440" height="120" fill="#ffffff" stroke="#e11d48" stroke-width="4"/>
  <text x="720" y="232" font-family="monospace" font-size="19" fill="#1e293b">summary: "code exists.</text>
  <text x="720" y="262" font-family="monospace" font-size="19" fill="#1e293b">good luck."</text>
  <text x="720" y="292" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="17" font-style="italic" fill="#e11d48">under 1% survives</text>
  <circle cx="200" cy="446" r="50" fill="#16a34a" stroke="#0f172a" stroke-width="4"/>
  <circle cx="183" cy="437" r="7" fill="#0f172a"/>
  <circle cx="217" cy="437" r="7" fill="#0f172a"/>
  <rect x="176" y="460" width="48" height="7" fill="#0f172a"/>
  <rect x="166" y="500" width="68" height="86" fill="#0369a1" stroke="#0f172a" stroke-width="4"/>
  <ellipse cx="520" cy="430" rx="235" ry="72" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="325" y="420" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="21" fill="#1e293b">who are you people?</text>
  <text x="325" y="455" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="21" fill="#1e293b">that will be $0.074 per turn.</text>
  <rect x="800" y="360" width="340" height="160" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <rect x="800" y="360" width="340" height="40" fill="#0f172a"/>
  <text x="818" y="387" font-family="monospace" font-size="17" font-weight="bold" fill="#f8fafc">NEXT STEPS (AGENT)</text>
  <text x="818" y="425" font-family="monospace" font-size="17" fill="#1e293b">1. re-read 28 files</text>
  <text x="818" y="455" font-family="monospace" font-size="17" fill="#1e293b">2. bill twice for</text>
  <text x="818" y="485" font-family="monospace" font-size="17" fill="#1e293b">   the same lesson</text>
  <rect x="0" y="616" width="1200" height="64" fill="#0f172a"/>
  <text x="60" y="657" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">the tools are fine.</text>
  <text x="440" y="657" font-family="Sora, 'Segoe UI', Verdana, sans-serif" font-size="24" font-weight="bold" fill="#16a34a">the memory got mugged.</text>
</svg>
